name: One-time Claiming Moon afterword acceptance
on:
  push:
    branches:
      - translation/claiming-moon-afterword-canonical-20261021
    paths:
      - .github/workflows/one-time-claiming-moon-afterword.yml
permissions:
  contents: write
jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Confirm canonical source, no prior accepted afterword, and exact staged draft
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/book.py validate the-claiming-moon
          python scripts/corpus.py verify the-claiming-moon
          python - <<'PY'
          import json
          from pathlib import Path
          book = Path("books/the-claiming-moon")
          progress = json.loads((book / "progress.json").read_text(encoding="utf-8"))
          entry = progress["chapters"][47]
          assert entry["number"] == 48 and entry["unit_id"] == "chapter-000048"
          assert entry["status"] == "extracted"
          assert not (book / entry["translation_path"]).exists()
          source = (book / entry["source_path"]).read_text(encoding="utf-8")
          assert "## Afterword" in source
          assert "Please drop by the Archive" in source
          stage = (book / "migration-staging/048-afterword-UNREVIEWED.md").read_text(encoding="utf-8")
          assert "Послесловие" in stage and "Архив" in stage
          print("Afterword source and 2-block candidate confirmed. No current acceptance exists.")
          PY
      - name: Translator claim and canonical afterword artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/book.py claim the-claiming-moon 48 --role translator --session-id claiming-afterword-translator-20261021
          python - <<'PY'
          import json
          from pathlib import Path
          book = Path("books/the-claiming-moon")
          progress = json.loads((book / "progress.json").read_text(encoding="utf-8"))
          target = book / progress["chapters"][47]["translation_path"]
          target.parent.mkdir(parents=True, exist_ok=True)
          text = ("## Послесловие\n\n"
                  "Пожалуйста, загляните в Архив и оставьте комментарий, "
                  "чтобы автор узнал, понравилась ли вам его работа!\n")
          with target.open("x", encoding="utf-8") as file:
              file.write(text)
          print("Canonical afterword translation saved without altering intake draft.")
          PY
          python scripts/book.py accept-translation the-claiming-moon 48 --session-id claiming-afterword-translator-20261021 --json
          python scripts/book.py release the-claiming-moon 48 --session-id claiming-afterword-translator-20261021
      - name: Independent reviewer boundary and genuine hash-bound PASS
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/book.py claim the-claiming-moon 48 --role reviewer --session-id claiming-afterword-reviewer-20261021
          python - <<'PY'
          import json
          from pathlib import Path
          book = Path("books/the-claiming-moon")
          progress = json.loads((book / "progress.json").read_text(encoding="utf-8"))
          entry = progress["chapters"][47]
          assert entry["status"] == "translated" and "translation_acceptance" in entry
          source = (book / entry["source_path"]).read_text(encoding="utf-8")
          target = (book / entry["translation_path"]).read_text(encoding="utf-8")
          assert source.count("## Afterword") == 1
          assert "Please drop by the Archive and comment to let the creator know if you enjoyed their work!" in source
          assert target.strip() == ("## Послесловие\n\n"
                                   "Пожалуйста, загляните в Архив и оставьте комментарий, "
                                   "чтобы автор узнал, понравилась ли вам его работа!")
          # Full two-block bilingual review was performed against the actual
          # original prior to submission. These assertions guard exact reviewed
          # source/target bytes; PASS is not inferred from index counts alone.
          print("Reviewed both source blocks, heading and author note; no omissions.")
          PY
          python scripts/book.py review-record the-claiming-moon 48 --outcome PASS --session-id claiming-afterword-reviewer-20261021 --json
          python scripts/book.py accept-review the-claiming-moon 48 --json
          python scripts/book.py release the-claiming-moon 48 --session-id claiming-afterword-reviewer-20261021
      - name: Verify canonical state and persist atomically in this feature branch
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/book.py validate the-claiming-moon
          python scripts/corpus.py verify the-claiming-moon
          python scripts/book.py status the-claiming-moon --json
          python - <<'PY'
          import json
          from pathlib import Path
          b = Path("books/the-claiming-moon")
          p = json.loads((b / "progress.json").read_text(encoding="utf-8"))
          ledger = json.loads((b / "review-ledger.json").read_text(encoding="utf-8"))
          statuses = {c["number"]: c["status"] for c in p["chapters"]}
          assert statuses[48] == "reviewed"
          assert all(statuses[n] == "extracted" for n in range(1, 48))
          assert any(x["outcome"] == "PASS" and x["unit_id"] == "chapter-000048" for x in ledger["records"])
          print("PASS for afterword only; all other units unchanged")
          PY
          test -z "$(git diff --name-only HEAD -- books/the-claiming-moon/incoming books/the-claiming-moon/extracted books/the-claiming-moon/source)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- books/the-claiming-moon/translated books/the-claiming-moon/progress.json books/the-claiming-moon/review-ledger.json books/the-claiming-moon/.workflow
          git rm .github/workflows/one-time-claiming-moon-afterword.yml
          git diff --cached --name-status
          git commit -m "review(chapter-000048): accept independently checked Russian afterword"
          git push origin HEAD:translation/claiming-moon-afterword-canonical-20261021
