name: Automatic book translation
# Make the requested ID visible even when the job fails before starting.
run-name: Book translation ${{ inputs.job_id || 'next pending' }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "32-character intake job ID (leave blank for next pending)"
        type: string
        required: false
      resume_blocked:
        description: "Resume an explicitly selected model-blocked job"
        type: boolean
        required: false
        default: false
      resume_interrupted:
        description: "Resume an operator-blocked job using its existing live claim"
        type: boolean
        required: false
        default: false
  schedule:
    # Recovery when dispatch events are delayed or coalesced.
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      # Only explicit operator mode changes wake Auto, never book checkpoints.
      - 'books/**/.workflow/auto-control.json'

permissions:
  contents: write
  actions: write

# Each book is isolated at the process job; a short selector has no global lock.

jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.select.outputs.jobs }}
      has_jobs: ${{ steps.select.outputs.has_jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select one pending job and book scope
        id: select
        env:
          REQUESTED_JOB: ${{ inputs.job_id }}
          RESUME_BLOCKED: ${{ inputs.resume_blocked }}
          RESUME_INTERRUPTED: ${{ inputs.resume_interrupted }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RESUME_BLOCKED" == "true" || "$RESUME_INTERRUPTED" == "true" ]]; then
            if [[ ! "$REQUESTED_JOB" =~ ^[0-9a-f]{32}$ ]]; then
              echo "Resuming a blocked job requires its explicit job_id." >&2
              exit 1
            fi
          fi
          jobs="$(python automation/book_runner.py --list-ready-json --job-id "$REQUESTED_JOB")"
          if [[ "$jobs" == '[]' ]]; then
            echo 'jobs=[{"job_id":"none","book_key":"none"}]' >> "$GITHUB_OUTPUT"
            echo "has_jobs=false" >> "$GITHUB_OUTPUT"
          else
            echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
            echo "has_jobs=true" >> "$GITHUB_OUTPUT"
          fi

  process:
    needs: select
    if: needs.select.outputs.has_jobs == 'true'
    strategy:
      fail-fast: false
      # Avoid starting a huge per-book matrix from a single idle wake.
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.select.outputs.jobs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: automatic-book-${{ matrix.book_key }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute one pinned workflow checkpoint
        if: matrix.job_id != ''
        id: run
        env:
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_BASE_URL: ${{ vars.OMNIROUTE_BASE_URL }}
          OMNIROUTE_TRANSLATOR_MODEL: ${{ vars.OMNIROUTE_TRANSLATOR_MODEL }}
          OMNIROUTE_REVIEWER_MODEL: ${{ vars.OMNIROUTE_REVIEWER_MODEL }}
          OMNIROUTE_CORRECTOR_MODEL: ${{ vars.OMNIROUTE_CORRECTOR_MODEL }}
          OMNIROUTE_MODEL_CALL_LIMIT: ${{ vars.OMNIROUTE_MODEL_CALL_LIMIT }}
          JOB_ID: ${{ matrix.job_id }}
          RESUME_BLOCKED: ${{ inputs.resume_blocked }}
          RESUME_INTERRUPTED: ${{ inputs.resume_interrupted }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RESUME_BLOCKED" == "true" ]]; then
            python automation/book_runner.py --job-id "$JOB_ID" --resume-blocked
          elif [[ "$RESUME_INTERRUPTED" == "true" ]]; then
            python automation/book_runner.py --job-id "$JOB_ID" --resume-interrupted
          else
            python automation/book_runner.py --job-id "$JOB_ID"
          fi

      - name: Publish completed EPUB as a downloadable Actions artifact
        if: steps.run.outputs.done == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: translated-book-${{ matrix.job_id }}
          path: ${{ steps.run.outputs.artifact }}
          if-no-files-found: error
          retention-days: 30

      - name: Dispatch next bounded step
        if: steps.run.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_ID: ${{ matrix.job_id }}
        run: gh workflow run auto-translate.yml --ref main -f job_id="$JOB_ID"

      - name: Surface blocked book status as an Action failure
        if: steps.run.outputs.blocked == 'true'
        run: |
          echo "::error::Book automation checkpoint is blocked; inspect durable status."
          exit 1

      - name: Wake n8n delivery after a terminal job state
        if: always() && matrix.job_id != '' && (steps.run.outcome != 'success' || steps.run.outputs.done == 'true' || steps.run.outputs.continue_queue == 'true')
        continue-on-error: true
        env:
          N8N_DELIVERY_CALLBACK_URL: ${{ secrets.N8N_DELIVERY_CALLBACK_URL }}
          JOB_ID: ${{ matrix.job_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_CONCLUSION: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$N8N_DELIVERY_CALLBACK_URL" ]]; then
            echo "n8n callback is not configured; scheduled reconciliation remains available."
            exit 0
          fi
          payload="$(jq -n \
            --arg job_id "$JOB_ID" \
            --arg run_id "$RUN_ID" \
            --arg conclusion "$RUN_CONCLUSION" \
            '{job_id: $job_id, run_id: $run_id, conclusion: $conclusion, recipient: (if $conclusion == "success" then "user" else "admin" end), admin_alert: ($conclusion != "success")}')"
          curl --fail --silent --show-error --max-time 10 \
            -X POST "$N8N_DELIVERY_CALLBACK_URL" \
            -H 'Content-Type: application/json' \
            --data-binary "$payload"
