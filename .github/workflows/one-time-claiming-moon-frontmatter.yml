name: One-time Claiming Moon frontmatter admission
on:
  push:
    branches:
      - migration/claiming-moon-frontmatter-admission-20261022
    paths:
      - .github/workflows/one-time-claiming-moon-frontmatter.yml
permissions:
  contents: write
jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify canonical source and reconstruct separate prefatory units
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/book.py validate the-claiming-moon
          python scripts/corpus.py verify the-claiming-moon
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("books/the-claiming-moon")
          original = root / "source/The_Claiming_Moon.epub"
          expected = "611d1717e7997955619576a667073b79b815bf7606c6ea4513c823b01c53c9bb"
          if hashlib.sha256(original.read_bytes()).hexdigest() != expected:
              raise SystemExit("Trusted source EPUB does not match")
          progress = json.loads((root / "progress.json").read_text(encoding="utf-8"))
          manifest = json.loads((root / "source-manifest.json").read_text(encoding="utf-8"))
          if len(progress["chapters"]) != 48:
              raise SystemExit("Unexpected book reading order")
          drafts = root / "incoming/frontmatter-ru-draft.md"
          whole = drafts.read_text(encoding="utf-8")
          marker = "\n## Аннотация\n"
          if whole.count(marker) != 1:
              raise SystemExit("Ambiguous header/summary division")
          preface, content = whole.split(marker)
          preface = preface.rstrip() + "\n"
          synopsis = "# Луна присвоения\n\n**Автор:** Kooktaexd\n\n## Аннотация\n" + content.strip() + "\n"
          if len(preface) < 1900 or len(synopsis) < 700:
              raise SystemExit("Unexpected truncated historical frontmatter")
          for required in ["**Рейтинг:**", "**Предупреждение архива:**",
                           "**Дополнительные метки:**", "45 из 45"]:
              if required not in preface:
                  raise SystemExit("Preface lacks expected original field: " + required)
          for required in ["Чонгук", "Тэхён", "**Или**", "зелёный"]:
              if required not in synopsis:
                  raise SystemExit("Summary lacks expected original content: " + required)
          data = []
          for unit, content, label in ((1,preface,"preface"),(2,synopsis,"summary")):
              entry = progress["chapters"][unit-1]
              if (entry["unit_id"], entry["number"], entry["status"]) != (
                  f"chapter-{unit:06d}", unit, "extracted"):
                  raise SystemExit("Existing canonical state cannot be overwritten")
              if "translation_acceptance" in entry or (root / entry["translation_path"]).exists():
                  raise SystemExit("Translation already present for unit " + str(unit))
              src = root / entry["source_path"]
              manifest_entry = next(row for row in manifest["extracted"] if row["number"] == unit)
              if hashlib.sha256(src.read_bytes()).hexdigest() != manifest_entry["sha256"]:
                  raise SystemExit("Canonical source digest mismatch")
              stage = root / "migration-staging" / f"{unit:03d}-{label}-UNREVIEWED.md"
              stage.parent.mkdir(parents=True, exist_ok=True)
              if stage.exists() and stage.read_text(encoding="utf-8") != content:
                  raise SystemExit("Existing candidate changed; refusing overwrite")
              if not stage.exists():
                  with stage.open("x", encoding="utf-8") as dest:
                      dest.write(content)
              data.append({
                  "unit":unit, "label":label, "stage":stage.relative_to(root).as_posix(),
                  "target":entry["translation_path"], "source_sha256":manifest_entry["sha256"],
                  "translation_sha256":hashlib.sha256(content.encode("utf-8")).hexdigest(),
              })
          Path(".github/claiming-frontmatter-plan.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Perform real Translator claims and hash-bound acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          root = Path("books/the-claiming-moon")
          plan = json.loads(Path(".github/claiming-frontmatter-plan.json").read_text(encoding="utf-8"))
          assert [row["unit"] for row in plan] == [1,2]
          for row in plan:
              unit = row["unit"]
              session = f"claiming-moon-frontmatter-translator-{unit}-20261022"
              def cli(*args):
                  subprocess.run(["python", "scripts/book.py", *map(str, args)], check=True)
              cli("claim", "the-claiming-moon", unit, "--role", "translator", "--session-id", session)
              content = (root / row["stage"]).read_text(encoding="utf-8")
              target = root / row["target"]
              with target.open("x", encoding="utf-8") as dest:
                  dest.write(content)
              if hashlib.sha256(target.read_bytes()).hexdigest() != row["translation_sha256"]:
                  raise SystemExit("New translation hash mismatch")
              cli("accept-translation", "the-claiming-moon", unit, "--session-id", session, "--json")
              cli("release", "the-claiming-moon", unit, "--session-id", session)
          PY
      - name: Verify canonical progress and preserve previous review evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/book.py validate the-claiming-moon
          python scripts/corpus.py verify the-claiming-moon
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("books/the-claiming-moon")
          progress = json.loads((root / "progress.json").read_text(encoding="utf-8"))
          ledger = json.loads((root / "review-ledger.json").read_text(encoding="utf-8"))
          for unit in [1,2]:
              row = progress["chapters"][unit-1]
              assert row["status"] == "translated", row
              assert row["translation_acceptance"]["unit_id"] == row["unit_id"]
          assert progress["chapters"][47]["status"] == "reviewed"
          assert len(ledger["records"]) == 1
          assert ledger["records"][0]["unit_id"] == "chapter-000048"
          print("Canonical source-bound acceptance PASS: 2 frontmatter units translated, NOT reviewed")
          PY
          test -z "$(git diff --name-only HEAD -- books/the-claiming-moon/incoming books/the-claiming-moon/extracted books/the-claiming-moon/source books/the-claiming-moon/source-manifest.json books/the-claiming-moon/review-ledger.json)"
      - name: Save canonical result without persistent one-off workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p docs/migrations
          cp .github/claiming-frontmatter-plan.json docs/migrations/claiming-moon-frontmatter-accepted-unreviewed.json
          git add -- books/the-claiming-moon/migration-staging/001-preface-UNREVIEWED.md \
            books/the-claiming-moon/migration-staging/002-summary-UNREVIEWED.md \
            books/the-claiming-moon/translated books/the-claiming-moon/progress.json \
            books/the-claiming-moon/.workflow docs/migrations/claiming-moon-frontmatter-accepted-unreviewed.json
          git rm -- .github/workflows/one-time-claiming-moon-frontmatter.yml
          git diff --cached --name-status
          git commit -m 'migration: accept preface and summary as translated, awaiting literary review'
          git push origin HEAD:migration/claiming-moon-frontmatter-admission-20261022
