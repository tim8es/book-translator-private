name: Ephemeral Pi OmniRoute transport verification
# One-time, tiny, zero-write model compatibility test on an isolated branch.
on:
  push:
    branches:
      - ci/pi-live-smoke-20261121
    paths:
      - .github/workflows/pi-omniroute-live-smoke.yml
permissions:
  contents: read
jobs:
  pi-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout immutable public Pi adapter
        uses: actions/checkout@v4
        with:
          repository: tim8es/book-translator
          ref: ffcc39c1977cd36107510953ad6c689dabd10ab0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Pi 1.6.0
        run: npm install --global --ignore-scripts @earendil-works/pi-coding-agent@1.6.0
      - name: Repeat sequential Pi Translator and Reviewer with safe failure diagnostics
        shell: bash
        env:
          BOOK_TRANSLATOR_LLM_BACKEND: pi
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_BASE_URL: ${{ vars.OMNIROUTE_BASE_URL }}
          OMNIROUTE_TRANSLATOR_MODEL: ${{ vars.OMNIROUTE_TRANSLATOR_MODEL }}
          OMNIROUTE_REVIEWER_MODEL: ${{ vars.OMNIROUTE_REVIEWER_MODEL }}
          PI_AGENT_CONTEXT_WINDOW: "131072"
          PI_AGENT_MAX_TOKENS: "4096"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('automation').resolve()))
          from omniroute import complete
          from omniroute import parse_review

          if not all(os.environ.get(n) for n in
                     ('OMNIROUTE_API_KEY','OMNIROUTE_BASE_URL',
                      'OMNIROUTE_TRANSLATOR_MODEL','OMNIROUTE_REVIEWER_MODEL')):
              raise SystemExit("BLOCKED: OmniRoute Actions secret or variables are incomplete")

          import pi_backend
          _original_subprocess_run = pi_backend.subprocess.run
          def _sanitized_diagnostic_run(*args, **kwargs):
              proc = _original_subprocess_run(*args, **kwargs)
              if proc.returncode != 0:
                  stderr = (proc.stderr or "").lower()
                  allowlist = ["429", "rate limit", "503", "502", "504", "401",
                               "403", "404", "timeout", "connection", "abort",
                               "invalid", "stream", "error", "context", "model",
                               "fetch", "auth", "endpoint", "quota", "request"]
                  labels = [key.replace(" ", "_") for key in allowlist if key in stderr]
                  print("PI_SANITIZED_EXIT: code=" + str(proc.returncode) +
                        "; stderr_bytes=" + str(len(stderr)) +
                        "; keyword_categories=" + (",".join(labels) or "none"))
              return proc
          pi_backend.subprocess.run = _sanitized_diagnostic_run
          source = "The lighthouse lamp stayed lit through the storm. At dawn, the keeper opened the door."
          try:
              translation_response = complete(
                  "TRANSLATOR",
                  "You translate English narrative prose to natural Russian. Return only one valid JSON object with the single key translation. Do not omit or add content.",
                  "Translate the following original English narrative to Russian. Return JSON only:\n" + source)
              parsed = json.loads(str(translation_response))
              if not isinstance(parsed, dict) or set(parsed) != {'translation'}:
                  raise ValueError("invalid_translator_json_shape")
              result = parsed['translation']
              if not isinstance(result, str) or len(result) < 25 or not any('\u0400' <= char <= '\u04ff' for char in result):
                  raise ValueError("translation_is_not_russian")
              print("Pi Translator: JSON_VALID, RUSSIAN_TEXT, length=" + str(len(result)))
              review_response = complete(
                  "REVIEWER",
                  "You are an independent reviewer. Compare an original English excerpt and its Russian translation for accuracy, meaning, coverage, terminology, style, and structure. Return only a JSON object with exactly outcome, checks, findings. checks must have exactly coverage,meaning,terminology,style,structure, each true if you checked it. For PASS, findings must be []. For CORRECTIONS_REQUIRED, findings must contain 1-30 items with exactly severity (minor|major|critical), detail (string), resolved (false).",
                  "ORIGINAL:\n" + source + "\nTRANSLATION:\n" + result)
              outcome, details = parse_review(str(review_response))
              print("Pi independent Reviewer: JSON_VALID, outcome=" + outcome + ", findings=" + str(len(details['findings'])))
              print("TRANSPORT_SMOKE_COMPLETE")
          except Exception as exc:
              # Avoid exposing the original text, translation, API response, credentials
              # or Pi stderr. The sanitized error category identifies the failing layer.
              print("TRANSPORT_SMOKE_FAILED: " + type(exc).__name__ + ": " + str(exc)[:180], file=sys.stderr)
              raise SystemExit(1)
          PY
