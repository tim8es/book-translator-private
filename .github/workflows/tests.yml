name: tests

on:
  push:
    branches: [main]
    # Chat requests are validated and committed by chat-operations.yml.
    # Do not run the full test suite once per queue request.
    paths-ignore:
      - '.chat-ops/requests/**'
      - '.chat-ops/results/**'
      # Checkpoints, intake and receipts are high-frequency durable data.
      # Validate books in the batched workflow; retain full checks on PRs.
      - 'books/**'
      - 'intake/auto/**'
      - 'automation/status/**'
      - 'automation/notifications/sent/**'
  pull_request:

# Stable per-branch / per-PR concurrency stops superseded pushes from accumulating.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history for accurate changed-file scope
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide which checks to run
        id: scope
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          head = os.environ["GITHUB_SHA"]
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              base = event["pull_request"]["base"]["sha"]
          else:
              base = event.get("before", "")
          full = True
          paths = []
          if base and base != "0" * 40:
              changed = subprocess.run(
                  ["git", "diff", "--name-only", "-z", base, head],
                  check=True, stdout=subprocess.PIPE,
              ).stdout
              paths = [name.decode("utf-8") for name in changed.split(b"\0") if name]
              full = not paths or any(not name.startswith("books/") for name in paths)
          books = any(name.startswith("books/") for name in paths)
          Path(os.environ["RUNNER_TEMP"], "changed-book-paths.json").write_text(
              json.dumps([name for name in paths if name.startswith("books/")], ensure_ascii=False),
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              print(f"full={str(full).lower()}", file=stream)
              print(f"books={str(books).lower()}", file=stream)
          print(f"Changed paths: {len(paths)}. Full engine tests: {full}. Book artifact check: {books}.")
          PY

      # Only reusable Actions entrypoints belong in the book-state repository.
      # Shared business logic and tests are maintained in book-translator.
      - name: Prevent creation of ad-hoc book-specific workflows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          existing = {
              "auto-translate.yml",
              "omniroute-json-smoke.yml",  # reusable safe JSON compatibility probe
              "book-batch-validation.yml",
              "book-job-monitor.yml",
              "chat-operations.yml",
              "final-epub.yml",                    # generic, privacy-gated, pinned public caller
              "tests.yml",
          }
          directory = Path(".github/workflows")
          actual = {entry.name for entry in directory.iterdir()
                    if entry.is_file() and entry.suffix in (".yml", ".yaml")}
          unknown = sorted(actual - existing)
          missing = sorted(existing - actual)
          if unknown or missing:
              raise SystemExit(
                  "GitHub Actions topology drift; unexpected: " + ", ".join(unknown)
                  + "; missing: " + ", ".join(missing)
                  + ". Only reviewed reusable entrypoints are allowed."
              )
          print("Workflow topology check passed (seven reusable entrypoints).")
          PY

      - name: Set up Python 3.12
        if: steps.scope.outputs.full == 'true' || steps.scope.outputs.books == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Resolve immutable public Auto engine
        if: steps.scope.outputs.full == 'true' || steps.scope.outputs.books == 'true'
        id: shared_auto
        run: echo "sha=$(python automation/runtime_loader.py --print-revision)" >> "$GITHUB_OUTPUT"
      - name: Checkout public shared engine for integration tests
        if: steps.scope.outputs.full == 'true' || steps.scope.outputs.books == 'true'
        uses: actions/checkout@v7
        with:
          repository: tim8es/book-translator
          ref: ${{ steps.shared_auto.outputs.sha }}
          path: .public-auto-runtime
          fetch-depth: 1
          persist-credentials: false
      - name: Verify pinned public Auto source and state isolation
        if: steps.scope.outputs.full == 'true' || steps.scope.outputs.books == 'true'
        run: python automation/runtime_loader.py --verify
      - name: Validate changed books with each book's pinned public workflow
        if: steps.scope.outputs.books == 'true'
        run: python .github/scripts/verify_changed_books.py "$RUNNER_TEMP/changed-book-paths.json"
      - name: Compile private launchers and deployment contracts
        if: steps.scope.outputs.full == 'true'
        run: python -m compileall -q automation .github/scripts tests
      - name: Validate private immutable launchers and Actions topology
        if: steps.scope.outputs.full == 'true'
        run: python -m unittest discover -s tests -v
      - name: Run canonical public workflow and Auto regression suite
        if: steps.scope.outputs.full == 'true'
        run: cd .public-auto-runtime && python -m unittest discover -s tests -v
