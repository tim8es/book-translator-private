name: Translate Blood and Honey unit 12

on:
  push:
    paths:
      - '.github/workflows/blood-honey-translate-unit-12.yml'

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tim8es/book-translator
          ref: a0c1a3c450a8251d2d90f4de5d5a988b5466958f
          path: .workflow-engine
      - name: Claim unit 12 as translator
        shell: python
        run: |
          import os, sys
          from pathlib import Path
          sys.path.insert(0, str((Path('.workflow-engine') / 'scripts').resolve()))
          from workflow.claims import ClaimManager
          from workflow.filesystem import FilesystemStorage
          from workflow.repository import WorkflowStateRepository
          from workflow.schemas import SchemaKind
          book = Path('books/blood-and-honey-rbmk-caleb-pov').resolve()
          repo = WorkflowStateRepository(FilesystemStorage(book))
          progress = repo.read('progress.json', SchemaKind.PROGRESS)
          metadata = repo.read('metadata.json', SchemaKind.METADATA).data
          ClaimManager(repo).acquire(progress.data, '12', role='translator',
              session_id=f"gha-{os.environ['GITHUB_RUN_ID']}-translator-012",
              base_revision=progress.version, base_commit=os.environ['GITHUB_SHA'],
              workflow_revision=metadata['workflow']['resolved_revision'])
      - name: Write Russian Chapter 10 translation
        shell: bash
        run: |
          cat > books/blood-and-honey-rbmk-caleb-pov/translated/012-chapter-10.md <<'EOF'
          ## Глава 10

          Примечания к главе

          > Калеб, ты очаровательный идиот. Я прекрасно понимаю желание защитить себя, но, может быть, один нормальный разговор избавил бы нас примерно от половины всей этой мучительной драмы во втором акте. Впрочем, я отвлеклась. То, что оба этих мужчины невероятно умны, ещё не значит, что хоть у одного из них есть здравый смысл или эмоциональный интеллект.

          Калеб спросил одного из охранников в коридоре у своей комнаты, есть ли в поместье конкурные препятствия. Тот ответил, что им понадобится час, чтобы всё подготовить. Калеб старался не мерить комнату шагами — под кожей гудела беспокойная энергия, — поэтому стащил из бара бутылку скотча, который, как он прекрасно знал, стоил неприлично дорого, и, ожидая, пил прямо из горлышка. Напиваться он не собирался — алкоголь и лошади плохо сочетались, — но хотя бы немного притупить остроту происходящего было необходимо. Нужно было лишь на время заставить бешено несущиеся мысли замолчать.

          Тот же охранник нашёл его и сообщил, что препятствия готовы, как раз когда солнце опустилось к горизонту, словно собираясь его поцеловать. Калеб пошёл через гостиную и замер, услышав приглушённые голоса на террасе. Ариана и Люсьена он не видел с середины дня и решил, что хотя бы стоит сказать Ариану, куда направляется.

          Он остановился в дверях. Лицо дрогнуло, грудь пронзила боль — слишком близко они стояли друг к другу. Ариан смотрел с балкона наружу. Грудь Люсьена почти касалась его плеча, ладонь лежала поверх руки Ариана на перилах, а говорил он прямо ему в ухо.

          Ариан его не остановил.

          Калеб знал: Ариан не любил, когда к нему прикасались — обычно именно он был тем, кто прикасался первым, — особенно настолько интимно. Увиденное выбило Калеба из равновесия, глаза обожгло. Прежде чем он успел сделать какую-нибудь глупость — вмешаться или снова выставить себя грубым идиотом, — Калеб развернулся на каблуках и сбежал из комнаты.

          Остановился только у конюшен. Там его уже ждал осёдланный и взнузданный чистокровный рыжий конь. Калеб отвязал поводья, вывел его на манеж, вскочил в седло и сразу пустил в галоп.

          Он растворился в привычном ритме верховой езды, стараясь не замечать, как отзываются ноющие мышцы, и не вспоминать причину этой боли. Оттолкнул прочь злость, боль и стыд, сосредоточился на манеже вокруг. Делать то, что он любил, было приятно — только полностью насладиться этим всё равно не получалось.

          Когда требовалось, Калеб отлично умел раскладывать жизнь по отдельным ящикам. Ариан методично разрушил каждую перегородку. Сначала украл самого Калеба, а меньше чем за месяц сумел забрать и его сердце.

          Калеб гадал, не был ли он для Ариана просто очередным завоеванием, хотя маленький упрямый голос внутри называл его дураком за одну только мысль об этом. Он не понимал, что теперь между ними. Они переспали. Ариан убивал ради него. Спасал ему жизнь больше раз, чем Калеб мог сосчитать. Принял за него пулю и собственным телом закрыл от взрыва.

          Но что всё это значило?

          Калеб был средством достижения цели — способом уйти от договорного брака с женщиной, которой Ариан не хотел. Он просто защищал собственные интересы, повторял Калеб своему упрямому, кровоточащему сердцу. Не более того. А то, что сам Калеб влюбился — и влюбился по уши, — к делу не относилось. В конце концов, это не было проблемой Ариана. Он ничего не был должен Калебу, тем более свои чувства.

          Калеб решил, что способен стать тем, кто нужен Ариану: фиктивным мужем. Он достаточно о нём заботился, чтобы довести дело до конца. Ему было всё равно, что это сделает с его собственным сердцем, — солгал Калеб самому себе.

          Он будет стоять рядом с Арианом и безупречно играть свою роль столько, сколько потребуется. Может, они даже сумеют пережить это и стать друзьями. Прошлая ночь останется горячим воспоминанием, единичным случаем — и ничем больше.

          Ему просто нужно время, чтобы позлиться и поболеть, а потом снова запереть Ариана в коробке где-то в самом дальнем углу сознания. Одна часть Калеба знала, что это невозможно. Остальная упрямо отказывалась слушать.

          Конь громко заржал, и Калеб поднял голову.

          Ариан бежал к нему на полной скорости.

          Калеб резко потянул поводья в сторону, разворачивая коня, чтобы не налететь на него лоб в лоб. Его стащили из седла, и он полетел в песок. Над ним оказалось тяжело дышащее, дрожащее тело Ариана; их лбы почти соприкасались.

          Долгое напряжённое мгновение Ариан смотрел на коня, широко распахнув глаза и тяжело вздымая грудью. Затем уронил подбородок на плечо Калеба и с облегчением выдохнул.

          Калеб толкнул его, пока Ариан не отстранился, и поспешно сел. Ладони ушли в рыхлый песок. Калеб сердито уставился на него. Что он вообще творит?

          — Что с тобой такое?! — потребовал Калеб.

          Из-за этой выходки они оба могли серьёзно пострадать.

          Ариан покачал головой, губы сжались в тонкую линию. Потом он протянул руки, поднял Калеба на колени и стиснул в объятиях так, словно заключил в тиски.

          Калеб явно что-то упустил.

          Ариан был напуган. По-настоящему.

          Он держался за Калеба так, будто тот что-то для него значил, и принцу казалось, что его швыряет из одной эмоции в другую. Мужчина, который сейчас едва не выдавливал воздух из его лёгких, совсем не походил на того, кто несколько часов назад не смог ответить ему в коридоре.

          Ариан отстранился и положил ладони на бицепсы Калеба. Глаза пожирали каждую черту его лица — словно Ариан боялся, что больше никогда его не увидит.

          — Что? — выдохнул Калеб.

          Ладони Ариана поднялись и обхватили лицо. Он поцеловал Калеба — раз, второй, медленно и тщательно. Даже отстранившись, Ариан продолжал дрожать; дыхание сбивалось, взгляд был диким.

          Калеб упёрся в его грудь и оттолкнул. Ариан опустился на колени в песок. Калебу нужно было пространство, чтобы подумать.

          Ариан выглядел уязвимым и сломленным, страх стягивал черты, но Калеб по-прежнему не понимал, кто они друг другу. А имело ли это значение? — спросил он себя. Он испытывал к Ариану чувства, возможно, даже любил его. Но сможет ли довольствоваться вот этим? Этой страстью и потребностью, которая заставляла обоих флиртовать, давить и дразнить друг друга; из-за которой Ариан убивал, а Калеб бил словами.

          В глазах Ариана блестели невыплаканные слёзы. Калеб понимал: им надо поговорить. Он точно упустил что-то важное.

          Вместо разговора Калеб рванулся вперёд, схватил Ариана за шею с обеих сторон и притянул к поцелую — торопливому, беспорядочному, обнажённому до боли. В голове происходило слишком много, гораздо больше, чем он мог вынести. Единственным, что имело смысл, было это. Они. Огонь в пространстве между общими вдохами.

          Калеб продвинулся вперёд на коленях, стараясь убрать расстояние между ними. Ариан ответил с той же яростью, вцепился в его пиджак, обхватил спину — и они потеряли равновесие. Ариан рухнул на спину в песок, Калеб оказался сверху, уперев одну ладонь в землю, чтобы не навалиться всем весом.

          Они продолжали пожирать друг друга: отчаянные руки и губы хватали, тянули, цеплялись, пока оба лежали на земле.

          Ариан перевернул их, поднялся на колени и потянул Калеба за собой, затем встал и помог ему подняться. Едва Калеб оказался на ногах, Ариан снова прижался к нему: руки крепко обхватили спину, губы вытягивали воздух из лёгких.

          Они, не разрывая объятий, спотыкались в сторону конюшни, пока пятка Калеба не зацепилась за тюк сена и он не упал на него спиной.

          Ариан упал следом и пополз между его ног. Калеб зацепил пяткой его бедро. Ариан впился в шею — зубы и язык терзали кожу, заставляя Калеба стонать.

          Но ему нужно было знать. Нужны были ответы, прежде чем он полностью отдастся ослепляющей потребности, которую Ариан пробуждал в нём.

          — А где твой новый лучший друг с бонусами? — спросил Калеб.

          Голос звучал так, будто с него содрали кожу; слова вылетели торопливо и зло.

          Ариан застыл.

          Он поднялся над Калебом на прямых руках. Глаза были тёмными, но умоляющими.

          — Между нами ничего нет. Он оказался совсем не тем человеком, каким я его считал.

          В серо-зелёных глазах смешались злость и предательство.

          На Калеба? Или на Люсьена?

          Жар отступил при мысли о блондине, которого Калеб видел прижавшимся к боку Ариана. На губах появилась тёмная, болезненная улыбка. Калебу было больно; чувства выплёскивались наружу и лужей собирались у ног Ариана. И всё же он не мог избавиться от желания заставить того почувствовать то же самое.

          — Расслабься. Ты ничего не обязан мне объяснять. Наши отношения целиком строятся на взаимном использовании.

          Едва жестокие слова сорвались с губ, Калеб уже знал, что лжёт. Он больше никогда не сможет видеть в Ариане только контракт. И после всего случившегося сомневался, что Ариан смотрит на него именно так.

          — Мы используем друг друга, чтобы получить то, чего на самом деле хотим. Поэтому наш договорной брак одинаково выгоден обеим сторонам.

          Ложь. Всё до последнего слова.

          Но Калеб больше не мог позволять этому человеку делать ему больно своими переменчивыми, непредсказуемыми настроениями. С каждым словом он ненавидел себя чуть сильнее, однако должен был защититься. Нельзя позволить Ариану продолжать отрезать жизненно важные куски его сердца.

          — С кем ты заводишь романы в свободное время — не моё дело.

          Калеб попал точно в цель. Ариан выглядел уничтоженным. Его взгляд метался между глазами Калеба.

          — Ты правда думаешь, что между нами только это?

          Словно Калеб вообще знал ответ. Ариан не разговаривал с ним. Не ответил, когда Калеб задал тот же вопрос несколько часов назад. Калеб знал только одно: Ариана нужно загнать обратно в коробку в собственной голове. Если ради этого придётся стать бессердечным, жестоким и лгать ему в лицо — он сделает это. А ненавидеть себя будет потом.

          — А что ещё? — фыркнул Калеб. — Ты ожидал, что мы без памяти влюбимся друг в друга?

          Сам Калеб точно не ожидал. Что не помешало ему влюбиться, конечно, но в момент согласия это совершенно не входило в план. Они даже установили правила.

          *Он* установил правила.

          А потом сам же их нарушил. И теперь беспомощно пытался собрать оставшиеся осколки.

          — Та ночь — всё, что между нами произошло, — для тебя ничего не значит? — потребовал Ариан.

          — Ах да, та ночь.

          Сила слов Калеба заключалась в истинах, из которых он строил ложь, — поэтому они резали ещё больнее.

          — Предательства, перестрелки, взрывы. Всё вместе — сплошной выброс адреналина. К тому же раньше я никогда не был с мужчиной.

          Он пожал плечами, выдрал последние зубчатые осколки собственного разбитого сердца и бросил их в Ариана кинжалами с острия языка.

          — Любопытство взяло верх.

          Ариан поднялся. Глаза были тёмными и холодными.

          — *Любопытство*, — мрачно повторил он.

          Калеб сел и поправил манжету пиджака, лишь бы не смотреть в глаза Ариану.

          — Открой любой таблоид — найдёшь минимум двадцать историй обо мне.

          Здесь он надел самую ослепительную, озорную улыбку.

          — Я *знаменит* тем, что совершенно безрассуден. Для меня всё это никогда ничего *не значит*.

          Улыбка исчезла, когда слова повисли в воздухе правдой. Большинство связей Калеба были неглубокими, поверхностными. Сам факт того, что он принц, создавал перекос власти и ломал любую попытку нормальности или близости. Ничто никогда ничего не значило — кроме того, что Калеб мог сделать для Короны.

          Ариан значил.

          Значил для Калеба больше, чем тот вообще считал возможным. Именно поэтому всё надо было остановить, пока не зашло слишком далеко. Калеб не переживёт, если они продолжат — а потом Ариан снова его оттолкнёт.

          Улыбка, которую Калеб показал сейчас, была самым сильным оружием в арсенале принца: легкомысленная, беззаботная, скрывающая настоящий водоворот чувств. Он непринуждённо прислонился к стене возле сена и для убедительности скрестил ноги в щиколотках.

          На этот раз эмоции Ариана были написаны на лице открыто. При виде чистого отчаяния, от которого загорелая кожа побледнела, Калеб мёртвой хваткой вцепился в собственную маску.

          — Но, если это хоть чего-то стоит, целуешься ты охренительно.

          Последний выстрел — чтобы загнать нож ещё глубже и развеять по ветру пепел моста, который он только что сжёг дотла.

          От Ариана исходила ледяная ярость. Калеб вздрогнул, когда кулак полетел в его сторону. Рядом с головой раздался тяжёлый удар костей о стену, и адреналин ударил в кровь.

          Похоже, свою задачу Калеб выполнил слишком хорошо. Если Ариан его возненавидит, Калебу хотя бы будет не так мучительно оттого, что пришлось причинить ему боль, лишь бы не дать им обоим сделать что-то, о чём потом пожалеют.

          — Я не терплю, когда люди играют с моими чувствами, — прорычал Ариан холодным, непреклонным голосом.

          Калеб понимал: он идёт по опасной грани. Если зайти слишком далеко, Ариан может решить просто убить его и закончить на этом. Но теперь, начав, Калеб уже не мог прикусить язык. И не мог забрать слова обратно — острый язык уже превратился в нож и оставил его истекать кровью.

          — Человек, у которого каждый палец в крови, рассуждает о чувствах. Ирония тебе понятна, правда?

          Взгляд прошёл вверх по напряжённому телу Ариана и расширился, заметив кровь: она капала в сено с разбитых костяшек сжатого кулака. Это наверняка было больно. Калеб сделал это с ним. Довёл до этой точки.

          Ариан указал на чёрного жеребца в соседнем деннике.

          — Этот конь принадлежал моему брату. Пять лет назад он предал семью, и разобраться с этим должен был я. Мой отец… мой отец не смог. Он слишком сильно его любил. И в тот единственный момент милосердия брат вместо этого убил его. Тогда я застрелил брата и стал самым молодым Крёстным отцом в истории семьи Конти.

          У Калеба перехватило дыхание. Он и раньше понимал: в прошлом Ариана пролилась кровь, и именно она привела его к титулу Крёстного отца. Но Калеб даже представить не мог, через что тот прошёл. Что ему пришлось сделать.

          — Ты прав. На моих руках кровь. Кровь моей семьи.

          Один уголок рта Ариана поднялся в холодной усмешке. Теперь на нём была маска Крёстного отца — неприкасаемого и жестокого. Но в глубине глаз всё ещё вспыхивала боль.

          — Такой человек, как я, не имеет права говорить о чувствах.

          Калеб со стыдом опустил глаза. Ариан покачал головой и ушёл прочь, оставив его наедине с мыслями.

          — Что я натворил? — несчастно прошептал Калеб самому себе.

          +++

          Калеб понятия не имел, сколько просидел, прислонившись к тюкам сена. Он думал, что поступает правильно, отталкивая Ариана. Им не смогут причинить боль, если они не свяжутся друг с другом. Им не смогут причинить боль, если всё останется деловым. Им не смогут причинить боль, если они будут соблюдать правила.

          Для этого было уже слишком поздно.

          Калеб знал.

          И всё равно причинил Ариану боль. Набросился с клыками и кинжалами, разорвал в кровавые клочья любой шанс на то, что между ними вообще могло быть. Теперь остались только вмятина в стене конюшни и засыхающая в сене кровь.

          Ариан не был человеком, который прощает, и Калеб это понимал. Он не мог позволить себе роскошь вторых шансов. Именно поэтому так резко отругал Калеба, когда тот второй раз пощадил Пола.

          Вторые шансы причиняют боль.

          Вторые шансы убивают.

          Ариан был мафиозным Крёстным отцом. У него не было выбора — только безжалостность.

          Наверное, это ужасно утомительно.

          Калеб задумался, мог ли Ариан найти покой рядом с ним — человеком, далёким от тьмы его мафиозной жизни. Теперь это было лишь мечтой. Калеб тщательно и намеренно уничтожил любой шанс стать для Ариана тихой гаванью.

          Он не знал, что будет дальше. Не представлял, как они станут вести себя друг с другом. Но дразнящие улыбки и флирт остались в прошлом.

          — Ваше Высочество, — прозвучал голос из теней слева.

          На мгновение Калеб подумал, что у него галлюцинации.

          На свет вышел Пол. Сердце Калеба забилось быстрее. Он знал, что Ариан отпустил его, когда несколько недель назад Калеб не позволил застрелить Пола на выгоне. Сейчас тот выглядел целым и здоровым, в тёмно-синем костюме.

          — Что ты всё ещё здесь делаешь? — спросил Калеб, по-прежнему не уверенный, что видит реального человека.

          Пол протянул небольшую книжицу.

          — Ваш паспорт.

          Калеб взял её, потрясённо нахмурившись.

          — У принца Эндрю за эти годы накопилось немало врагов. Я тайно свёл их вместе. Они готовы приветствовать вас дома, Ваше Высочество.

          Тоска полоснула Калеба по груди.

          Дом.

          Месяц назад этим словом он назвал бы роскошный дворец, до краёв наполненный семьёй, придворными и охраной. Теперь Калеб знал: они предали его, продали и сделали козлом отпущения ради собственного образа.

          И всё равно он скучал по семье. По сёстрам. Без Эндрю и, если честно, без Отца он вполне мог обойтись, но трудно было представить, что сёстры имели хоть какое-то отношение к случившемуся. Калеб гадал, что им вообще известно — если известно хоть что-нибудь.

          А теперь перед ним стоял Пол и предлагал шанс вернуться к прежней жизни — во дворец, к великолепию и людям, которых Калеб любил. После ссоры с Арианом грудь и так ныла от эмоций, и теперь боль резко кольнула снова.

          Ариан.

          Что Калебу делать с Арианом?

          — Я знаю, у вас есть все причины мне не доверять, — сказал Пол, прерывая его мысли. — Но вы пощадили мне жизнь. Отныне клянусь служить вам до последнего вздоха.

          Калеб знал: Эндрю держал жизнь матери Пола в своих руках. И всё же Пол стоял здесь и клялся Калебу в верности.

          — Зачем тебе это?

          — Я знаю вас много лет. Вы умны, решительны, вам не всё равно на людей. Именно вы должны стать следующим королём.

          Пол говорил с такой уверенностью, что Калеб растерялся. Такая вера в него ошеломляла — особенно сейчас, когда сам Калеб совершенно не понимал ни чего хочет, ни что ему делать.

          — Эндрю может угрожать моей жизни, но моего уважения и верности он не заслуживает. Завтра вечером в восемь у причала будет ждать корабль, который отвезёт вас домой.

          Калеб посмотрел на паспорт в своих руках, затем снова на Пола.

          — Переспите с этой мыслью, Ваше Высочество. Завтра в восемь.

          Секретарь поклонился и снова исчез в тенях, оставив Калеба наедине с мыслями.

          Он даже не знал, с чего начать.
          EOF
      - name: Accept unit 12 translation and release claim
        shell: python
        run: |
          import os, sys
          from pathlib import Path
          sys.path.insert(0, str((Path('.workflow-engine') / 'scripts').resolve()))
          from workflow.claims import ClaimManager
          from workflow.filesystem import FilesystemStorage
          from workflow.repository import WorkflowStateRepository
          from workflow.schemas import SchemaKind
          from workflow.translations import TranslationAcceptanceManager
          book = Path('books/blood-and-honey-rbmk-caleb-pov').resolve()
          repo = WorkflowStateRepository(FilesystemStorage(book))
          reader = lambda p: (book / p).read_bytes()
          progress = repo.read('progress.json', SchemaKind.PROGRESS)
          metadata = repo.read('metadata.json', SchemaKind.METADATA).data
          session = f"gha-{os.environ['GITHUB_RUN_ID']}-translator-012"
          TranslationAcceptanceManager(repo, artifact_reader=reader).accept(
              progress.data, progress.version, metadata, 12, session_id=session)
          progress = repo.read('progress.json', SchemaKind.PROGRESS)
          ClaimManager(repo).release(progress.data, '12', session_id=session,
              detail='full literary translation from sealed source completed')
          final = repo.read('progress.json', SchemaKind.PROGRESS).data
          if next(c for c in final['chapters'] if c['number'] == 12)['status'] != 'translated':
              raise RuntimeError('unit 12 was not accepted as translated')
      - name: Commit durable translation state
        run: |
          rm -rf .workflow-engine
          git config user.name "book-translator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add books/blood-and-honey-rbmk-caleb-pov
          git commit -m "Translate Blood and Honey chapter 10"
          git push
