name: One-time Claiming Moon canonical bootstrap

on:
  push:
    branches:
      - migration/claiming-moon-initialize-20261021
    paths:
      - .github/workflows/initialize-claiming-moon.yml

permissions:
  contents: write

concurrency:
  group: one-time-claiming-moon-canonical-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.repository == 'tim8es/book-translator-private'
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated migration branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify trusted original EPUB and no existing state
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            '611d1717e7997955619576a667073b79b815bf7606c6ea4513c823b01c53c9bb' \
            'books/the-claiming-moon/source/The_Claiming_Moon.epub' | sha256sum -c -
          test ! -e books/the-claiming-moon/metadata.json
          test ! -e books/the-claiming-moon/progress.json
          test -z "$(git status --porcelain -- books/the-claiming-moon/incoming)"
      - name: Initialize canonical book using the current engine
        shell: bash
        run: |
          set -euo pipefail
          python scripts/book.py extract \
            books/the-claiming-moon/source/The_Claiming_Moon.epub \
            --slug the-claiming-moon --source-language en --target-language ru
          mkdir -p books/the-claiming-moon/translated books/the-claiming-moon/output
          touch books/the-claiming-moon/translated/.gitkeep books/the-claiming-moon/output/.gitkeep
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("books/the-claiming-moon")
          meta = json.loads((root / "metadata.json").read_text())
          progress = json.loads((root / "progress.json").read_text())
          assert meta["chapter_count"] == len(progress["chapters"]) == 48, "Expected 48 EPUB spine units"
          assert meta["source"]["sha256"] == "611d1717e7997955619576a667073b79b815bf7606c6ea4513c823b01c53c9bb"
          assert meta["source"]["storage_mode"] == "embedded"
          assert all(c["status"] == "extracted" for c in progress["chapters"])
          assert not any(c.get("translation_acceptance") for c in progress["chapters"])
          assert json.loads((root / "review-ledger.json").read_text())["records"] == []
          print("Canonical initialized, 48 units extracted, 0 accepted, 0 reviewed")
          PY
          python scripts/book.py validate the-claiming-moon
          python scripts/corpus.py verify the-claiming-moon
          python scripts/book.py resume the-claiming-moon --json
      - name: Commit only canonical baseline, preserving drafts
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- books/the-claiming-moon/incoming)"
          rm .github/workflows/initialize-claiming-moon.yml
          git add -A -- books/the-claiming-moon .github/workflows/initialize-claiming-moon.yml
          if git diff --cached --name-only | grep -E '^books/the-claiming-moon/incoming/'; then
            echo "Refusing to commit any historical draft changes" >&2
            exit 1
          fi
          git diff --cached --name-status
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore(book): initialize verified canonical source and extracted state'
          git push origin "HEAD:${GITHUB_REF_NAME}"
