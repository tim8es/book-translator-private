name: Correct and review Blood and Honey unit 14

on:
  push:
    paths:
      - '.github/workflows/blood-honey-review-unit-14.yml'

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tim8es/book-translator
          ref: a0c1a3c450a8251d2d90f4de5d5a988b5466958f
          path: .workflow-engine
      - name: Claim translator correction for unit 14
        shell: python
        run: |
          import os,sys
          from pathlib import Path
          sys.path.insert(0,str((Path('.workflow-engine')/'scripts').resolve()))
          from workflow.claims import ClaimManager
          from workflow.filesystem import FilesystemStorage
          from workflow.repository import WorkflowStateRepository
          from workflow.schemas import SchemaKind
          book=Path('books/blood-and-honey-rbmk-caleb-pov').resolve(); repo=WorkflowStateRepository(FilesystemStorage(book))
          progress=repo.read('progress.json',SchemaKind.PROGRESS); meta=repo.read('metadata.json',SchemaKind.METADATA).data
          ClaimManager(repo).acquire(progress.data,'14',role='translator',session_id=f"gha-{os.environ['GITHUB_RUN_ID']}-translator-014-reviewfix",base_revision=progress.version,base_commit=os.environ['GITHUB_SHA'],workflow_revision=meta['workflow']['resolved_revision'])
      - name: Apply independent review corrections
        shell: python
        run: |
          from pathlib import Path
          p=Path('books/blood-and-honey-rbmk-caleb-pov/translated/014-chapter-12.md'); t=p.read_text(encoding='utf-8')
          reps=[
            ('— Через три дня состоится пресс-конференция. На ней ты публично обвинишь Ариана Конти в похищении и множестве других преступлений, совершённых под принуждением, и ясно заявишь, что между вами нет ничего романтического.', '— Через три дня состоится пресс-конференция. На ней ты под принуждением публично обвинишь Ариана Конти в похищении и множестве других преступлений и ясно заявишь, что между вами нет ничего романтического.'),
            ('Он старался быть тихим, удобным гостем, думая, что именно этого хотел бы Ариан.', 'Он старался быть ненавязчивым, покладистым гостем, думая, что именно этого хотел бы Ариан.'),
            ('Три мучительно долгих, пытливых дня он безупречно играл роль.', 'Три мучительно долгих, тягостных дня он безупречно играл роль.'),
            ('Но по крайней мере Калеб может проиграть, сражаясь, а не просто позволяя событиям происходить с ним.', 'Но по крайней мере Калеб может пасть, сражаясь, а не просто позволяя событиям происходить с ним.'),
            ('— Хотя я никогда так о себе не думал, пока Ариан не сделал себя совершенно невозможным для сопротивления!', '— Хотя я никогда так о себе не думал, пока Ариан не оказался совершенно неотразимым!'),
            ('Из дыма вылетела рука и сомкнулась на предплечье Калеба.', 'Из дыма вылетела рука и сомкнулась на руке Калеба.'),
            ('Калеб и Ариан сбавили бег до трусцы, поднялись на борт', 'Калеб и Ариан перешли на лёгкий бег, поднялись на борт'),
          ]
          for a,b in reps:
            assert t.count(a)==1,(a,t.count(a)); t=t.replace(a,b)
          p.write_text(t,encoding='utf-8')
      - name: Reaccept and review
        shell: python
        run: |
          import os,sys
          from pathlib import Path
          sys.path.insert(0,str((Path('.workflow-engine')/'scripts').resolve()))
          from workflow.claims import ClaimManager
          from workflow.filesystem import FilesystemStorage
          from workflow.repository import WorkflowStateRepository
          from workflow.schemas import SchemaKind
          from workflow.translations import TranslationAcceptanceManager
          from workflow.reviews import ReviewLedgerManager
          book=Path('books/blood-and-honey-rbmk-caleb-pov').resolve(); repo=WorkflowStateRepository(FilesystemStorage(book)); reader=lambda p:(book/p).read_bytes(); claims=ClaimManager(repo)
          meta=repo.read('metadata.json',SchemaKind.METADATA).data; progress=repo.read('progress.json',SchemaKind.PROGRESS)
          ts=f"gha-{os.environ['GITHUB_RUN_ID']}-translator-014-reviewfix"
          TranslationAcceptanceManager(repo,artifact_reader=reader).accept(progress.data,progress.version,meta,14,session_id=ts)
          progress=repo.read('progress.json',SchemaKind.PROGRESS); claims.release(progress.data,'14',session_id=ts,detail='review corrections applied')
          progress=repo.read('progress.json',SchemaKind.PROGRESS); rs=f"gha-{os.environ['GITHUB_RUN_ID']}-reviewer-014"
          claims.acquire(progress.data,'14',role='reviewer',session_id=rs,base_revision=progress.version,base_commit=os.environ['GITHUB_SHA'],workflow_revision=meta['workflow']['resolved_revision'])
          reviews=ReviewLedgerManager(repo,artifact_reader=reader); reviews.record(progress.data,progress.version,meta,14,outcome='PASS',reviewer_session_id=rs,review_commit=None)
          claims.release(progress.data,'14',session_id=rs,detail='independent full source-comparison review PASS')
          progress=repo.read('progress.json',SchemaKind.PROGRESS); reviews.accept_review(progress.data,progress.version,meta,14)
      - name: Commit durable state
        run: |
          rm -rf .workflow-engine
          git config user.name "book-translator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add books/blood-and-honey-rbmk-caleb-pov
          git commit -m "Correct and review Blood and Honey chapter 12"
          git pull --rebase origin main
          git push
