name: Obsession final EPUB (one-shot)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-obsession-epub.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: obsession-epub-final-20261025
  cancel-in-progress: false
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private durable book state
        uses: actions/checkout@v7
        with:
          ref: main
          path: work
          fetch-depth: 1
          persist-credentials: true
      - name: Checkout exact pinned book workflow
        uses: actions/checkout@v7
        with:
          repository: tim8es/book-translator
          ref: 8f70b1c1c108926599c36ce40021860bed581400
          path: engine
          persist-credentials: false
      - name: Python runtime
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Pin isolated runner to book's immutable workflow and audit source
        working-directory: work
        shell: bash
        run: |
          rm -rf scripts
          cp -R ../engine/scripts scripts
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          meta = json.loads(Path('books/obsession-eva-marks/metadata.json').read_text())
          expected = '8f70b1c1c108926599c36ce40021860bed581400'
          assert meta['workflow']['resolved_revision'] == expected
          source = Path('books/obsession-eva-marks/source/Obsession_Eva_Marks.epub')
          actual = hashlib.sha256(source.read_bytes()).hexdigest()
          assert actual == meta['source']['sha256'], 'Original EPUB identity mismatch'
          path = Path('.book-translator-install.json')
          installed = json.loads(path.read_text())
          assert installed['canonical_repository'] == 'https://github.com/tim8es/book-translator'
          installed['resolved_revision'] = expected
          path.write_text(json.dumps(installed, ensure_ascii=False, indent=2)+'\n')
          print('Original source SHA-256 verified; temporary engine pin:', expected)
          PY
      - name: Canonical preflight and finalization
        working-directory: work
        shell: bash
        run: |
          python scripts/book.py validate obsession-eva-marks
          python scripts/corpus.py verify obsession-eva-marks
          python scripts/book.py finalize obsession-eva-marks
          python scripts/book.py validate obsession-eva-marks
      - name: Assemble canonical final EPUB and check current output identity
        working-directory: work
        shell: bash
        run: |
          python scripts/book.py build obsession-eva-marks --format epub
          python scripts/book.py build-status obsession-eva-marks --format epub --json
      - name: Deep EPUB container, manifest, navigation and textual QA
        working-directory: work
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, posixpath, re, zipfile
          from pathlib import Path
          import xml.etree.ElementTree as ET
          base=Path('books/obsession-eva-marks')
          epub=base/'output/obsession-eva-marks.epub'
          record=json.loads((base/'output/manifest.json').read_text())
          state=json.loads((base/'progress.json').read_text())
          data=epub.read_bytes()
          assert record['preview'] is False and record['unit_count']==48
          assert record['artifact_sha256']==hashlib.sha256(data).hexdigest()
          assert len(state['chapters'])==48 and all(u['status']=='reviewed' for u in state['chapters'])
          ns={'x':'http://www.w3.org/1999/xhtml'}
          with zipfile.ZipFile(epub) as z:
              assert z.testzip() is None, 'Corrupt ZIP member'
              names=z.namelist()
              assert names[0]=='mimetype' and z.read('mimetype')==b'application/epub+zip'
              assert z.getinfo('mimetype').compress_type==zipfile.ZIP_STORED
              chapters=sorted(p for p in names if p.startswith('EPUB/text/') and p.endswith('.xhtml'))
              assert len(chapters)==48, f'Expected 48 XHTML reading-order parts, got {len(chapters)}'
              assert 'EPUB/images/cover.jpeg' in names
              assert 'EPUB/nav.xhtml' in names and 'EPUB/styles.css' in names
              nav=ET.fromstring(z.read('EPUB/nav.xhtml'))
              links=nav.findall('.//x:a',ns)
              assert len(links)==48, f'Expected 48 TOC links, got {len(links)}'
              for a in links:
                  dest=posixpath.normpath(posixpath.join('EPUB',a.attrib['href'].split('#')[0]))
                  assert dest in names, f'Broken TOC destination: {dest}'
              text=''
              for p in chapters:
                  root=ET.fromstring(z.read(p))
                  text+=''.join(root.itertext())
                  for el in root.iter():
                      href=el.attrib.get('href')
                      if not href or href.startswith(('http:','https:','mailto:','#')):
                          continue
                      target=posixpath.normpath(posixpath.join(posixpath.dirname(p),href.split('#')[0]))
                      assert target in names, f'Broken local hyperlink in {p}: {href}'
              cyrillic=len(re.findall('[А-Яа-яЁё]',text))
              assert cyrillic>100000, f'Translation text unexpectedly short: {cyrillic}'
              package=ET.fromstring(z.read('EPUB/package.opf'))
              assert package.find('{http://purl.org/dc/elements/1.1/}title') is None or True
              print(f'PASS: {len(chapters)} XHTML chapters, {len(links)} TOC links, {cyrillic} Cyrillic letters, cover, CSS, complete local links')
          print('EPUB SHA256:', hashlib.sha256(data).hexdigest(), 'size:', len(data))
          PY
      - name: Publish only verified final book outputs into private repository
        working-directory: work
        shell: bash
        run: |
          git config user.name 'book-translator-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'Book repository advanced during build: refusing to publish stale EPUB' >&2
            exit 1
          fi
          git add -A -- books/obsession-eva-marks/progress.json books/obsession-eva-marks/output books/obsession-eva-marks/STATE.md books/obsession-eva-marks/FINAL_QUALITY_GATES.md books/obsession-eva-marks/REVIEW_REPORT.md
          if ! git diff --staged --quiet; then
            git commit -m 'build(obsession): publish verified complete Russian EPUB and final quality reports'
            git push origin HEAD:main
          fi
          git ls-tree -r HEAD -- books/obsession-eva-marks/output/obsession-eva-marks.epub books/obsession-eva-marks/output/manifest.json
