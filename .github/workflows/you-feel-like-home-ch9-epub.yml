name: Build You Feel Like Home RU Chapter 10 EPUB

on:
  push:
    paths:
      - '.github/workflows/you-feel-like-home-ch9-epub.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and validate translated EPUB
        run: python books/you-feel-like-home/source-updates/2026-10-17/build_epub.py
      - name: Save EPUB in private book workspace
        shell: bash
        run: |
          git config user.name "book-translator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add books/you-feel-like-home/output/You_Feel_Like_Home_RU_chapters_1-10.epub
          git commit -m "Build You Feel Like Home Russian EPUB with chapter 10"
          git pull --rebase origin main
          git push
