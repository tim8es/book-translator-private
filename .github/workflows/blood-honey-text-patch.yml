name: Apply reviewed Blood and Honey text correction

on:
  push:
    paths:
      - 'books/blood-and-honey-rbmk-caleb-pov/.workflow/text-patch.json'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact reviewed replacements
        shell: python
        run: |
          import json
          from pathlib import Path
          spec_path = Path('books/blood-and-honey-rbmk-caleb-pov/.workflow/text-patch.json')
          spec = json.loads(spec_path.read_text(encoding='utf-8'))
          target = Path(spec['path'])
          text = target.read_text(encoding='utf-8')
          for item in spec['replacements']:
              old = item['old']
              new = item['new']
              expected = item.get('count', 1)
              actual = text.count(old)
              if actual != expected:
                  raise RuntimeError(f'replacement count for {old!r}: expected {expected}, got {actual}')
              text = text.replace(old, new, expected)
          target.write_text(text, encoding='utf-8')
          spec_path.unlink()
      - name: Commit correction
        run: |
          git config user.name "book-translator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add books/blood-and-honey-rbmk-caleb-pov
          git commit -m "Apply reviewed Blood and Honey translation corrections"
          git push
