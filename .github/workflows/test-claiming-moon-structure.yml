name: Test The Claiming Moon structural migration
on:
  push:
    branches: [test/epub-structure-release-candidate-20261023]
    paths: ['.github/workflows/test-claiming-moon-structure.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tim8es/book-translator
          ref: 0fbc5ffda95e2697b9aebb6b7f8c00362cf28bec
          path: codec
      - name: Run non-mutating structural compatibility audit
        env:
          PYTHONPATH: codec/scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, zipfile, collections, re, sys, traceback
          from xml.etree import ElementTree as ET
          from workflow.epub_structure import read_chapters, StructureError
          book = Path('books/the-claiming-moon')
          meta = json.loads((book/'metadata.json').read_text())
          progress = json.loads((book/'progress.json').read_text())
          source = book/'source'/meta['source_file']
          result={'book':'the-claiming-moon','source_sha256':meta['source']['sha256'], 'reviewed_units':sum(c['status']=='reviewed' for c in progress['chapters'])}
          try:
            units, layout = read_chapters(source)
            result['structural_extract'] = 'passed'
            result['source_units'] = len(units)
            result['total_structural_blocks'] = sum(u[3] for u in units)
            result['total_protected_markers'] = sum(len(re.findall('⟦BT:[OCV]:',u[1])) for u in units)
          except Exception as e:
            result['structural_extract'] = 'blocked'
            result['error'] = str(e)
            units = []
          with zipfile.ZipFile(source) as z:
            files = [f for f in z.namelist() if f.endswith('.xhtml')]
            result['source_xhtml_count'] = len(files)
            original_counts=collections.Counter()
            total_nonempty_p=0
            for path in files:
              root=ET.fromstring(z.read(path))
              original_counts.update(e.tag.rsplit('}',1)[-1] for e in root.iter())
              total_nonempty_p += sum(1 for e in root.iter() if e.tag.rsplit('}',1)[-1]=='p' and ''.join(e.itertext()).strip())
            result['original_nonempty_p']=total_nonempty_p
            result['original_br']=original_counts['br']
            result['original_links']=original_counts['a']
            result['original_emphasis_nodes']=sum(original_counts[t] for t in ('em','strong','b','i'))
            result['original_blockquotes']=original_counts['blockquote']
          counts=[]
          for c in progress['chapters']:
            md=(book/c['translation_path']).read_text()
            blocks = [x.strip() for x in re.split(r'\n\s*\n', md) if x.strip()]
            counts.append(len(blocks))
          result['russian_md_blocks']=sum(counts)
          result['russian_translation_all_reviewed']=all(c['status']=='reviewed' for c in progress['chapters'])
          if units:
            result['alignment_differences']=[
              {'number':i+1,'structural_blocks':u[3],'translated_blocks':counts[i],'delta':counts[i]-u[3]}
              for i,u in enumerate(units) if i<len(counts) and u[3]!=counts[i]
            ]
            result['matching_unit_block_counts']=len(units)-len(result['alignment_differences'])
          print('MIGRATION_AUDIT_JSON='+json.dumps(result,ensure_ascii=False,sort_keys=True))
          (Path('migration-test-report.json')).write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Attempt exact original-XHTML roundtrip with full link validation
        env:
          PYTHONPATH: codec/scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib
          from workflow.epub_structure import read_chapters, build, validate_structural_epub
          book=Path('books/the-claiming-moon')
          source=book/'source/The_Claiming_Moon.epub'
          report_path=Path('migration-test-report.json')
          report=json.loads(report_path.read_text())
          try:
            units,layout=read_chapters(source)
            output=build(
              source.read_bytes(),document_paths=[u[2] for u in units],
              translations=[u[1] for u in units],
              target_language='en',title='The Claiming Moon'
            )
            Path('migration-roundtrip-check.epub').write_bytes(output)
            report['structural_roundtrip']='passed'
            report['roundtrip_sha256']=hashlib.sha256(output).hexdigest()
            report['roundtrip_validation']=validate_structural_epub(output, expected_documents=48)
          except Exception as ex:
            report['structural_roundtrip']='blocked'
            report['roundtrip_error']=repr(ex)
          report_path.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print('ROUNDTRIP_JSON='+json.dumps({
            'result':report['structural_roundtrip'],
            'error':report.get('roundtrip_error'),
            'validation':report.get('roundtrip_validation')
          },ensure_ascii=False))
          PY
      - name: Test real reviewed Russian afterword against original XHTML anchor
        env:
          PYTHONPATH: codec/scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, zipfile, io
          from xml.etree import ElementTree as ET
          from workflow.epub_structure import read_chapters, build, validate_structural_epub
          book=Path('books/the-claiming-moon')
          source=book/'source/The_Claiming_Moon.epub'
          report_path=Path('migration-test-report.json')
          report=json.loads(report_path.read_text())
          try:
            units,layout=read_chapters(source)
            afterword_path=book/'translated/048-afterword.md'
            paragraphs=[p.strip() for p in afterword_path.read_text().split('\n\n') if p.strip()]
            if len(paragraphs)!=2 or not paragraphs[0].startswith('## '):
              raise ValueError('afterword must consist of reviewed title and one paragraph')
            heading=paragraphs[0][3:].strip()
            para=paragraphs[1]
            selected='загляните в Архив и оставьте комментарий'
            if para.count(selected)!=1: raise ValueError('link phrase not unique in translation')
            para=para.replace(selected,'⟦BT:O:0001⟧'+selected+'⟦BT:C:0001⟧')
            russian='⟦BT:SEG:000001⟧\n'+heading+'\n\n⟦BT:SEG:000002⟧\n'+para+'\n'
            output=build(source.read_bytes(),document_paths=[u[2] for u in units],
                         translations=[u[1] for u in units[:-1]]+[russian],
                         target_language='ru',title='Луна присвоения')
            with zipfile.ZipFile(io.BytesIO(output)) as z:
              root=ET.fromstring(z.read(units[-1][2]))
              links=[x for x in root.iter() if x.tag.endswith('}a')]
              assert any(x.get('href')=='https://archiveofourown.org/works/70374321/comments/new'
                         and ''.join(x.itertext())==selected for x in links)
              assert any(x.tag.endswith('}h2') and ''.join(x.itertext())==heading
                         for x in root.iter())
            validate_structural_epub(output,expected_documents=48)
            report['real_russian_afterword']='passed'
            report['afterword_preserved_external_comment_link']=True
          except Exception as ex:
            report['real_russian_afterword']='blocked'
            report['afterword_error']=repr(ex)
          report_path.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print('AFTERWORD_JSON='+json.dumps({
            'result':report['real_russian_afterword'],
            'error':report.get('afterword_error'),
            'link_preserved':report.get('afterword_preserved_external_comment_link')
          },ensure_ascii=False))
          PY
      - name: EPUBCheck conformance regression against exact original
        run: |
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            --output /tmp/epubcheck-5.4.0.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q /tmp/epubcheck-5.4.0.zip -d /tmp/epubcheck-5.4.0
          EPUBCHECK_JAR="$(find /tmp/epubcheck-5.4.0 -name epubcheck.jar -type f | head -1)"
          test -n "$EPUBCHECK_JAR"
          export EPUBCHECK_JAR
          java -jar "$EPUBCHECK_JAR" --version
          python - <<'PY'
          from pathlib import Path
          import collections, json, os, re, subprocess
          original = Path("books/the-claiming-moon/source/The_Claiming_Moon.epub")
          output = Path("migration-roundtrip-check.epub")
          if not original.is_file() or not output.is_file():
              raise SystemExit("EPUBCheck inputs missing; EPUB roundtrip gate did not succeed")
          def check(path):
              p = subprocess.run(["java", "-jar", os.environ["EPUBCHECK_JAR"], str(path)],
                                 capture_output=True, text=True)
              raw = p.stdout + "\n" + p.stderr
              errors = collections.Counter(re.findall(r"(?:ERROR|FATAL)\(([^)]+)\)", raw))
              warns = collections.Counter(re.findall(r"WARNING\(([^)]+)\)", raw))
              if p.returncode != 0 and not errors:
                  raise SystemExit("EPUBCheck itself failed without classified diagnostics")
              return {"returncode": p.returncode, "errors": errors, "warnings": warns}
          baseline = check(original)
          rebuilt = check(output)
          new_errors = rebuilt["errors"] - baseline["errors"]
          report = {
              "validator": "epubcheck-apt",
              "original_errors": sum(baseline["errors"].values()),
              "rebuilt_errors": sum(rebuilt["errors"].values()),
              "new_error_codes": dict(new_errors),
              "original_warnings": sum(baseline["warnings"].values()),
              "rebuilt_warnings": sum(rebuilt["warnings"].values()),
          }
          print("EPUBCHECK_REGRESSION=" + json.dumps(report, sort_keys=True))
          Path("migration-epubcheck-summary.json").write_text(json.dumps(report, indent=2) + "\n")
          if new_errors:
              raise SystemExit("EPUBCheck identified new EPUB conformance error codes in reconstructed output")
          print("EPUBCHECK NO-NEW-ERRORS GATE: PASS")
          PY
      - name: Fail closed if any real-book gate is blocked
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('migration-test-report.json').read_text())
          expected = {
              "structural_extract": "passed",
              "structural_roundtrip": "passed",
              "real_russian_afterword": "passed",
          }
          for key, state in expected.items():
              if data.get(key) != state:
                  raise SystemExit(f"RELEASE GATE FAILED: {key}: {data.get(key)} — "
                                   f"{data.get('error') or data.get('roundtrip_error') or data.get('afterword_error')}")
          if data.get("source_units") != 48 or data.get("reviewed_units") != 48:
              raise SystemExit("RELEASE GATE FAILED: expected 48 source/reviewed units")
          print("ALL REAL-BOOK STRUCTURAL RELEASE GATES: PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: claiming-moon-structural-migration-audit
          path: migration-test-report.json
