name: One-time Claiming Moon chapter 5 historical draft admission
on:
  push:
    branches: [migration/claiming-moon-admit-ch05-20261022]
    paths: [.github/workflows/one-time-claiming-moon-admit-ch05.yml]
permissions:
  contents: write
jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate original EPUB, canonical state, and exact five-part source-indexed draft
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/book.py validate the-claiming-moon
          python scripts/corpus.py verify the-claiming-moon
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          b = Path("books/the-claiming-moon")
          metadata = json.loads((b / "metadata.json").read_text(encoding="utf-8"))
          state = json.loads((b / "progress.json").read_text(encoding="utf-8"))
          manifest = json.loads((b / "source-manifest.json").read_text(encoding="utf-8"))
          evidence = json.loads(Path("docs/migrations/claiming-moon-chapter-005-restoration.json").read_text(encoding="utf-8"))
          if hashlib.sha256((b / "source/The_Claiming_Moon.epub").read_bytes()).hexdigest() != "611d1717e7997955619576a667073b79b815bf7606c6ea4513c823b01c53c9bb":
              raise SystemExit("Original source identity mismatch")
          if evidence["unit_id"] != "chapter-000007" or evidence["chapter"] != 5:
              raise SystemExit("Wrong historical draft recovery evidence")
          unit = state["chapters"][6]
          if unit["number"] != 7 or unit["unit_id"] != "chapter-000007" or unit["status"] != "extracted":
              raise SystemExit("Chapter 5 is not an eligible extracted unit")
          if "translation_acceptance" in unit or (b / unit["translation_path"]).exists():
              raise SystemExit("Refusing to overwrite a previously accepted translation")
          seal = next(x for x in manifest["extracted"] if x["number"] == 7)
          if hashlib.sha256((b / unit["source_path"]).read_bytes()).hexdigest() != seal["sha256"]:
              raise SystemExit("Canonical extracted chapter 5 diverges from manifest")
          if seal["sha256"] != evidence["canonical_extracted_sha256"]:
              raise SystemExit("Recovery provenance does not match current source")
          parts = [b / name for name in evidence["draft_part_paths"]]
          if len(parts) != 5 or any(not f.is_file() for f in parts):
              raise SystemExit("Missing historical chapter 5 source-indexed draft part")
          if any(hashlib.sha256(f.read_bytes()).hexdigest() != digest for f, digest in zip(parts, evidence["draft_part_sha256"])):
              raise SystemExit("Historical chapter 5 draft fragment hash mismatch")
          candidate = "\n".join(f.read_text(encoding="utf-8") for f in parts)
          stage = b / evidence["staged_path"]
          if candidate.encode("utf-8") != stage.read_bytes():
              raise SystemExit("Restored staging candidate differs from the original five parts")
          if hashlib.sha256(stage.read_bytes()).hexdigest() != evidence["staged_sha256"]:
              raise SystemExit("Recovered chapter 5 candidate SHA mismatch")
          if len(candidate) < 50000 or "Глава 5" not in candidate[:150]:
              raise SystemExit("Recovered chapter 5 draft appears truncated")
          print("Chapter 5 source and all five historical draft parts verified; review remains pending")
          PY
      - name: Claim and accept unchanged chapter 5 draft as translated
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path
          b = Path("books/the-claiming-moon")
          evidence = json.loads(Path("docs/migrations/claiming-moon-chapter-005-restoration.json").read_text(encoding="utf-8"))
          unit = json.loads((b / "progress.json").read_text(encoding="utf-8"))["chapters"][6]
          session = "claiming-moon-recovered-chapter-five-translator-20261022"
          def cli(*args):
              subprocess.run(["python","scripts/book.py",*map(str,args)], check=True)
          cli("claim","the-claiming-moon",7,"--role","translator","--session-id",session)
          destination = b / unit["translation_path"]
          with destination.open("xb") as out:
              out.write((b / evidence["staged_path"]).read_bytes())
          if hashlib.sha256(destination.read_bytes()).hexdigest() != evidence["staged_sha256"]:
              raise SystemExit("Destination content mismatch")
          cli("accept-translation","the-claiming-moon",7,"--session-id",session,"--json")
          cli("release","the-claiming-moon",7,"--session-id",session)
          PY
      - name: Verify accepted translation and leave review ledger untouched
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/book.py validate the-claiming-moon
          python scripts/corpus.py verify the-claiming-moon
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          b = Path("books/the-claiming-moon")
          progress = json.loads((b / "progress.json").read_text(encoding="utf-8"))
          row = progress["chapters"][6]
          evidence = json.loads(Path("docs/migrations/claiming-moon-chapter-005-restoration.json").read_text(encoding="utf-8"))
          if row["status"] != "translated" or row["translation_acceptance"]["unit_id"] != "chapter-000007":
              raise SystemExit("Canonical machine acceptance missing")
          if hashlib.sha256((b / row["translation_path"]).read_bytes()).hexdigest() != evidence["staged_sha256"]:
              raise SystemExit("Accepted artifact SHA mismatch")
          ledger = json.loads((b / "review-ledger.json").read_text(encoding="utf-8"))
          if not any(r.get("unit_id") == "chapter-000048" and r.get("outcome") == "PASS" for r in ledger["records"]):
              raise SystemExit("Existing afterword Reviewer PASS missing")
          PY
          test -z "$(git diff --name-only HEAD -- books/the-claiming-moon/incoming books/the-claiming-moon/migration-staging books/the-claiming-moon/extracted books/the-claiming-moon/source books/the-claiming-moon/review-ledger.json books/the-claiming-moon/source-manifest.json)"
      - name: Commit successful chapter 5 state and remove one-off workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- books/the-claiming-moon/translated books/the-claiming-moon/progress.json books/the-claiming-moon/.workflow
          git rm -- .github/workflows/one-time-claiming-moon-admit-ch05.yml
          git diff --cached --name-status
          git commit -m 'migration: accept verified five-part chapter 5 draft as translated'
          git push origin HEAD:migration/claiming-moon-admit-ch05-20261022
