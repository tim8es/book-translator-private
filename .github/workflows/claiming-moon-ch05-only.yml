name: Claiming Moon — reconcile chapter 5 only

on:
  push:
    branches:
      - migration/claiming-moon-ch05-only-20261022
    paths:
      - .github/workflows/claiming-moon-ch05-only.yml

permissions:
  contents: write

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify current main and accept only narrative chapter 5
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          BOOK = Path("books/the-claiming-moon")
          SLUG = "the-claiming-moon"
          BASE = "5d9dc72e9d08bca4dbe720822316add977e40d13"
          PIN = "5e0731da8b7ca81ada5316ed536a8a954008b789"
          SOURCE_SHA = "611d1717e7997955619576a667073b79b815bf7606c6ea4513c823b01c53c9bb"
          STAGE = BOOK / "migration-staging/007-chapter-005-UNREVIEWED.md"
          STAGE_BLOB = "56bc5397686a7afe175d6890eeb5e3b2e497b294"

          def out(*args):
              return subprocess.check_output(list(map(str, args)), text=True).strip()

          def run(*args):
              subprocess.run(list(map(str, args)), check=True)

          def digest(b):
              return hashlib.sha256(b).hexdigest()

          assert out("git", "merge-base", "HEAD", "origin/main") == BASE, "main changed, replan required"
          meta = json.loads((BOOK / "metadata.json").read_text())
          assert meta["workflow"]["resolved_revision"] == PIN
          assert meta["source"]["revision_id"] == "source-000001"
          assert meta["source"]["sha256"] == SOURCE_SHA
          assert digest((BOOK / "source" / meta["source"]["filename"]).read_bytes()) == SOURCE_SHA
          run("python", "scripts/book.py", "validate", SLUG)
          run("python", "scripts/corpus.py", "verify", SLUG)
          assert not json.loads(out("python", "scripts/book.py", "claims", SLUG, "--json"))["claims"]
          progress = json.loads((BOOK / "progress.json").read_text())
          assert len(progress["chapters"]) == 48
          unit = next(c for c in progress["chapters"] if c["number"] == 7)
          assert unit["unit_id"] == "chapter-000007"
          assert unit["status"] == "extracted" and "translation_acceptance" not in unit
          counts = {s: sum(c["status"] == s for c in progress["chapters"]) for s in ("translated", "extracted", "reviewed")}
          assert counts == {"translated": 41, "extracted": 6, "reviewed": 1}, counts
          target = BOOK / unit["translation_path"]
          source = BOOK / unit["source_path"]
          assert source.is_file() and not target.exists()
          assert out("git", "hash-object", STAGE) == STAGE_BLOB
          draft = STAGE.read_bytes()
          parts = [BOOK / "incoming" / f"chapter-005-ru-draft.part-{i:02d}.md" for i in range(1,6)]
          assert all(p.is_file() for p in parts)
          assert draft == b"\n".join(p.read_bytes() for p in parts)
          assert len(draft) > 20000

          session = "claiming-moon-ch05-mainline-translator-20261022"
          run("python", "scripts/book.py", "claim", SLUG, 7, "--role", "translator", "--session-id", session)
          target.write_bytes(draft)
          run("python", "scripts/book.py", "accept-translation", SLUG, 7, "--session-id", session)
          run("python", "scripts/book.py", "release", SLUG, 7, "--session-id", session)
          run("python", "scripts/book.py", "validate", SLUG)
          run("python", "scripts/corpus.py", "verify", SLUG)
          updated = json.loads((BOOK / "progress.json").read_text())
          new_unit = next(c for c in updated["chapters"] if c["unit_id"] == unit["unit_id"])
          assert new_unit["status"] == "translated"
          assert new_unit["translation_acceptance"]["source_sha256"] == digest(source.read_bytes())
          assert new_unit["translation_acceptance"]["translation_sha256"] == digest(draft)
          assert new_unit["translation_acceptance"]["workflow_revision"] == PIN
          counts = {s: sum(c["status"] == s for c in updated["chapters"]) for s in ("translated", "extracted", "reviewed")}
          assert counts == {"translated": 42, "extracted": 5, "reviewed": 1}, counts
          evidence = {
              "schema_version": 1,
              "book_slug": SLUG,
              "source_revision": "source-000001",
              "original_sha256": SOURCE_SHA,
              "workflow_revision": PIN,
              "parent_main_commit": BASE,
              "narrative_chapter": 5,
              "unit_id": unit["unit_id"],
              "staging_path": str(STAGE.relative_to(BOOK)),
              "staging_blob_sha": STAGE_BLOB,
              "translation_path": unit["translation_path"],
              "translation_sha256": digest(draft),
              "source_sha256": digest(source.read_bytes()),
              "reviewed": False,
              "lifecycle_counts": counts,
              "note": "Machine acceptance of preserved historical draft only. Literary source-comparison Reviewer PASS remains required.",
          }
          Path("docs/migrations/claiming-moon-ch05-mainline-machine-acceptance.json").write_text(
              json.dumps(evidence, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print("CHAPTER_5_ACCEPTED", json.dumps(counts))
          PY
      - name: Commit only successful chapter 5 acceptance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/claiming-moon-ch05-only.yml
          git add -A books/the-claiming-moon/progress.json books/the-claiming-moon/translated books/the-claiming-moon/.workflow docs/migrations/claiming-moon-ch05-mainline-machine-acceptance.json
          git commit -m "Accept preserved Claiming Moon chapter 5 on current mainline state"
          git push origin HEAD:refs/heads/migration/claiming-moon-ch05-only-20261022
