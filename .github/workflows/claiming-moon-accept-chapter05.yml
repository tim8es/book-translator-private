name: Claiming Moon — accept chapter 5 preserved draft

on:
  push:
    branches: [migration/claiming-moon-accept-chapter05-20261022]
    paths: [.github/workflows/claiming-moon-accept-chapter05.yml]

permissions:
  contents: write

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify preserved Chapter 5 and run canonical acceptance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          ROOT = Path("books/the-claiming-moon")
          SLUG = "the-claiming-moon"
          EXPECTED_BASE = "5d9dc72e9d08bca4dbe720822316add977e40d13"
          SOURCE_SHA = "611d1717e7997955619576a667073b79b815bf7606c6ea4513c823b01c53c9bb"
          WORKFLOW_SHA = "5e0731da8b7ca81ada5316ed536a8a954008b789"
          STAGED_BLOB = "56bc5397686a7afe175d6890eeb5e3b2e497b294"

          def run(*args):
              subprocess.run([str(x) for x in args], check=True)
          def out(*args):
              return subprocess.check_output([str(x) for x in args], text=True).strip()
          def digest(data):
              return hashlib.sha256(data).hexdigest()

          assert out("git", "merge-base", "HEAD", "origin/main") == EXPECTED_BASE, "main moved during migration; replan"
          meta = json.loads((ROOT / "metadata.json").read_text(encoding="utf-8"))
          assert meta["workflow"]["resolved_revision"] == WORKFLOW_SHA
          assert meta["source"]["revision_id"] == "source-000001"
          assert meta["source"]["sha256"] == SOURCE_SHA
          assert digest((ROOT / "source" / meta["source"]["filename"]).read_bytes()) == SOURCE_SHA
          run("python", "scripts/book.py", "validate", SLUG)
          run("python", "scripts/corpus.py", "verify", SLUG)

          progress = json.loads((ROOT / "progress.json").read_text(encoding="utf-8"))
          current = {s: sum(c["status"] == s for c in progress["chapters"]) for s in ("translated", "reviewed", "extracted")}
          assert current == {"translated": 41, "reviewed": 1, "extracted": 6}, current
          unit = next(c for c in progress["chapters"] if c["number"] == 7)
          assert unit["unit_id"] == "chapter-000007"
          assert unit["status"] == "extracted" and "translation_acceptance" not in unit
          assert not json.loads(out("python", "scripts/book.py", "claims", SLUG, "--json")).get("claims")
          source = ROOT / unit["source_path"]
          target = ROOT / unit["translation_path"]
          stage = ROOT / "migration-staging/007-chapter-005-UNREVIEWED.md"
          assert source.is_file() and stage.is_file() and not target.exists()
          assert out("git", "hash-object", stage) == STAGED_BLOB
          parts = [ROOT / "incoming" / f"chapter-005-ru-draft.part-{i:02d}.md" for i in range(1, 6)]
          assert all(p.is_file() for p in parts)
          from_parts = b"\n".join(p.read_bytes() for p in parts)
          original = stage.read_bytes()
          assert from_parts == original and len(original) > 20000
          assert digest(source.read_bytes()) == "6ae125e66f8d34dd9a168d3a4416087cca47d8351f8633a3a8453e86a8d26d92"

          session = "claiming-moon-migration-ch05-20261022"
          run("python", "scripts/book.py", "claim", SLUG, 7, "--role", "translator", "--session-id", session)
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(original)
          run("python", "scripts/book.py", "accept-translation", SLUG, 7, "--session-id", session)
          run("python", "scripts/book.py", "release", SLUG, 7, "--session-id", session)
          run("python", "scripts/book.py", "validate", SLUG)
          run("python", "scripts/corpus.py", "verify", SLUG)

          updated = json.loads((ROOT / "progress.json").read_text(encoding="utf-8"))
          counts = {s: sum(c["status"] == s for c in updated["chapters"]) for s in ("translated", "reviewed", "extracted")}
          assert counts == {"translated": 42, "reviewed": 1, "extracted": 5}, counts
          accepted = next(c for c in updated["chapters"] if c["number"] == 7)
          evidence = accepted["translation_acceptance"]
          assert evidence["workflow_revision"] == WORKFLOW_SHA
          assert evidence["source_sha256"] == digest(source.read_bytes())
          assert evidence["translation_sha256"] == digest(target.read_bytes())
          assert target.read_bytes() == original
          record = {
              "schema_version": 1, "chapter": 5, "unit_id": "chapter-000007",
              "source_revision": "source-000001", "original_epub_sha256": SOURCE_SHA,
              "workflow_revision": WORKFLOW_SHA, "base_commit": EXPECTED_BASE,
              "stage": "migration-staging/007-chapter-005-UNREVIEWED.md",
              "stage_blob_sha": STAGED_BLOB,
              "incoming_parts": [str(p.relative_to(ROOT)) for p in parts],
              "accepted_translation": unit["translation_path"],
              "source_sha256": evidence["source_sha256"],
              "translation_sha256": evidence["translation_sha256"],
              "state": "translated", "independent_reviewer_pass": False,
              "counts": counts,
          }
          Path("docs/migrations/claiming-moon-accepted-chapter05-after-reconcile.json").write_text(
              json.dumps(record, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print("MACHINE_ACCEPTED", json.dumps(counts, sort_keys=True))
          PY
      - name: Commit evidence and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/claiming-moon-accept-chapter05.yml
          git add -A books/the-claiming-moon/progress.json books/the-claiming-moon/translated books/the-claiming-moon/.workflow docs/migrations/claiming-moon-accepted-chapter05-after-reconcile.json
          git commit -m "Accept preserved Claiming Moon chapter 5 as translated, not reviewed"
          git push origin HEAD:refs/heads/migration/claiming-moon-accept-chapter05-20261022
