name: Claiming Moon missing-translation coverage audit

on:
  push:
    branches: [audit/claiming-moon-remaining-gaps-20261022]
    paths: [.github/workflows/claiming-moon-missing-coverage.yml]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact original EPUB and five partial translation ranges
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import posixpath
          import re
          import subprocess
          import zipfile
          from pathlib import Path
          from urllib.parse import unquote
          from xml.etree import ElementTree as ET

          BASE = "7f487c332d2ff785fed41f58588d7aeea76de903"
          ROOT = Path("books/the-claiming-moon")
          INCOMING = ROOT / "incoming"
          REF = json.loads(Path("docs/migrations/the-claiming-moon-source-reference.json").read_text(encoding="utf-8"))
          META = json.loads((ROOT / "metadata.json").read_text(encoding="utf-8"))
          PROGRESS = json.loads((ROOT / "progress.json").read_text(encoding="utf-8"))
          EPUB = ROOT / "source/The_Claiming_Moon.epub"
          assert subprocess.check_output(["git", "merge-base", "HEAD", "origin/main"], text=True).strip() == BASE
          assert META["workflow"]["resolved_revision"] == "5e0731da8b7ca81ada5316ed536a8a954008b789"
          assert META["source"]["revision_id"] == "source-000001"
          assert hashlib.sha256(EPUB.read_bytes()).hexdigest() == META["source"]["sha256"] == REF["source_sha256"]
          assert len(PROGRESS["chapters"]) == len(REF["spine"]) == 48

          with zipfile.ZipFile(EPUB) as zf:
              container = ET.fromstring(zf.read("META-INF/container.xml"))
              rootfile = next(x.attrib["full-path"] for x in container.iter() if x.tag.endswith("rootfile"))
              opf = ET.fromstring(zf.read(rootfile))
              manifest = {}
              for el in opf.iter():
                  if el.tag.endswith("item") and el.attrib.get("id") and el.attrib.get("href"):
                      manifest[el.attrib["id"]] = el.attrib
              ids = [x.attrib["idref"] for x in opf.iter() if x.tag.endswith("itemref") and x.attrib.get("idref")]
              source_units = []
              for idref in ids:
                  item = manifest[idref]
                  if item.get("media-type") not in ("application/xhtml+xml", "text/html") or "nav" in item.get("properties", "").split():
                      continue
                  path = posixpath.normpath(posixpath.join(posixpath.dirname(rootfile), unquote(item["href"].split("#", 1)[0])))
                  raw = zf.read(path)
                  doc = ET.fromstring(raw)
                  blocks = [
                      el for el in doc.iter()
                      if el.tag.split("}")[-1].lower() in {"h1", "h2", "h3", "h4", "p"}
                  ]
                  nonempty = sum(bool("".join(el.itertext()).strip()) for el in blocks)
                  source_units.append({"basename": posixpath.basename(path), "sha256": hashlib.sha256(raw).hexdigest(), "blocks": len(blocks), "nonempty_blocks": nonempty})
              assert source_units == REF["spine"], "independent original EPUB spine/content block mismatch"

          subprocess.run(["python", "scripts/book.py", "validate", "the-claiming-moon"], check=True)
          subprocess.run(["python", "scripts/corpus.py", "verify", "the-claiming-moon"], check=True)

          specs = {
              15: ("json", ["chapter-015-ru-PARTIAL-indexed-000-095.json"]),
              19: ("none", []),
              26: ("markdown", [
                  "chapter-026-ru-draft.part-01.md", "chapter-026-ru-draft.part-02a.md",
                  "chapter-026-ru-draft.part-02b.md", "chapter-026-ru-draft.part-03.md",
                  "chapter-026-ru-draft.part-04.md"]),
              27: ("markdown", [
                  "chapter-027-ru-draft.part-01.md", "chapter-027-ru-draft.part-02.md"]),
              29: ("markdown", [f"chapter-029-ru-draft.part-{n:02d}.md" for n in range(1, 9)] + ["chapter-029-ru-draft.part-09a.md"]),
          }
          entries = []
          for chapter, (kind, names) in specs.items():
              unit_no = chapter + 2
              unit = PROGRESS["chapters"][unit_no - 1]
              assert unit["number"] == unit_no and unit["status"] == "extracted"
              assert "translation_acceptance" not in unit
              original = source_units[chapter + 1]
              count = original["nonempty_blocks"]
              indexes = []
              for name in names:
                  raw = (INCOMING / name).read_text(encoding="utf-8")
                  if kind == "json":
                      doc = json.loads(raw)
                      assert doc["source_sha256"] == original["sha256"]
                      assert doc["total_source_blocks"] == count
                      mapping = doc["translation_by_source_index"]
                      assert all(isinstance(value, str) and value.strip() for value in mapping.values())
                      indexes.extend(int(i) for i in mapping)
                  else:
                      pairs = list(re.finditer(r"<!--\s*source-block\s+(\d+)\s*-->", raw))
                      assert pairs, f"missing source block markers in {name}"
                      for i, match in enumerate(pairs):
                          end = pairs[i + 1].start() if i + 1 < len(pairs) else len(raw)
                          assert raw[match.end():end].strip(), f"empty translation block {match.group(1)} in {name}"
                          indexes.append(int(match.group(1)))
              assert indexes == list(range(len(indexes))), f"missing, duplicate or reordered indexes for chapter {chapter}"
              assert len(indexes) < count, f"unexpected complete indexed draft for chapter {chapter}"
              entries.append({
                  "chapter": chapter,
                  "unit_number": unit_no,
                  "unit_id": unit["unit_id"],
                  "original_xhtml_sha256": original["sha256"],
                  "original_nonempty_blocks": count,
                  "preserved_indexed_draft_blocks": len(indexes),
                  "missing_start_index": len(indexes),
                  "missing_end_index": count - 1,
                  "missing_count": count - len(indexes),
                  "incoming_artifacts": ["incoming/" + name for name in names],
                  "canonical_translation_status": "extracted",
                  "can_accept_translation": False,
              })
          assert sum(item["missing_count"] for item in entries) == 1415
          counts = {state: sum(unit["status"] == state for unit in PROGRESS["chapters"]) for state in ("extracted", "translated", "reviewed")}
          assert counts == {"extracted": 5, "translated": 42, "reviewed": 1}
          report = {
              "schema_version": 1,
              "book_slug": "the-claiming-moon",
              "source_revision": "source-000001",
              "original_epub_sha256": META["source"]["sha256"],
              "pinned_workflow_revision": META["workflow"]["resolved_revision"],
              "baseline_main_commit": BASE,
              "source_spine_and_block_hashes": "reverified from preserved original EPUB and matched 48 reference entries",
              "corpus_validation": "passed",
              "lifecycle_counts": counts,
              "remaining_chapters": entries,
              "total_missing_indexed_blocks": 1415,
              "remaining_independent_reviewer_pass_units": 47,
              "notes": [
                  "Only repo-persisted complete nonempty indexed draft blocks count as preserved.",
                  "Earlier chat-session attachments for chapters 15 and 27 were not present in the durable repository and are not counted as recovered.",
                  "Index coverage establishes structural staging only, not literary fidelity or independent PASS.",
                  "Do not machine-accept a chapter until every original block is represented and the full translation has been inspected.",
                  "No source, translation, progress or review state was mutated by this audit."
              ],
          }
          output = Path("docs/migrations/claiming-moon-untranslated-block-inventory.json")
          output.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("AUDIT_OK", json.dumps({"missing_blocks": 1415, "counts": counts, "gaps": [(r["chapter"], r["missing_start_index"], r["missing_end_index"]) for r in entries]}))
          PY
      - name: Commit read-only report and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/claiming-moon-missing-coverage.yml
          git add docs/migrations/claiming-moon-untranslated-block-inventory.json
          git commit -m "Document source-bound missing translation blocks without changing book state"
          git push origin HEAD:refs/heads/audit/claiming-moon-remaining-gaps-20261022
