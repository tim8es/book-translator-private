name: Wings of Starlight - canonical final EPUB delivery

on:
  push:
    branches: [main]
    paths:
      - 'books/wings-of-starlight-allison-saft/.workflow/final-delivery-request.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wings-of-starlight-allison-saft-canonical-final-delivery
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out private durable book state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify admission and install exactly pinned book runtime in disposable checkout
        shell: bash
        env:
          PIN: 14f75c08b5de5ed6ff7cbec9083e6e71308a3ba5
          SOURCE_SHA: 3cd1ad7fd5cfc7ef3b51993f96357e563bb7ba4f2646dc07cc28e38612ff3092
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          book=Path('books/wings-of-starlight-allison-saft')
          metadata=json.loads((book/'metadata.json').read_text('utf-8'))
          progress=json.loads((book/'progress.json').read_text('utf-8'))
          coverage=json.loads((book/'source-coverage.json').read_text('utf-8'))
          request=json.loads((book/'.workflow/final-delivery-request.json').read_text('utf-8'))
          assert request['operation']=='finalize-and-build-epub'
          assert request['workflow_revision']==os.environ['PIN']
          assert request['source_sha256']==os.environ['SOURCE_SHA']
          assert metadata['workflow']['resolved_revision']==os.environ['PIN']
          assert metadata['source']['sha256']==os.environ['SOURCE_SHA']
          assert coverage['source_sha256']==os.environ['SOURCE_SHA'] and coverage['state']=='verified'
          source=(book/'source/Wings_of_Starlight.epub').read_bytes()
          assert hashlib.sha256(source).hexdigest()==os.environ['SOURCE_SHA']
          assert len(progress['chapters'])==32
          assert all(x['status']=='reviewed' for x in progress['chapters'])
          assert not list((book/'.workflow/claims').glob('chapter-*.json'))
          for blocker in ('coordination-lock.json','source-promotion.json','finalization.json'):
              assert not (book/'.workflow'/blocker).exists(), 'active transition: '+blocker
          print('Source, workflow pin, coverage, review states and claims validated')
          PY
          git clone --quiet https://github.com/tim8es/book-translator.git "$RUNNER_TEMP/book-engine"
          git -C "$RUNNER_TEMP/book-engine" checkout --quiet --detach "$PIN"
          test "$(git -C "$RUNNER_TEMP/book-engine" rev-parse HEAD)" = "$PIN"
          rm -rf scripts
          cp -a "$RUNNER_TEMP/book-engine/scripts" scripts
          PIN="$PIN" python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('.book-translator-install.json')
          doc=json.loads(path.read_text('utf-8'))
          assert doc['canonical_repository']=='https://github.com/tim8es/book-translator'
          assert doc['install_root']=='.'
          doc['resolved_revision']=os.environ['PIN']
          path.write_text(json.dumps(doc, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY

      - name: Render accepted Russian drop-cap emphasis in disposable EPUB engine
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('scripts/workflow/epub_preserve.py')
          data=source.read_text('utf-8')
          original="                elif drop_cap is not None and translated:\n                    # Preserve either a single styled initial or an opening quote\n                    # plus a styled initial, including italic/bold decorated initials.\n                    prefix_len = 2 if len(initial) == 2 and translated.startswith(initial[0]) and len(translated) > 1 and translated[1].isalpha() else 1\n                    if not translated[prefix_len - 1].isalpha():\n                        raise PreservedEpubError(f\"Invalid translated drop-cap initial: {doc.path}\")\n                    node.text = None\n                    first = ET.SubElement(node, drop_cap.tag, drop_cap.attrib)\n                    first.text = translated[:prefix_len]\n                    wrapper = ET.Element(\"{http://www.w3.org/1999/xhtml}span\")\n                    _render_inline(wrapper, translated[prefix_len:])\n                    first.tail = wrapper.text\n                    node.extend(list(wrapper))\n"
          compatible="                elif drop_cap is not None and translated:\n                    # EPUB presentation-only compatibility: the accepted Markdown\n                    # may italicize an entire opening line while the original XHTML\n                    # keeps its initial letter in a separate styled drop cap.\n                    # Reuse the original large-initial span and render the remaining\n                    # Markdown with its intended emphasis, without changing the\n                    # canonical accepted chapter artifact.\n                    quotes = (\"«\", \"„\", \"“\", '\"', \"‘\", \"'\")\n                    italic_open = re.match(r\"^\\*([^*\\n]+)\\*\", translated)\n                    if italic_open:\n                        decorated = italic_open.group(1)\n                        prefix_len = (2 if len(decorated) > 1\n                                      and decorated[0] in quotes\n                                      and decorated[1].isalpha() else 1)\n                        if not decorated[prefix_len - 1].isalpha():\n                            raise PreservedEpubError(f\"Invalid translated drop-cap initial: {doc.path}\")\n                        initial_text = decorated[:prefix_len]\n                        remainder = (\n                            (\"*\" + decorated[prefix_len:] + \"*\")\n                            if decorated[prefix_len:] else \"\"\n                        ) + translated[italic_open.end():]\n                    else:\n                        prefix_len = (2 if len(translated) > 1\n                                      and translated[0] in quotes\n                                      and translated[1].isalpha() else 1)\n                        if not translated[prefix_len - 1].isalpha():\n                            raise PreservedEpubError(f\"Invalid translated drop-cap initial: {doc.path}\")\n                        initial_text = translated[:prefix_len]\n                        remainder = translated[prefix_len:]\n                    node.text = None\n                    first = ET.SubElement(node, drop_cap.tag, drop_cap.attrib)\n                    first.text = initial_text\n                    wrapper = ET.Element(\"{http://www.w3.org/1999/xhtml}span\")\n                    _render_inline(wrapper, remainder)\n                    first.tail = wrapper.text\n                    node.extend(list(wrapper))\n"
          if data.count(original) != 1:
              raise RuntimeError('Pinned EPUB renderer differs from audited input; refusing presentation fix')
          source.write_text(data.replace(original, compatible, 1), encoding='utf-8')
          print('Presentation-only drop-cap compatibility enabled in disposable runner')
          PY

      - name: Run pinned preflight, finalization, EPUB build and independent output checks
        shell: bash
        run: |
          set -euo pipefail
          python scripts/book.py validate wings-of-starlight-allison-saft
          python scripts/corpus.py verify wings-of-starlight-allison-saft
          python scripts/book.py finalize wings-of-starlight-allison-saft --json > "$RUNNER_TEMP/wings-of-starlight-allison-saft-finalization.json"
          python scripts/book.py build wings-of-starlight-allison-saft --format epub
          python scripts/book.py build-status wings-of-starlight-allison-saft --json > "$RUNNER_TEMP/wings-of-starlight-allison-saft-build-status.json"
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          book=Path('books/wings-of-starlight-allison-saft')
          manifest=json.loads((book/'output/manifest.json').read_text('utf-8'))
          assert manifest['unit_count']==32 and manifest['format']=='epub' and manifest['preview'] is False
          artifact=book/manifest['artifact_path']
          data=artifact.read_bytes()
          assert hashlib.sha256(data).hexdigest()==manifest['artifact_sha256']
          with zipfile.ZipFile(artifact) as archive:
              assert archive.testzip() is None
              assert archive.namelist()[0]=='mimetype'
              assert archive.read('mimetype')==b'application/epub+zip'
              assert len([name for name in archive.namelist() if name.endswith('.xhtml')])>=32
          status=json.loads(Path('/tmp/nonexistent').read_text()) if False else None
          assert (book/'STATE.md').is_file()
          assert (book/'FINAL_QUALITY_GATES.md').is_file()
          assert (book/'REVIEW_REPORT.md').is_file()
          print('Validated canonical final EPUB:',artifact,'sha256:',manifest['artifact_sha256'])
          PY

      - name: Upload validated EPUB and inspection reports as downloadable run artifact
        uses: actions/upload-artifact@v4
        with:
          name: wings-of-starlight-russian-epub
          path: |
            books/wings-of-starlight-allison-saft/output/*.epub
            books/wings-of-starlight-allison-saft/output/manifest.json
            books/wings-of-starlight-allison-saft/FINAL_QUALITY_GATES.md
            books/wings-of-starlight-allison-saft/REVIEW_REPORT.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish final reports and verified EPUB only if repository head is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git restore -- scripts .book-translator-install.json
          git add -A -- books/wings-of-starlight-allison-saft
          git diff --cached --quiet && { echo 'No output changes to publish'; exit 0; }
          git fetch --quiet origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::Repository changed during finalization; refusing stale publication"
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "finalize(wings-of-starlight-allison-saft): canonical reports and validated EPUB"
          git push origin HEAD:main
