name: Restore Blood and Honey sealed source corpus

on:
  push:
    paths:
      - '.github/workflows/restore-blood-honey-source.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact sealed extracted corpus
        shell: python
        run: |
          import base64
          import bz2
          import hashlib
          import json
          from pathlib import Path

          root = Path('.')
          book = root / 'books' / 'blood-and-honey-rbmk-caleb-pov'
          payload = ''.join(
              (root / '.import' / f'blood-and-honey-source.part{i:02d}').read_text(encoding='utf-8')
              for i in range(1, 9)
          )
          raw = bz2.decompress(base64.b64decode(payload))

          pos = 0
          restored = []
          while pos < len(raw):
              end = raw.index(b'\0', pos)
              name = raw[pos:end].decode('utf-8')
              pos = end + 1
              end = raw.index(b'\0', pos)
              size = int(raw[pos:end].decode('ascii'))
              pos = end + 1
              data = raw[pos:pos + size]
              if len(data) != size:
                  raise RuntimeError(f'truncated payload for {name}')
              pos += size
              path = book / 'extracted' / name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              restored.append(name)

          if len(restored) != 12:
              raise RuntimeError(f'expected 12 restored units, got {len(restored)}')

          manifest = json.loads((book / 'source-manifest.json').read_text(encoding='utf-8'))
          for item in manifest['extracted']:
              path = book / item['path']
              if not path.is_file():
                  raise RuntimeError(f'missing sealed source artifact: {item["path"]}')
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != item['sha256']:
                  raise RuntimeError(
                      f'hash mismatch for {item["path"]}: {digest} != {item["sha256"]}'
                  )

          print('Restored and verified all 15 sealed extracted source artifacts.')

      - name: Commit restored corpus
        run: |
          git config user.name "book-translator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add books/blood-and-honey-rbmk-caleb-pov/extracted
          if ! git diff --cached --quiet; then
            git commit -m "Restore sealed Blood and Honey source corpus"
            git push
          fi
