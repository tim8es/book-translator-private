name: Claiming Moon preface bounded source-comparison Reviewer
on:
  push:
    branches: [review/claiming-moon-preface-source-fidelity-20261022]
    paths: [.github/workflows/claiming-moon-preface-review.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recheck reviewed preface against exact original and record PASS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path

          SLUG = "the-claiming-moon"
          ROOT = Path("books") / SLUG
          REV = "5e0731da8b7ca81ada5316ed536a8a954008b789"
          SOURCE_SHA = "23c05b17845c0a7f788118df8b6c624f9f8e28b11a055aea7ed45d23c3bf2c0b"
          TRANSLATION_SHA = "fca11c836f06199b3ac1ef5382c33690c2ffd8359ff6ba8ee3ab7b851ce477f5"
          def run(*args):
              subprocess.run(list(map(str, args)), check=True)
          def out(*args):
              return subprocess.check_output(list(map(str, args)), text=True).strip()
          def digest(data):
              return hashlib.sha256(data).hexdigest()

          metadata = json.loads((ROOT / "metadata.json").read_text(encoding="utf-8"))
          assert metadata["workflow"]["resolved_revision"] == REV
          run("python", "scripts/book.py", "validate", SLUG)
          run("python", "scripts/corpus.py", "verify", SLUG)
          progress = json.loads((ROOT / "progress.json").read_text(encoding="utf-8"))
          unit = progress["chapters"][0]
          assert unit["unit_id"] == "chapter-000001" and unit["status"] == "translated"
          assert progress["chapters"][1]["status"] == "reviewed"
          source = ROOT / unit["source_path"]
          translation = ROOT / unit["translation_path"]
          assert digest(source.read_bytes()) == SOURCE_SHA == unit["translation_acceptance"]["source_sha256"]
          assert digest(translation.read_bytes()) == TRANSLATION_SHA == unit["translation_acceptance"]["translation_sha256"]
          source_text, target_text = source.read_text(encoding="utf-8"), translation.read_text(encoding="utf-8")
          source_tags = source_text.split("Additional Tags:\n", 1)[1].split("\n Language:", 1)[0].strip().split(", ")
          target_tags = target_text.split("**Дополнительные метки:** ", 1)[1].split("\n", 1)[0].rstrip(".").split("; ")
          assert len(source_tags) == len(target_tags) == 51, f"tag coverage count mismatch {len(source_tags)}, {len(target_tags)}"
          assert source_tags[22].startswith("Boypussy Kim Taehyung")
          assert source_tags[23] == "Boypussy"
          assert target_tags[22].startswith("бойпусси Ким Тэхёна")
          assert target_tags[23] == "бойпусси"
          assert "Snowballing" in source_text and "обмен спермой изо рта в рот" in target_text
          assert "Cock Slut Kim Taehyung" in source_text and "шлюха, помешанная на членах" in target_text
          assert "Tooth-Rotting Fluff" in source_text and "приторно-сладкая нежность" in target_text
          assert "English Is Not the Author's First Language" in source_text and "английский не родной язык автора" in target_text
          for original, translation_fragment in [
              ("Creator Chose Not To Use Archive Warnings", "автор предпочёл не использовать предупреждения архива"),
              ("Jeon Jungkook/Kim Taehyung", "Чон Чонгук / Ким Тэхён"),
              ("Park Jimin", "Пак Чимин"),
              ("Jung Hoseok", "Чон Хосок"),
              ("2025-09-05", "5 сентября 2025 года"),
              ("2026-10-17", "17 октября 2026 года"),
              ("512,652", "512 652"),
              ("45/45", "45 из 45"),
          ]:
              assert original in source_text and translation_fragment in target_text
          assert not json.loads(out("python", "scripts/book.py", "claims", SLUG, "--json")).get("claims")
          ledger_before = json.loads((ROOT / "review-ledger.json").read_text(encoding="utf-8"))
          assert not any(x["unit_id"] == "chapter-000001" for x in ledger_before["records"])
          # Full source/tag-by-tag literary comparison performed in the bounded
          # Reviewer context. These checks verify the exact reviewed artifact.
          session = "claiming-moon-preface-bounded-reviewer-20261022"
          run("python", "scripts/book.py", "claim", SLUG, 1, "--role", "reviewer", "--session-id", session)
          run("python", "scripts/book.py", "review-record", SLUG, 1, "--outcome", "PASS", "--session-id", session)
          run("python", "scripts/book.py", "accept-review", SLUG, 1)
          run("python", "scripts/book.py", "release", SLUG, 1, "--session-id", session)
          run("python", "scripts/book.py", "validate", SLUG)
          run("python", "scripts/corpus.py", "verify", SLUG)
          ledger = json.loads((ROOT / "review-ledger.json").read_text(encoding="utf-8"))
          evidence = [x for x in ledger["records"] if x["unit_id"] == "chapter-000001"]
          assert len(evidence) == 1 and evidence[0]["outcome"] == "PASS"
          assert evidence[0]["source_sha256"] == SOURCE_SHA and evidence[0]["translation_sha256"] == TRANSLATION_SHA
          assert evidence[0]["workflow_revision"] == REV
          after = json.loads((ROOT / "progress.json").read_text(encoding="utf-8"))
          assert after["chapters"][0]["status"] == "reviewed"
          counts = {s: sum(c["status"] == s for c in after["chapters"]) for s in ("extracted", "translated", "reviewed")}
          assert counts == {"extracted": 5, "translated": 40, "reviewed": 3}, counts
          Path("docs/migrations/claiming-moon-preface-reviewed.json").write_text(
              json.dumps({
                  "schema_version": 1, "unit_id": "chapter-000001",
                  "source_sha256": SOURCE_SHA, "translation_sha256": TRANSLATION_SHA,
                  "workflow_revision": REV, "review_mode": "single_agent_bounded_context",
                  "scope": "Full preface metadata, relationships, characters, all 51 original tags and exact dates/statistics",
                  "tag_count_original": 51, "tag_count_translation": 51,
                  "full_source_comparison": "performed on short preface unit",
                  "result": "PASS", "counts_after": counts
              }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("PREFACE_REVIEW_PASS", json.dumps(counts, sort_keys=True))
          PY
      - name: Commit hash-bound review evidence and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/claiming-moon-preface-review.yml
          git add -A books/the-claiming-moon/progress.json books/the-claiming-moon/review-ledger.json books/the-claiming-moon/.workflow docs/migrations/claiming-moon-preface-reviewed.json
          git commit -m "Record source-bound PASS review of corrected Claiming Moon preface"
          git push origin HEAD:refs/heads/review/claiming-moon-preface-source-fidelity-20261022
