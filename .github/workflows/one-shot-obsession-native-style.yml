name: Obsession native-style EPUB (one-shot)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-obsession-native-style.yml'
      - 'books/obsession-eva-marks/staging/native_style_build.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: obsession-native-style-build
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private book state
        uses: actions/checkout@v7
        with:
          path: work
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Checkout pinned canonical workflow
        uses: actions/checkout@v7
        with:
          path: engine
          repository: tim8es/book-translator
          ref: 8f70b1c1c108926599c36ce40021860bed581400
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate canonical durable book and original EPUB
        working-directory: work
        shell: bash
        run: |
          rm -rf scripts
          cp -R ../engine/scripts scripts
          python - <<'PY'
          from pathlib import Path
          import json
          f=Path('.book-translator-install.json')
          v=json.loads(f.read_text())
          v['resolved_revision']='8f70b1c1c108926599c36ce40021860bed581400'
          f.write_text(json.dumps(v))
          PY
          python scripts/book.py validate obsession-eva-marks
          python scripts/corpus.py verify obsession-eva-marks
      - name: Preserve native original layout and localized reviewed text
        working-directory: work
        shell: bash
        run: |
          python books/obsession-eva-marks/staging/native_style_build.py
      - name: Commit verified enhanced book, reports, no workflow upgrade
        working-directory: work
        shell: bash
        run: |
          git config user.name 'book-translator-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'Concurrent book repository change; refusing to commit potentially stale build.' >&2
            exit 1
          fi
          git add -- books/obsession-eva-marks/output/obsession-eva-marks-original-style.epub books/obsession-eva-marks/output/obsession-eva-marks-original-style-report.json
          git diff --cached --check
          git commit -m 'build(obsession): publish verified native-layout Russian EPUB with original CSS/fonts/TOC'
          git push origin HEAD:main
