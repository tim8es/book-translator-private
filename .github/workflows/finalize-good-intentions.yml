name: One-shot finalize Good Intentions review

on:
  push:
    branches:
      - work/good-intentions-ru-20260903
    paths:
      - .github/workflows/finalize-good-intentions.yml

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/good-intentions-ru-20260903
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore verified source transport for structural validation
        uses: actions/download-artifact@v4
        with:
          name: good-intentions-current-epub
          path: /tmp/good-intentions-current
          github-token: ${{ github.token }}
          run-id: 33776799289

      - name: Attach source and verify transport hash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p books/good-intentions/source books/good-intentions/output
          cp /tmp/good-intentions-current/Good_Intentions.current.epub books/good-intentions/source/Good_Intentions.epub
          test "$(sha256sum books/good-intentions/source/Good_Intentions.epub | awk '{print $1}')" = "29f7a0e45d519072e4ab29fde061d37d553fa3a15916a5914c3a0abc5d4fe1c1"

      - name: Apply final review corrections and run quality gates
        run: python scripts/finalize_good_intentions_review.py

      - name: Commit only durable final state
        shell: bash
        run: |
          set -euo pipefail
          rm -f books/good-intentions/source/Good_Intentions.epub
          rm -f scripts/finalize_good_intentions_review.py
          rm -f .github/workflows/export-final-validation-workspace.yml
          git config user.name "book-translator-finalizer"
          git config user.email "book-translator-finalizer@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "review: finalize all 205 units after structural PASS"
          git push origin HEAD:work/good-intentions-ru-20260903
