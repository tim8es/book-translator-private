name: Export Blood and Honey translated EPUB archive

on:
  push:
    paths:
      - '.github/workflows/export-blood-honey-epub.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export existing translated EPUB as compressed text chunks
        shell: python
        run: |
          import base64, hashlib, json, shutil, tarfile, zipfile
          from pathlib import Path

          src = Path('books/blood-and-honey-rbmk-caleb-pov/output/Blood_and_Honey_RU.epub')
          out = Path('.import/blood-honey-old-epub-export')
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True)

          extracted = Path('/tmp/bh_old_epub')
          if extracted.exists():
              shutil.rmtree(extracted)
          extracted.mkdir(parents=True)
          with zipfile.ZipFile(src) as z:
              z.extractall(extracted)

          archive = Path('/tmp/bh_old_epub.tar.xz')
          with tarfile.open(archive, 'w:xz', preset=9) as tf:
              for p in sorted(extracted.rglob('*')):
                  if p.is_file():
                      tf.add(p, arcname=p.relative_to(extracted))

          raw = archive.read_bytes()
          b64 = base64.b64encode(raw).decode('ascii')
          chunk_size = 12000
          parts = [b64[i:i+chunk_size] for i in range(0, len(b64), chunk_size)]
          for i, part in enumerate(parts):
              (out / f'part-{i:03d}.txt').write_text(part, encoding='ascii')

          manifest = {
              'source_epub_sha256': hashlib.sha256(src.read_bytes()).hexdigest(),
              'archive_sha256': hashlib.sha256(raw).hexdigest(),
              'archive_bytes': len(raw),
              'base64_chars': len(b64),
              'chunk_size': chunk_size,
              'parts': len(parts),
          }
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

      - name: Commit export chunks
        run: |
          git config user.name "book-translator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .import/blood-honey-old-epub-export
          git commit -m "Export translated Blood and Honey EPUB for chapter 13 update"
          git pull --rebase origin main
          git push
