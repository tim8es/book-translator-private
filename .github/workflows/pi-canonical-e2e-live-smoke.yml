name: Ephemeral Pi canonical one-chapter EPUB integration
on:
  push:
    branches:
      - ci/pi-live-smoke-20261121
    paths:
      - .github/workflows/pi-canonical-e2e-live-smoke.yml
permissions:
  contents: read
jobs:
  synthetic-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout private test harness (no persisted token)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout immutable canonical Pi engine
        uses: actions/checkout@v4
        with:
          repository: tim8es/book-translator
          ref: ffcc39c1977cd36107510953ad6c689dabd10ab0
          path: .pi-engine
          persist-credentials: false
      - name: Check exact pinned public revision
        run: test "$(git -C .pi-engine rev-parse HEAD)" = "ffcc39c1977cd36107510953ad6c689dabd10ab0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Pi
        run: npm install --global --ignore-scripts @earendil-works/pi-coding-agent@1.6.0
      - name: Run one synthetic chapter through canonical translation/review/EPUB
        shell: bash
        env:
          PUBLIC_ENGINE_PATH: ${{ github.workspace }}/.pi-engine
          BOOK_TRANSLATOR_LLM_BACKEND: pi
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_BASE_URL: ${{ vars.OMNIROUTE_BASE_URL }}
          OMNIROUTE_TRANSLATOR_MODEL: ${{ vars.OMNIROUTE_TRANSLATOR_MODEL }}
          OMNIROUTE_REVIEWER_MODEL: ${{ vars.OMNIROUTE_REVIEWER_MODEL }}
          OMNIROUTE_CORRECTOR_MODEL: ${{ vars.OMNIROUTE_CORRECTOR_MODEL }}
          PI_AGENT_CONTEXT_WINDOW: "131072"
          PI_AGENT_MAX_TOKENS: "4096"
        run: |
          set -euo pipefail
          python ci/pi_live_canonical_smoke.py
