name: Obsession layout audit (one-shot)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-obsession-layout-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Audit native source markup and translated Markdown
        shell: bash
        run: |
          python - <<'PY'
          import json,zipfile,xml.etree.ElementTree as ET,posixpath,collections,re
          from pathlib import Path
          root=Path('books/obsession-eva-marks')
          meta=json.loads((root/'metadata.json').read_text())
          progress=json.loads((root/'progress.json').read_text())
          src=root/'source/Obsession_Eva_Marks.epub'
          with zipfile.ZipFile(src) as z:
              names=z.namelist()
              print('SOURCE_MEMBERS',len(names))
              types=collections.Counter((n.rsplit('.',1)[-1].lower() if '.' in n else '') for n in names)
              print('SOURCE_TYPES',json.dumps(types))
              opf=ET.fromstring(z.read('META-INF/container.xml'))
              rootfile=next(x.attrib['full-path'] for x in opf.iter() if x.tag.endswith('rootfile'))
              package=ET.fromstring(z.read(rootfile)); parent=posixpath.dirname(rootfile)
              manifest={x.attrib['id']:x.attrib for x in package.iter() if x.tag.endswith('item') and 'id' in x.attrib}
              spine=[x.attrib['idref'] for x in package.iter() if x.tag.endswith('itemref')]
              print('SOURCE_OPF',rootfile,'SPINE',len(spine))
              print('NATIVE_RESOURCES',json.dumps([{'path':k,'size':z.getinfo(k).file_size} for k in names if re.search(r'\.(css|ttf|otf|woff|woff2|svg|png|jpe?g)$',k,re.I)][:65]))
              print('STYLESHEET_SAMPLES')
              for k in [k for k in names if k.lower().endswith('.css')][:4]:
                print(k,z.read(k)[:2500].decode('utf-8','replace'))
              report=[]
              for i,u in enumerate(progress['chapters']):
                  if i>=len(spine):break
                  item=manifest[spine[i]]
                  name=posixpath.normpath(posixpath.join(parent,item['href']))
                  blob=z.read(name)
                  try:
                      tree=ET.fromstring(blob)
                      parse='ok'
                  except ET.ParseError as e:
                      tree=None;parse='xml_error: '+str(e)
                  code=(root/u['translation_path']).read_text('utf-8')
                  parts=[p for p in re.split(r'\n\s*\n',code.strip()) if p.strip()]
                  nonheading=[p for p in parts if not p.lstrip().startswith('#')]
                  blocks=[]
                  if tree is not None:
                      for elem in tree.iter():
                          tag=elem.tag.split('}')[-1].lower()
                          if tag in {'p','h1','h2','h3','h4','h5','h6','li','blockquote'}:
                              val=''.join(elem.itertext()).strip()
                              if val:blocks.append((tag,val))
                  report.append({'chapter':u['number'],'src':name,'xml':parse,'source_blocks':len(blocks),'source_tags':dict(collections.Counter(x[0] for x in blocks)),'translated_parts':len(parts),'translated_nonheading':len(nonheading),'source_images':len(re.findall(rb'<(?:img|image)\b',blob,re.I)),'source_links':len(re.findall(rb'<a\s',blob,re.I)),'translated_markdown_links':len(re.findall(r'\]\(',code))})
                  if i in (0,1,2,3,4,5,6,7,8,45):
                      print('SAMPLE',i+1,name,blob[:2400].decode('utf-8','replace'))
              print('UNIT_REPORT_START')
              print(json.dumps(report,ensure_ascii=False,separators=(',',':')))
              print('UNIT_REPORT_END')
          PY
