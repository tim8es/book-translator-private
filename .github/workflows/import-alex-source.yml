name: Import Alex Cole exact source EPUB

on:
  push:
    paths:
      - 'books/alex-cole-ten-commandments/.source-import/READY'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify exact source
        shell: bash
        run: |
          set -euo pipefail
          BOOK='books/alex-cole-ten-commandments'
          IMPORT="$BOOK/.source-import"
          SOURCE_NAME='alex-cole-ten-commandments_414809252.epub'

          {
            cat "$IMPORT/part-000"
            cat "$IMPORT/part-001"
            cat "$IMPORT/part-002"
            cat "$IMPORT/part-003.fix-0" "$IMPORT/part-003.fix-1" "$IMPORT/part-003.fix-2" "$IMPORT/part-003.fix-3"
            cat "$IMPORT/part-004"
            cat "$IMPORT/part-005.fix-0" "$IMPORT/part-005.fix-1" "$IMPORT/part-005.fix-2" "$IMPORT/part-005.fix-3"
            cat "$IMPORT/part-006"
            cat "$IMPORT/part-007"
            cat "$IMPORT/part-008.fix-0" "$IMPORT/part-008.fix-1" "$IMPORT/part-008.fix-2" "$IMPORT/part-008.fix-3"
            cat "$IMPORT/part-009"
            cat "$IMPORT/part-010"
            cat "$IMPORT/part-011"
            cat "$IMPORT/part-012"
            cat "$IMPORT/part-013"
            cat "$IMPORT/part-014"
          } > /tmp/alex-source.b64

          base64 -d /tmp/alex-source.b64 > /tmp/alex-source.epub.xz
          test "$(sha256sum /tmp/alex-source.epub.xz | awk '{print $1}')" = '2f6ca5e82393421769c34a806f6989a5875dbed82359e5d04fef3bd8cf81ed3d'

          xz -dc /tmp/alex-source.epub.xz > /tmp/alex-source.epub
          test "$(sha256sum /tmp/alex-source.epub | awk '{print $1}')" = 'fcfedf4a253a22df3c0baa767cbe5ccdb30916a5957515f4d68b5b5f0be590dc'

          mkdir -p "$BOOK/source" "$BOOK/output"
          cp /tmp/alex-source.epub "$BOOK/source/$SOURCE_NAME"

          python scripts/book.py validate alex-cole-ten-commandments
          python scripts/corpus.py verify alex-cole-ten-commandments

      - name: Commit canonical exact source
        shell: bash
        run: |
          set -euo pipefail
          BOOK='books/alex-cole-ten-commandments'
          rm -rf "$BOOK/.source-import"
          git config user.name 'book-translator-bot'
          git config user.email 'book-translator-bot@users.noreply.github.com'
          git add "$BOOK"
          git commit -m 'book: materialize and verify exact Alex Cole source EPUB'
          git push
