name: Correct and review Blood and Honey unit 13

on:
  push:
    paths:
      - '.github/workflows/blood-honey-review-unit-13.yml'

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tim8es/book-translator
          ref: a0c1a3c450a8251d2d90f4de5d5a988b5466958f
          path: .workflow-engine
      - name: Claim translator correction for unit 13
        shell: python
        run: |
          import os, sys
          from pathlib import Path
          sys.path.insert(0, str((Path('.workflow-engine')/'scripts').resolve()))
          from workflow.claims import ClaimManager
          from workflow.filesystem import FilesystemStorage
          from workflow.repository import WorkflowStateRepository
          from workflow.schemas import SchemaKind
          book=Path('books/blood-and-honey-rbmk-caleb-pov').resolve(); repo=WorkflowStateRepository(FilesystemStorage(book))
          progress=repo.read('progress.json',SchemaKind.PROGRESS); meta=repo.read('metadata.json',SchemaKind.METADATA).data
          ClaimManager(repo).acquire(progress.data,'13',role='translator',session_id=f"gha-{os.environ['GITHUB_RUN_ID']}-translator-013-reviewfix",base_revision=progress.version,base_commit=os.environ['GITHUB_SHA'],workflow_revision=meta['workflow']['resolved_revision'])
      - name: Apply corrections
        shell: python
        run: |
          from pathlib import Path
          p=Path('books/blood-and-honey-rbmk-caleb-pov/translated/013-chapter-11.md'); t=p.read_text(encoding='utf-8')
          reps=[
            ('позволил пальцам с сожалением пройтись по кремовому костюму','позволил пальцам с удовольствием пройтись по кремовому костюму'),
            ('а выглядела она так, словно получила всё, чего хотела.','а выглядела она словно кошка, дорвавшаяся до сливок.'),
          ]
          for a,b in reps:
            assert t.count(a)==1,(a,t.count(a)); t=t.replace(a,b)
          p.write_text(t,encoding='utf-8')
      - name: Reaccept and review
        shell: python
        run: |
          import os,sys
          from pathlib import Path
          sys.path.insert(0,str((Path('.workflow-engine')/'scripts').resolve()))
          from workflow.claims import ClaimManager
          from workflow.filesystem import FilesystemStorage
          from workflow.repository import WorkflowStateRepository
          from workflow.schemas import SchemaKind
          from workflow.translations import TranslationAcceptanceManager
          from workflow.reviews import ReviewLedgerManager
          book=Path('books/blood-and-honey-rbmk-caleb-pov').resolve(); repo=WorkflowStateRepository(FilesystemStorage(book)); reader=lambda p:(book/p).read_bytes(); claims=ClaimManager(repo)
          meta=repo.read('metadata.json',SchemaKind.METADATA).data; progress=repo.read('progress.json',SchemaKind.PROGRESS)
          ts=f"gha-{os.environ['GITHUB_RUN_ID']}-translator-013-reviewfix"
          TranslationAcceptanceManager(repo,artifact_reader=reader).accept(progress.data,progress.version,meta,13,session_id=ts)
          progress=repo.read('progress.json',SchemaKind.PROGRESS); claims.release(progress.data,'13',session_id=ts,detail='review corrections applied')
          progress=repo.read('progress.json',SchemaKind.PROGRESS); rs=f"gha-{os.environ['GITHUB_RUN_ID']}-reviewer-013"
          claims.acquire(progress.data,'13',role='reviewer',session_id=rs,base_revision=progress.version,base_commit=os.environ['GITHUB_SHA'],workflow_revision=meta['workflow']['resolved_revision'])
          reviews=ReviewLedgerManager(repo,artifact_reader=reader); reviews.record(progress.data,progress.version,meta,13,outcome='PASS',reviewer_session_id=rs,review_commit=None)
          claims.release(progress.data,'13',session_id=rs,detail='independent full source-comparison review PASS')
          progress=repo.read('progress.json',SchemaKind.PROGRESS); reviews.accept_review(progress.data,progress.version,meta,13)
      - name: Commit durable state
        run: |
          rm -rf .workflow-engine
          git config user.name "book-translator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add books/blood-and-honey-rbmk-caleb-pov
          git commit -m "Correct and review Blood and Honey chapter 11"
          git push
