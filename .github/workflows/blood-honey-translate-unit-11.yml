name: Translate Blood and Honey unit 11

on:
  push:
    paths:
      - '.github/workflows/blood-honey-translate-unit-11.yml'

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tim8es/book-translator
          ref: a0c1a3c450a8251d2d90f4de5d5a988b5466958f
          path: .workflow-engine
      - name: Claim unit 11 as translator
        shell: python
        run: |
          import os, sys
          from pathlib import Path
          sys.path.insert(0, str((Path('.workflow-engine') / 'scripts').resolve()))
          from workflow.claims import ClaimManager
          from workflow.filesystem import FilesystemStorage
          from workflow.repository import WorkflowStateRepository
          from workflow.schemas import SchemaKind
          book = Path('books/blood-and-honey-rbmk-caleb-pov').resolve()
          repo = WorkflowStateRepository(FilesystemStorage(book))
          progress = repo.read('progress.json', SchemaKind.PROGRESS)
          metadata = repo.read('metadata.json', SchemaKind.METADATA).data
          ClaimManager(repo).acquire(progress.data, '11', role='translator',
              session_id=f"gha-{os.environ['GITHUB_RUN_ID']}-translator-011",
              base_revision=progress.version, base_commit=os.environ['GITHUB_SHA'],
              workflow_revision=metadata['workflow']['resolved_revision'])
      - name: Write Russian Chapter 9 translation
        shell: bash
        run: |
          cat > books/blood-and-honey-rbmk-caleb-pov/translated/011-chapter-9.md <<'EOF'
          ## Глава 9

          Калеб проснулся в той ленивой, туманной полудрёме, которая бывает после по-настоящему хорошего сна. По яркости света, пробивавшегося даже сквозь закрытые веки, он понял, что уже как минимум середина дня, но совершенно не чувствовал необходимости торопиться навстречу бодрствованию. Рука Ариана обнимала его, грудь за спиной Калеба была стеной тепла, и он неторопливо потянулся, вытянувшись всем телом. Медленно открыл глаза и оглянулся через плечо. Ариан лежал позади, опираясь на локоть, и просто смотрел на него. Калеб ответил лёгкой, расслабленной улыбкой.

          — Доброе утро, солнышко.

          Голос Ариана был приглушённым и хриплым со сна, а ответная улыбка — мягкой. Калеб просиял, схватил его за руку и снова отвернулся, прижав украденную ладонь к груди, пока тяжёлые веки уговаривали опять провалиться в сон. Когда они наконец легли, солнце уже играло у края горизонта. Сейчас Калебу было тепло, уютно и спокойно. Пальцы Ариана мягко перебирали его кудри, а голос скользнул по Калебу, как шёлк.

          — Для человека, который утверждает, что не может спать рядом с кем-то, ты спал как младенец.

          Калеб слышал в его тоне дразнящую улыбку, и собственная довольная улыбка стала ещё шире.

          — Сделай скидку. Я был вымотан. Это был мой первый раз с мужчиной.

          Ариан легко поцеловал ушибленное плечо Калеба. Принц перекатился на спину и потянулся вверх за поцелуем. Одна ладонь легла на лопатку Ариана, другая обхватила шею сбоку; большой палец устроился между линией челюсти и ухом. Большая ладонь Ариана тёпло накрыла щёку Калеба, и они обменивались медленными, ленивыми поцелуями, никуда не торопясь. Калеб с удовольствием провёл бы так в постели с Арианом весь день. Всё вокруг казалось мягким, словно набитым ватой, — тот особенный сонный туман, в котором мир становится ласковым и неторопливым. Он откинулся на подушки; Ариан переместился и теперь нависал над ним, а улыбка Калеба стала ещё ярче.

          — Если совсем честно, целуешься ты действительно отлично, — сияя, сказал Калеб.

          Ариан рассмеялся, и Калебу это понравилось. Его лицо было открытым — улыбка, морщинки у глаз, спокойное тепло. Ариан выглядел счастливым, а вместе с этим — моложе, будто с плеч сняли привычный груз.

          — Я почти уверен, что одними поцелуями мы не ограничились, — напомнил Ариан.

          От воспоминаний о прошлой ночи мышцы Калеба на мгновение сжались, а по телу скользнула новая искра желания.

          — Вот бы дочь Карузо застала нас сейчас. Я бы многое отдал за выражение её лица, — признался Калеб.

          При имени Карузо по лицу Ариана прошёл холодный отблеск.

          — Карузо уже заплатили за прошлую ночь.

          Из голоса исчез весь юмор, а холод стал лезвием на языке и заострил каждое слово.

          Калеб нахмурился в недоумении.

          — Что ты сделал?

          — Сжёг два их поместья, — сообщил Ариан с той же безмятежностью, с какой мог бы объявить прогноз погоды.

          Калеб недоверчиво фыркнул. Он сжёг два их поместья? Только потому, что они похитили Калеба?

          — Это безумие, — вслух подумал он.

          — Я всегда был таким, — искренне ответил Ариан.

          В его глазах горел тот самый огонь, рядом с которым Калебу самому хотелось сгореть.

          Калеб не нашёлся с ответом. Признание Ариана выбило почву из-под ног. Тот без колебаний напал ради него на другую мафиозную семью — а если мафиозная политика хотя бы отдалённо напоминала королевскую, последствия могли быть очень серьёзными. В глазах Ариана не было сожаления, только осторожная открытость, смягчавшая серо-зелёный взгляд.

          — Ты раньше бывал на Сицилии? — внезапно спросил Ариан.

          Перед глазами Калеба вспышками возникли заснеженные деревья, связанный окровавленный мальчик, серебряный нож — короткие послесвечения, исчезавшие с каждым морганием. Он снова подумал, не рассказать ли Ариану о том мальчике, но это была самая тщательно оберегаемая его тайна. У принца и без того почти не существовало вещей, принадлежавших только ему. Поэтому Калеб снова уклонился от ответа.

          — Вопрос возник совершенно из ниоткуда.

          Но причина у Ариана наверняка была. Неужели они могли встречаться раньше? Калеб не представлял, где их пути могли пересечься, но для Ариана это явно что-то значило. В его глазах вновь появилась прежняя напряжённость — словно внутри он наконец принял какое-то решение.

          — Подожди. Я хочу кое-что тебе показать.

          Калеб кивнул. Ариан поцеловал его в челюсть, выбрался из постели, накинул тёмно-синий халат и босиком направился к столу.

          Калеб лениво потянулся. Мышцы сладко ныли — именно так, как и должны были. Он встал, снова растянул затёкшее тело и надел собственный халат. Сначала заглянул в ванную, затем неторопливо подошёл к Ариану, который смотрел в открытый ящик стола.

          — Что там? — с лёгкой улыбкой спросил Калеб, приближаясь и засунув руки в карманы халата.

          Ариан поднял на него взгляд. В глазах боролось что-то похожее на тревогу. Калеб видел, как тот глубоко вдохнул, собрался и потянулся в ящик.

          В этот же момент в дверь постучали.

          Ариан замер.

          — Кто там?

          — Босс, мы его нашли, — донёсся голос с другой стороны.

          Дыхание Ариана участилось. Глаза широко распахнулись, губы приоткрылись от потрясения.

          +++

          — Где? — хрипло выдавил Ариан.

          Калеб почти готов был поклясться, что тот нервничает, хотя ему трудно было поверить, что вообще существует человек, способный заставить Ариана нервничать.

          — Мы отвели его в сад.

          — Сейчас буду.

          Взгляд Ариана метнулся к растерянному лицу Калеба. В каждой линии его тела читалась вина. Он резко тряхнул головой, словно пытаясь прийти в себя.

          — Мне нужно…

          Ариан неопределённо указал на гардеробную. Калеб просто кивнул и отошёл в сторону, пропуская его.

          Сам Калеб решил остаться в халате. Кто бы ни был этот загадочный человек, присутствие принца, скорее всего, не требовалось. К тому же Калеб эгоистично хотел как можно дольше удержать то расслабленное, сонное спокойствие, с которым проснулся. Резкая перемена в Ариане этому не помогала. Но незнакомец явно был важен, если ради него Ариан так поспешно одевался, лишь бы не заставлять ждать.

          Внезапный всплеск ревности застал Калеба врасплох, и он с трудом попытался его подавить. Если рассуждать здраво, помимо фиктивного брачного контракта, огромной неожиданной и, возможно, безответной влюблённости и одной сумасшедшей ночи потрясающего секса на адреналине у Калеба не было никаких прав ревновать Ариана. Тот ведь не принадлежал ему по-настоящему.

          От этой мысли неприятно свело живот.

          Калеб всё сильнее хотел — и, если уж честно, хотел уже давно, — чтобы принадлежал.

          Ариан вышел из гардеробной в чёрных брюках, белой рубашке, чёрном жилете и металлически-бронзовом галстуке с тонкими диагональными полосками сливочно-жёлтого цвета. При виде двух подвязок для рукавов, обхватывавших его бицепсы, Калеб едва не пускал слюни. Он облизал внезапно пересохшие губы и сделал вид, будто невероятно увлечён стаей птиц, пересекавшей небо за окном.

          С террасы Ариана сад увидеть было нельзя — Калеб уже проверял. Но прохладный ветер приятно касался лица и давал отличный повод не встречаться с Арианом глазами. Калеб понятия не имел, что сейчас написано на его собственном лице, и вовсе не собирался показывать Ариану сумятицу и неуверенность. Поэтому он трусливо прятался.

          *Очень по-королевски,* — с горечью отругал себя Калеб.

          — Мне нужно идти.

          Голос Ариана рассёк тревожные мысли. Затем Калеб почти физически ощутил его колебание между ними.

          — Можешь остаться здесь и отдохнуть, если хочешь, — наконец сказал Ариан.

          Под словами пряталась эмоция, которую Калеб не сумел разобрать: надежда? Беспокойство? Что-то вроде нежного раздражения?

          Калеб ненавидел эту неуверенность и нерешительность в его голосе, но так и не обернулся и ничем его не успокоил. Только кивнул. После нескольких тяжёлых секунд молчания раздался стук классических туфель Ариана, удалявшийся к двери. Калеб дождался, пока шаги стихнут в коридоре, затем вышел и перегнулся через балюстраду внутренней галереи.

          Внизу из коридора появился Ариан и остановился перед светловолосым мужчиной в свободной вышитой бежевой рубашке и кремовых льняных брюках. С высоты Калеб не мог разобрать выражение лица Ариана. Незнакомец подошёл ближе — гораздо ближе, чем было необходимо, — легко и почти игриво улыбаясь. Во время разговора он протянул между ними ладонь, затем пожал плечами и снова убрал руку в карман. Руки Ариана всё это время так и оставались в его собственных карманах.

          Калеб хотел слышать их разговор. Хотел, чтобы жгучая ревность в животе исчезла. Хотел спуститься и потребовать объяснить, кто этот мужчина для Ариана. И совсем уж глупо — хотел заявить на Ариана хоть какие-нибудь права и дать незнакомцу понять, что тот стоит слишком близко к человеку, который принадлежит ему.

          Калеб чувствовал себя одновременно дурно, эгоистично и виновато. Никаких прав у него не было, с брачным контрактом или без. То, что они переспали, ещё не означало, что они пара или что Калеб вправе что-то решать. Он знал: нарушение установленных ими правил будет иметь последствия. Знал: влюбиться в Ариана — значит всё усложнить.

          Сердцу было плевать.

          Винить Калеб мог только себя.

          Погрузившись в мысли, он не заметил, как Ариан и незнакомец ушли из сада. Лишь услышал шаги на лестнице за мгновение до того, как оба появились перед ним.

          Калеб быстро оценил язык их тел. Ариан был напряжён, словно наблюдал за двумя львами, которые кружат друг вокруг друга в ожидании неизбежного броска. Руки глубоко засунуты в карманы, плечи жёсткие, лицо — идеально нейтральная маска, совсем не похожая на открытую теплоту в постели несколько минут назад.

          Незнакомец держался подчеркнуто непринуждённо, но в этой лёгкости что-то было не так — почти нарочито. Будто он намеренно хотел казаться безопасным и расслабленным. Принц слишком хорошо знал маски придворных и политиков. Несмотря на небрежную манеру и растрёпанные светлые волны, этот человек выглядел *слишком* безупречно спокойным. В светлых глазах таилась тонкая полоска тьмы, и Калеб мгновенно его невзлюбил — без единой логичной, не связанной с ревностью причины, лишь по внутреннему чутью.

          Калеб заставил себя спрятать хмурое выражение под доспехами отточенной улыбки. В одном халате он внезапно почувствовал себя раздетым, но не собирался позволять незнакомцу увидеть, что его застали врасплох. Ариану незачем было беспокоиться о реакции Калеба: принц умел быть цивилизованным.

          — Новый знакомый? — спросил он.

          Несмотря на все усилия, тон и взгляд всё равно заострила тёмная заноза ревности.

          Светловолосый мужчина улыбнулся и протянул руку.

          — Люсьен Виндзор. Из тех Виндзоров, что занимаются судоходством. Полагаю, несколько лет назад мы встречались на приёме в Белом доме, Ваше Высочество.

          Улыбка Калеба стала натянутой; маска грозила сорваться. Он вынул одну руку из кармана халата и пожал ладонь Люсьена — почти слишком сильно. Калеб знал, что холодная тень уже затемнила ореховые глаза до шоколадно-коричневых, но едва удерживал образ невозмутимого аристократа и старался об этом не думать.

          — Очень приятно, — произнёс Калеб.

          Тон ясно говорил обратное. В голосе появился резкий аристократический растягивающий оттенок, который Калеб обычно приберегал для тех, кому удавалось по-настоящему вывести его из себя: братьев и сестёр, чрезмерно усердных дворян и придворных.

          Ариан перевёл взгляд с одного на другого, глубоко вдохнул и встретился глазами с Калебом. Если бы принц не знал его лучше, решил бы, что Ариан нервничает. Тот смотрел так, словно опасался, что Калеб вот-вот взорвётся.

          — Люсьен останется у нас на несколько дней.

          Калеб отпустил руку блондина и посмотрел на Ариана из-под ресниц. Белый жар ярости ударил насквозь, точно выстрел в упор. Вернуть улыбку никак не получалось, но он задавил эмоции, стараясь говорить спокойно и безразлично.

          — Как мило. Дом Конти, разумеется, *славится* своим гостеприимством.

          Калеб склонил голову набок и посмотрел Ариану прямо в глаза. Укол был несправедлив, он это понимал. За несколько недель в его доме Ариан был безупречным хозяином — если не считать редких, в основном заслуженных угроз. Калеб не помнил, чтобы прежде говорил с ним таким острым, обоюдоострым тоном, и гадал, какие выводы Ариан делает из этой тихой вспышки.

          — Простите, — вмешался Люсьен, пытаясь разрядить напряжение. — Мне нужно в уборную.

          — В конце коридора, — ответил Ариан.

          — Спасибо.

          Люсьен прошёл прямо между ними, словно не замечая ощутимого напряжения. Проходя мимо Калеба, он намеренно оказался непозволительно близко и не отвёл от принца взгляда, а затем двинулся дальше по коридору.

          Калеб моргнул и опустил глаза на отполированные чёрные туфли Ариана. Что с ним творится? У него не было причин так враждебно встречать гостя Ариана, кроме собственной ничем не подтверждённой интуиции.

          Ариан неровно выдохнул. Калеб повернулся, собираясь уйти, но руки Ариана мгновенно сомкнулись на его бицепсах.

          — Я могу всё объяснить.

          Голос был хриплым, почти умоляющим, и Калеба внезапно полоснуло раздражением.

          Ариан обращался с ним как с ребёнком. Тихий голос в голове тут же напомнил: тогда перестань вести себя как ребёнок.

          По губам Калеба скользнула холодная усмешка. Он повернулся обратно.

          — Не думаю, что ты обязан мне что-либо объяснять.

          Ариан не отступал. Слова посыпались быстрее, взгляд стал напряжённым. Калеб старательно не замечал промелькнувшей там боли.

          — Двадцать лет назад Люсьен спас мне жизнь.

          Калеб выдохнул через нос. Самоироничная улыбка сверкнула зубами на солнце. Он вёл себя нелепо. Люсьен очевидно был важен для Ариана, а Калеб — непривычно груб.

          — Надо же. Как трогательно.

          Теперь боль на лице Ариана была очевидна, и вина тяжело свернулась у Калеба в животе. Он чувствовал себя задницей.

          — Я искал его с тех пор. Никогда не мог отыскать след, а теперь он вдруг появляется из ниоткуда.

          Слова вошли в грудь Калеба ножом. Накануне, до всего случившегося, Ариан сказал, что больше никогда не увидит человека, которого любил. Теперь тревога Ариана обрела смысл. Он стоял здесь и почти умолял своего сомнительным образом выменянного фиктивного мужа понять: нашёлся человек, которого Ариан любил и искал двадцать лет.

          Калеб почувствовал себя дураком.

          Разумеется, Ариан не испытывал к нему того же. Разумеется, внутри Ариана ничего не ломалось от одной только *мысли* о том, что кто-то другой разделит его постель — и сердце.

          Когда Калебу было больно, он бил в ответ. А сейчас казалось, будто он сам раскалывается на части.

          — Значит, мужчины нравились тебе всегда.

          — Нет, — настойчиво ответил Ариан, убирая руки с плеч Калеба. — До тебя я никогда не прикасался к мужчине.

          Калеб видел правду в его глазах. На этот раз Ариан ничего не прятал, и Калеб не знал, что делать с такой обнажённой честностью.

          Она потрясла его, содрала кожу с и без того разбитых нервов.

          — Правда? — вопрос прозвучал слишком уязвимо. — Тогда кто мы друг другу?

          Калеб осмелился спросить, хотя ответ пугал до дрожи. В груди осторожно лизнула пламя надежды.

          Брови Ариана были напряжённо сведены над серо-зелёными глазами. В них стояло слишком много чувств, но он молчал. Рот открылся, закрылся — словно нужные слова никак не находились.

          Молчания оказалось достаточно.

          Маленькая надежда в улыбке Калеба погасла. Он фыркнул и отвернулся, желая уйти прежде, чем выставит себя ещё большим идиотом. Он не станет чьим-то вторым выбором, чего бы это ни стоило его сердцу.

          Калеб не остановился, пока не дошёл до своей комнаты. Горячие, унизительные слёзы жгли глаза.

          Он не будет плакать, приказал себе. Он, мать его, *принц*, а не какая-нибудь страдающая от любви девица.

          Калеб сорвал халат с плеч и широким шагом вошёл в огромную гардеробную гостевой комнаты. Ему нужны были доспехи. Нужны хоть какие-то привычность и контроль.

          Злость — в основном на самого себя — вспыхнула сильнее, когда он увидел костюмы и аксессуары, аккуратно разложенные по вешалкам и полкам после их похода по магазинам. Взгляд прошёлся по новым костюмам, и Калеб едва не сорвался. Он чувствовал себя капризным ребёнком, который ссорится с сёстрами из-за украденной игрушки.

          Ариан ему не принадлежал, напомнил Калеб себе, и прошёл мимо новых вещей к тем, в которых приехал.

          Одевшись, он почувствовал себя немного больше собой. Калеб решил поехать верхом, чтобы проветрить голову и попытаться снова затолкать Ариана в ту коробку, где прежде держал его запертым. Высокие коричневые кожаные сапоги до колена, облегающие молочно-белые брюки, бело-синяя клетчатая рубашка, узорчатый серый галстук и замшевый пиджак верблюжьего оттенка.

          В голове всё ещё бушевал вихрь, но отражение в зеркале, пока Калеб затягивал галстук у горла, не выдавало ничего.

          Если Ариан не мог решить, что между ними, Калеб решит за него.

          Он сохранит их соглашение и, когда потребуется, будет безупречным фиктивным мужем. Но за закрытыми дверями останется в стороне — холодным, отстранённым, невозмутимым, даже если это убьёт какую-то важную часть его самого.

          Вторым выбором он не станет.

          Лучше держаться в стороне и страдать в собственной груди, чем соглашаться быть запасным вариантом. Пусть это разобьёт сердце, расколет душу и погрузит мысли во тьму — Калеб выдержит, сколько бы ни было больно.

          Если Ариан не способен решить, кто они друг другу, Калеб должен защитить хотя бы те обломки себя, которые ещё можно спасти.
          EOF
      - name: Accept unit 11 translation and release claim
        shell: python
        run: |
          import os, sys
          from pathlib import Path
          sys.path.insert(0, str((Path('.workflow-engine') / 'scripts').resolve()))
          from workflow.claims import ClaimManager
          from workflow.filesystem import FilesystemStorage
          from workflow.repository import WorkflowStateRepository
          from workflow.schemas import SchemaKind
          from workflow.translations import TranslationAcceptanceManager
          book = Path('books/blood-and-honey-rbmk-caleb-pov').resolve()
          repo = WorkflowStateRepository(FilesystemStorage(book))
          reader = lambda p: (book / p).read_bytes()
          progress = repo.read('progress.json', SchemaKind.PROGRESS)
          metadata = repo.read('metadata.json', SchemaKind.METADATA).data
          session = f"gha-{os.environ['GITHUB_RUN_ID']}-translator-011"
          TranslationAcceptanceManager(repo, artifact_reader=reader).accept(
              progress.data, progress.version, metadata, 11, session_id=session)
          progress = repo.read('progress.json', SchemaKind.PROGRESS)
          ClaimManager(repo).release(progress.data, '11', session_id=session,
              detail='full literary translation from sealed source completed')
          final = repo.read('progress.json', SchemaKind.PROGRESS).data
          chapter = next(c for c in final['chapters'] if c['number'] == 11)
          if chapter['status'] != 'translated':
              raise RuntimeError('unit 11 was not accepted as translated')
      - name: Commit durable translation state
        run: |
          rm -rf .workflow-engine
          git config user.name "book-translator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add books/blood-and-honey-rbmk-caleb-pov
          git commit -m "Translate Blood and Honey chapter 9"
          git push
