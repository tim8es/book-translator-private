name: Finalize Alex Cole Russian translation

on:
  push:
    paths:
      - 'books/alex-cole-ten-commandments/.finalize/READY'

permissions:
  contents: write

jobs:
  finalize-book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify reviewer PASS boundary and finalize state
        shell: bash
        run: |
          set -euo pipefail
          BOOK='books/alex-cole-ten-commandments'
          CH5="$BOOK/translated/005-the-third-commandment-part-one.md"
          SOURCE="$BOOK/source/alex-cole-ten-commandments_414809252.epub"
          mkdir -p "$BOOK/output" "$BOOK/review"

          test "$(sha256sum "$CH5" | awk '{print $1}')" = '8003da381f845466f7c12b6d150410e9d15259dd223a5aa133fa5e37ef6ae57d'
          test "$(sha256sum "$SOURCE" | awk '{print $1}')" = 'fcfedf4a253a22df3c0baa767cbe5ccdb30916a5957515f4d68b5b5f0be590dc'

          python - <<'PY'
          import json, pathlib
          book = pathlib.Path('books/alex-cole-ten-commandments')
          progress_path = book / 'progress.json'
          progress = json.loads(progress_path.read_text(encoding='utf-8'))
          chapters = progress['chapters']
          assert len(chapters) == 5
          assert [c['status'] for c in chapters[:4]] == ['reviewed'] * 4
          assert chapters[4]['status'] == 'translated'
          assert chapters[4]['translation_path'] == 'translated/005-the-third-commandment-part-one.md'
          PY

          # Validation while chapter 5 is still translated, as required by the review/state boundary.
          python scripts/book.py validate alex-cole-ten-commandments
          python scripts/corpus.py verify alex-cole-ten-commandments

          cat > "$BOOK/review/005-the-third-commandment-part-one.md" <<'EOF'
          # Review: The Third Commandment | Part One

          Outcome: **PASS**

          - Workflow revision: `c72f9848d0a79c9ffb66cf7b1dc35905d21aecd9`
          - Source: `extracted/005-the-third-commandment-part-one.md`
          - Translation: `translated/005-the-third-commandment-part-one.md`
          - Reviewed translation SHA-256: `8003da381f845466f7c12b6d150410e9d15259dd223a5aa133fa5e37ef6ae57d`
          - Review method: independent sequential source-to-translation comparison under `docs/TRANSLATION.md`, followed by a correction pass and a fresh second review of the corrected canonical artifact.
          - Blocking findings after correction pass: none.
          - User-specific typography check: spoken Russian direct speech uses em dashes (`—`) rather than quotation marks.
          EOF

          python - <<'PY'
          import json, pathlib
          p = pathlib.Path('books/alex-cole-ten-commandments/progress.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          chapter = data['chapters'][4]
          assert chapter['number'] == 5 and chapter['status'] == 'translated'
          chapter['status'] = 'reviewed'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          cat > "$BOOK/MIGRATION.md" <<'EOF'
          # GitHub-first book state

          Migration to durable GitHub-first persistence is complete.

          - Canonical book workspace: `books/alex-cole-ten-commandments/` in `tim8es/book-translator-private`.
          - Canonical workflow revision: `c72f9848d0a79c9ffb66cf7b1dc35905d21aecd9` from `tim8es/book-translator`.
          - Exact preserved source: `source/alex-cole-ten-commandments_414809252.epub`.
          - Source EPUB SHA-256: `fcfedf4a253a22df3c0baa767cbe5ccdb30916a5957515f4d68b5b5f0be590dc`.
          - All five extracted source artifacts are sealed by `source-manifest.json` and pass corpus verification.
          - All five Russian chapter translations are present and reviewed.
          - Chapter 5 reviewer PASS is recorded under `review/`.
          - User-specific translation rule: Russian spoken direct speech is formatted with an em dash (`—`), not quotation marks.

          GitHub durable state is authoritative for future sessions; local session files are not book state.
          EOF

          # Validate the reviewed state before building.
          python scripts/book.py validate alex-cole-ten-commandments
          python scripts/corpus.py verify alex-cole-ten-commandments

          python scripts/book.py build alex-cole-ten-commandments

          python - <<'PY'
          import json, pathlib
          book = pathlib.Path('books/alex-cole-ten-commandments')
          progress = json.loads((book/'progress.json').read_text(encoding='utf-8'))
          assert all(c['status'] == 'reviewed' for c in progress['chapters'])
          outputs = sorted((book/'output').glob('*.md'))
          assert outputs, 'Markdown build produced no output'
          nonempty = [p for p in outputs if p.stat().st_size > 0]
          assert nonempty, 'Markdown output is empty'
          out = max(nonempty, key=lambda p: p.stat().st_size)
          text = out.read_text(encoding='utf-8')
          for c in progress['chapters']:
              chapter_text = (book/c['translation_path']).read_text(encoding='utf-8').strip()
              assert chapter_text in text, f"built output missing canonical chapter {c['number']}"
          print(f'FINAL_MARKDOWN={out}')
          print(f'FINAL_MARKDOWN_SIZE={out.stat().st_size}')
          PY

          rm -rf "$BOOK/.import" "$BOOK/.import2" "$BOOK/.ch5-import" "$BOOK/.finalize"

      - name: Commit reviewed book and final Markdown
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'book-translator-bot'
          git config user.email 'book-translator-bot@users.noreply.github.com'
          git add books/alex-cole-ten-commandments
          git commit -m 'book: complete reviewed Alex Cole Russian translation'
          git push
