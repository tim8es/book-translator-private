name: One-time canonical UNREVIEWED intake staging
on:
  push:
    branches: [migration/claiming-moon-omitted-heading-staging-20261022]
    paths: ['.github/workflows/stage-claiming-moon-intake-once.yml']
permissions:
  contents: write
concurrency:
  group: one-time-claiming-moon-omitted-heading
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate sealed original and canonical book state
        run: |
          set -Eeuo pipefail
          python scripts/book.py validate the-claiming-moon
          python scripts/corpus.py verify the-claiming-moon
      - name: Stage only verified historical unreviewed candidates
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/migrate_intake.py the-claiming-moon \
            --source books/the-claiming-moon/source/The_Claiming_Moon.epub \
            --chapter-offset 2 --stage > "$RUNNER_TEMP/intake-stage.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path(os.environ['RUNNER_TEMP'], 'intake-stage.json').read_text())
          print('Trusted source verified:', p['source_verified'])
          print('Ready candidates:', p['ready_candidates'])
          print('Staged total:', len(p['staged']))
          print('Reviewer promotions:', p['reviewed_promotions'])
          assert p['source_verified'] and p['reviewed_promotions'] == 0
          assert len(p['staged']) >= 39
          PY
      - name: Enforce only exactly nine expected new staging files
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import subprocess
          expected = {f'books/the-claiming-moon/migration-staging/{n+2:03d}-chapter-{n:03d}-UNREVIEWED.md' for n in range(31,40)}
          result = subprocess.run(['git','status','--porcelain','-z','--','books/the-claiming-moon/'],
                                  capture_output=True,check=True).stdout
          entries = [s.decode('utf-8','surrogateescape') for s in result.split(b'\0') if s]
          new = {e[3:] for e in entries if e.startswith('?? ')}
          assert len(entries) == 9 and new == expected, (len(entries),sorted(new),sorted(expected-new))
          print('Verified nine new unreviewed candidates:', *sorted(new),sep='\n')
          PY
      - name: Commit only nine staged candidate drafts on isolated branch
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- books/the-claiming-moon/migration-staging/
          git diff --cached --check
          git commit -m 'migration: stage nine complete draft candidates for chapters 31-39'
          git push origin HEAD:migration/claiming-moon-omitted-heading-staging-20261022
