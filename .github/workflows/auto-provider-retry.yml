name: Deferred book provider retry
run-name: Provider retry ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "32-character durable Auto job ID"
        type: string
        required: true
      retry_at:
        description: "Exact persisted provider_retry.not_before (UTC, ISO8601)"
        type: string
        required: true
      executor:
        description: "Verified executor that owns the deferred book job"
        type: choice
        required: true
        default: auto
        options: [auto, pi]

permissions:
  contents: read
  actions: write

# Duplicate workflow_run/cron/manual signals may never create concurrent
# provider calls for one book. The Auto process has its own per-book lock.
concurrency:
  group: book-provider-waiter-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read reviewed public Auto runtime SHA
        id: shared_auto
        shell: bash
        run: echo "sha=$(python automation/runtime_loader.py --print-revision)" >> "$GITHUB_OUTPUT"
      - name: Checkout immutable public shared engine
        uses: actions/checkout@v4
        with:
          repository: tim8es/book-translator
          ref: ${{ steps.shared_auto.outputs.sha }}
          path: .public-auto-runtime
          persist-credentials: false
      - name: Verify pinned runtime
        run: python automation/runtime_loader.py --verify

      - name: Check retry generation and book mode
        id: initial
        env:
          JOB_ID: ${{ inputs.job_id }}
          RETRY_AT: ${{ inputs.retry_at }}
          RETRY_EXECUTOR: ${{ inputs.executor || 'auto' }}
        shell: bash
        run: |
          set -euo pipefail
          state="$(python automation/book_runner.py --retry-status --job-id "$JOB_ID" --retry-at "$RETRY_AT" --retry-executor "$RETRY_EXECUTOR")"
          echo "eligible=$(jq -r '.eligible' <<< "$state")" >> "$GITHUB_OUTPUT"
          echo "wait_seconds=$(jq -r '.wait_seconds' <<< "$state")" >> "$GITHUB_OUTPUT"

      - name: Wait until the provider deadline outside book process lock
        if: steps.initial.outputs.eligible == 'true'
        env:
          WAIT_SECONDS: ${{ steps.initial.outputs.wait_seconds }}
        run: sleep "$WAIT_SECONDS"

      - name: Refresh current durable state
        if: steps.initial.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git checkout --force -B main origin/main

      - name: Recheck live retry generation and Auto ownership
        if: steps.initial.outputs.eligible == 'true'
        id: latest
        env:
          JOB_ID: ${{ inputs.job_id }}
          RETRY_AT: ${{ inputs.retry_at }}
          RETRY_EXECUTOR: ${{ inputs.executor || 'auto' }}
        shell: bash
        run: |
          set -euo pipefail
          # A reviewed runtime lock change invalidates the original checkout.
          # Fail closed instead of running a mismatched public engine.
          python automation/runtime_loader.py --verify
          state="$(python automation/book_runner.py --retry-status --job-id "$JOB_ID" --retry-at "$RETRY_AT" --retry-executor "$RETRY_EXECUTOR")"
          echo "eligible=$(jq -r '.eligible' <<< "$state")" >> "$GITHUB_OUTPUT"
          echo "wait_seconds=$(jq -r '.wait_seconds' <<< "$state")" >> "$GITHUB_OUTPUT"

      - name: Dispatch next bounded Auto checkpoint
        if: steps.latest.outputs.eligible == 'true' && steps.latest.outputs.wait_seconds == '0' && inputs.executor != 'pi'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run auto-translate.yml --ref main -f job_id="$JOB_ID"

      - name: Dispatch next bounded Pi checkpoint
        if: steps.latest.outputs.eligible == 'true' && steps.latest.outputs.wait_seconds == '0' && inputs.executor == 'pi'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ inputs.job_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run pi-book-translation.yml --ref main \
            -f probe_only=false -f job_id="$JOB_ID" -f continue_automatically=true
