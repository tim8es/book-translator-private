name: Correct and review Blood and Honey unit 9

on:
  push:
    paths:
      - '.github/workflows/blood-honey-review-unit-9.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed Chapter 7 corrections
        shell: python
        run: |
          from pathlib import Path
          p = Path('books/blood-and-honey-rbmk-caleb-pov/translated/009-chapter-7.md')
          text = p.read_text(encoding='utf-8')
          replacements = [
            ('Теперь, когда он знал вкус Ариана — насыщенный кофе и мягкий алкоголь, — Калеб понятия не имел, где именно они находятся друг для друга.', 'Теперь, когда он знал вкус Ариана — насыщенного кофе и мягкого спиртного, — Калеб понятия не имел, что теперь между ними.'),
            ('Калеб просто не представлял, как можно целовать кого-то *так*, с таким неприкрытым голодом и страстью, и ничего не чувствовать.', 'Калеб просто не представлял, как можно целовать кого-то *так*, с таким неприкрытым голодом и страстью, и не вкладывать в это ничего настоящего.'),
            ('Вы глубоко в шкафу, мистер Конти?', 'Вы что, из тех, кто очень глубоко сидит в шкафу, мистер Конти?'),
            ('— Начнём с десяти больших!', '— Начнём с десяти тысяч!'),
            ('— Двадцать больших — джентльмену впереди!', '— Двадцать тысяч — джентльмену впереди!'),
            ('Связанный, заставленный молчать, униженный и выставленный на продажу тому, кто заплатит больше.', 'Связанный, с заклеенным ртом, униженный и выставленный на продажу тому, кто заплатит больше.'),
            ('— Сто пятьдесят тысяч! Это просто не-*гре-бан-но*! — заорал ведущий, возвращая внимание Калеба.', '— Сто пятьдесят тысяч! Это просто, блядь, невероятно! — заорал ведущий, возвращая внимание Калеба.'),
            ('— Нет. У меня предложение лучше. Гораздо более убедительное и заманчивое.', '— Нет. У меня предложение лучше — зато куда более обнадёживающее и заманчивое.'),
            ('— Они решили, что могут дразнить тебя, унижать — и им ничего за это не будет.', '— Они решили, что могут издеваться над тобой, унижать — и им ничего за это не будет.'),
            ('Такой силы чувства он никогда не встречал.', 'Такого накала он ещё никогда не встречал.'),
            ('Калеб закончил бороться.', 'Калеб больше не хотел с этим бороться.'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'expected exactly one match, got {count}: {old}')
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
      - uses: actions/checkout@v4
        with:
          repository: tim8es/book-translator
          ref: a0c1a3c450a8251d2d90f4de5d5a988b5466958f
          path: .workflow-engine
      - name: Accept and review unit 9
        shell: python
        run: |
          import os, sys
          from pathlib import Path
          sys.path.insert(0, str((Path('.workflow-engine') / 'scripts').resolve()))
          from workflow.claims import ClaimManager
          from workflow.filesystem import FilesystemStorage
          from workflow.repository import WorkflowStateRepository
          from workflow.reviews import ReviewLedgerManager
          from workflow.schemas import SchemaKind
          from workflow.translations import TranslationAcceptanceManager

          book = Path('books/blood-and-honey-rbmk-caleb-pov').resolve()
          repository = WorkflowStateRepository(FilesystemStorage(book))
          claims = ClaimManager(repository)
          reader = lambda p: (book / p).read_bytes()
          translations = TranslationAcceptanceManager(repository, artifact_reader=reader)
          reviews = ReviewLedgerManager(repository, artifact_reader=reader)
          metadata = repository.read('metadata.json', SchemaKind.METADATA).data
          workflow_revision = metadata['workflow']['resolved_revision']
          base_commit = os.environ['GITHUB_SHA']
          run_id = os.environ['GITHUB_RUN_ID']
          number = 9

          progress = repository.read('progress.json', SchemaKind.PROGRESS)
          chapter = next(c for c in progress.data['chapters'] if c['number'] == number)
          if chapter['status'] == 'extracted':
              translator_session = f'gha-{run_id}-translator-{number:03d}'
              claims.acquire(progress.data, str(number), role='translator', session_id=translator_session,
                             base_revision=progress.version, base_commit=base_commit,
                             workflow_revision=workflow_revision)
              translations.accept(progress.data, progress.version, metadata, number,
                                  session_id=translator_session)
              progress = repository.read('progress.json', SchemaKind.PROGRESS)
              claims.release(progress.data, str(number), session_id=translator_session,
                             detail='corrected translation accepted after full source comparison')

          progress = repository.read('progress.json', SchemaKind.PROGRESS)
          chapter = next(c for c in progress.data['chapters'] if c['number'] == number)
          if chapter['status'] == 'translated':
              reviewer_session = f'gha-{run_id}-reviewer-{number:03d}'
              claims.acquire(progress.data, str(number), role='reviewer', session_id=reviewer_session,
                             base_revision=progress.version, base_commit=base_commit,
                             workflow_revision=workflow_revision)
              reviews.record(progress.data, progress.version, metadata, number, outcome='PASS',
                             reviewer_session_id=reviewer_session, review_commit=None)
              claims.release(progress.data, str(number), session_id=reviewer_session,
                             detail='independent full source-comparison review PASS')
              progress = repository.read('progress.json', SchemaKind.PROGRESS)
              reviews.accept_review(progress.data, progress.version, metadata, number)

          final = repository.read('progress.json', SchemaKind.PROGRESS).data
          chapter = next(c for c in final['chapters'] if c['number'] == number)
          if chapter['status'] != 'reviewed':
              raise RuntimeError('unit 9 was not promoted to reviewed')
      - name: Commit durable state
        run: |
          rm -rf .workflow-engine
          git config user.name "book-translator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add books/blood-and-honey-rbmk-caleb-pov
          git commit -m "Correct and review Blood and Honey chapter 7"
          git push
