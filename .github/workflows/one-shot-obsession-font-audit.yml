name: Obsession Cyrillic font coverage audit (one-shot)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-obsession-font-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Inspect embedded source fonts for Cyrillic glyphs
        shell: bash
        run: |
          python -m pip -q install fonttools
          python - <<'PY'
          from fontTools.ttLib import TTFont
          from io import BytesIO
          import zipfile,json
          from pathlib import Path
          path=Path('books/obsession-eva-marks/source/Obsession_Eva_Marks.epub')
          with zipfile.ZipFile(path) as z:
              for member in [n for n in z.namelist() if n.lower().endswith('.ttf')]:
                  f=TTFont(BytesIO(z.read(member)))
                  cmap=f.getBestCmap() or {}
                  markers={'А':0x410,'а':0x430,'Ё':0x401,'ё':0x451,'я':0x44f,'Д':0x414,'т':0x442}
                  coverage={k:v in cmap for k,v in markers.items()}
                  print('FONT',member,'SIZE',z.getinfo(member).file_size,'CYRILLIC',json.dumps(coverage,ensure_ascii=False),'CYRILLIC_GLYPHS',sum(0x0400<=i<=0x04ff for i in cmap))
          PY
