name: Claiming Moon summary bounded source-comparison Reviewer
on:
  push:
    branches: [review/claiming-moon-summary-source-fidelity-20261022]
    paths: [.github/workflows/claiming-moon-summary-review.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate exact independently compared summary, record PASS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path

          SLUG = "the-claiming-moon"
          ROOT = Path("books") / SLUG
          SOURCE_SHA = "9346c003fc062b18b487e54e72d1edba3a9a2ce138ba5b0cd2b16a692cd6295c"
          TRANSLATION_SHA = "435605f1313c8130de46aa1b3e84a728d20b7b1de3e4b5806bb03d7731f06e4c"
          REV = "5e0731da8b7ca81ada5316ed536a8a954008b789"
          def run(*args):
              subprocess.run(list(map(str, args)), check=True)
          def out(*args):
              return subprocess.check_output(list(map(str, args)), text=True).strip()
          def digest(data):
              return hashlib.sha256(data).hexdigest()

          meta = json.loads((ROOT / "metadata.json").read_text(encoding="utf-8"))
          assert meta["workflow"]["resolved_revision"] == REV
          run("python", "scripts/book.py", "validate", SLUG)
          run("python", "scripts/corpus.py", "verify", SLUG)
          prog = json.loads((ROOT / "progress.json").read_text(encoding="utf-8"))
          unit = prog["chapters"][1]
          assert unit["unit_id"] == "chapter-000002" and unit["status"] == "translated"
          source = ROOT / unit["source_path"]
          translation = ROOT / unit["translation_path"]
          assert digest(source.read_bytes()) == SOURCE_SHA == unit["translation_acceptance"]["source_sha256"]
          assert digest(translation.read_bytes()) == TRANSLATION_SHA == unit["translation_acceptance"]["translation_sha256"]
          text = source.read_text(encoding="utf-8")
          target = translation.read_text(encoding="utf-8")
          # Reviewer's literary comparison of the entire short source unit and
          # corrected target was completed in a separate bounded context.
          # These are deterministic guard checks, not a substitute for that review.
          checks = (
              ("The Claiming Moon", "Луна присвоения"),
              ("Kooktaexd", "Kooktaexd"),
              ("Bangtan Boys", "Bangtan Boys"),
              ("Stay hidden, pup", "Не высовывайся, волчонок"),
              ("Jungkook growls", "рычит Чонгук"),
              ("Taehyung’s breath hitches", "У Тэхёна перехватывает дыхание"),
              ("Y-you wouldn’t", "Т-ты не посмеешь"),
              ("Try me", "Проверь"),
              ("Every year, omegas run", "Каждый год омеги убегают"),
              ("Every year, alphas hunt", "Каждый год альфы охотятся"),
              ("For six years", "Шесть лет"),
              ("scent blockers", "средства, блокировавшие запах"),
              ("Jeon Jungkook", "Чон Чонгук"),
              ("new pack leader", "новый вожак стаи"),
              ("obsessed and unrelenting", "одержимый и неумолимый"),
              ("mated and knotted", "сцепляется с альфой узлом во время спаривания"),
              ("in front of the pack", "на глазах у всей стаи"),
              ("No non con", "Никакого секса без согласия"),
              ("greenest flag", "зелёный флаг")
          )
          for original, russian in checks:
              assert original in text and russian in target, f"review comparison anchor absent: {original}"
          assert not json.loads(out("python", "scripts/book.py", "claims", SLUG, "--json")).get("claims")
          ledger_before = json.loads((ROOT / "review-ledger.json").read_text(encoding="utf-8"))
          assert not any(record["unit_id"] == "chapter-000002" for record in ledger_before["records"])

          session = "claiming-moon-summary-bounded-reviewer-20261022"
          run("python", "scripts/book.py", "claim", SLUG, 2, "--role", "reviewer", "--session-id", session)
          run("python", "scripts/book.py", "review-record", SLUG, 2, "--outcome", "PASS", "--session-id", session)
          run("python", "scripts/book.py", "accept-review", SLUG, 2)
          run("python", "scripts/book.py", "release", SLUG, 2, "--session-id", session)
          run("python", "scripts/book.py", "validate", SLUG)
          run("python", "scripts/corpus.py", "verify", SLUG)

          ledger_after = json.loads((ROOT / "review-ledger.json").read_text(encoding="utf-8"))
          records = [r for r in ledger_after["records"] if r["unit_id"] == "chapter-000002"]
          assert len(records) == 1 and records[0]["outcome"] == "PASS"
          assert records[0]["source_sha256"] == SOURCE_SHA
          assert records[0]["translation_sha256"] == TRANSLATION_SHA
          assert records[0]["workflow_revision"] == REV
          progress_after = json.loads((ROOT / "progress.json").read_text(encoding="utf-8"))
          assert progress_after["chapters"][1]["status"] == "reviewed"
          counts = {s: sum(c["status"] == s for c in progress_after["chapters"]) for s in ("extracted", "translated", "reviewed")}
          assert counts == {"extracted": 5, "translated": 41, "reviewed": 2}, counts
          report = {
              "schema_version": 1,
              "book": SLUG,
              "unit_id": "chapter-000002",
              "source_sha256": SOURCE_SHA,
              "translation_sha256": TRANSLATION_SHA,
              "workflow_revision": REV,
              "review_mode": "single_agent_bounded_context",
              "scope": "Full original summary (title, fandom/byline, dialogue, pitch, mating/knotted semantics, and content note)",
              "findings_corrected_before_review": [
                  "Original fandom header restored",
                  "Literal rope-knot ambiguity replaced with explicit mating/knot context"
              ],
              "full_source_comparison": "performed on short summary unit",
              "review_outcome": "PASS",
              "lifecycle_after": "reviewed",
              "book_counts_after": counts,
              "note": "Reviewer claim/evidence is bound to the exact current source, translation and pinned workflow revisions."
          }
          output = Path("docs/migrations/claiming-moon-summary-reviewed.json")
          output.write_text(json.dumps(report, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print("REVIEW_PASS", json.dumps(counts, sort_keys=True))
          PY
      - name: Commit exact review evidence and delete one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/claiming-moon-summary-review.yml
          git add -A books/the-claiming-moon/progress.json books/the-claiming-moon/review-ledger.json books/the-claiming-moon/.workflow docs/migrations/claiming-moon-summary-reviewed.json
          git commit -m "Record hash-bound PASS review of corrected Claiming Moon summary"
          git push origin HEAD:refs/heads/review/claiming-moon-summary-source-fidelity-20261022
