name: Canonical source edition ChatOps
on:
  push:
    branches: [main]
    paths:
      - 'books/*/.workflow/source-update-request.json'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.scope.outputs.slug }}
      pin: ${{ steps.scope.outputs.pin }}
      action: ${{ steps.scope.outputs.action }}
      source_path: ${{ steps.scope.outputs.source_path }}
      revision: ${{ steps.scope.outputs.revision }}
      allow_deletions: ${{ steps.scope.outputs.allow_deletions }}
      old_commit: ${{ steps.scope.outputs.old_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          before, after = os.environ["BEFORE"], os.environ["AFTER"]
          changed = subprocess.check_output(["git","diff","--name-only",before,after], text=True).splitlines()
          matches = [p for p in changed if re.fullmatch(r"books/[a-z0-9-]+/\.workflow/source-update-request\.json", p)]
          if len(matches) != 1:
              raise SystemExit("Exactly one source update request must change")
          request_path = pathlib.Path(matches[0]); slug = request_path.parts[1]
          request = json.loads(request_path.read_text("utf-8"))
          book = pathlib.Path("books") / slug
          metadata = json.loads((book / "metadata.json").read_text("utf-8"))
          pin = metadata["workflow"]["resolved_revision"]
          assert re.fullmatch(r"[a-f0-9]{40}", pin)
          assert request.get("schema_version") == 1 and request.get("book_slug") == slug
          assert request.get("workflow_revision") == pin
          assert request.get("expected_active_revision") == metadata["source"]["revision_id"]
          action = request.get("action")
          assert action in ("stage", "promote", "discard", "admit")
          source_path = ""
          revision = ""
          allow_deletions = "false"
          old_commit = ""
          if action == "stage":
              source_path = request["source_path"]
              assert source_path.startswith(f"books/{slug}/source-updates/") and source_path.endswith((".html",".epub"))
              assert ".." not in pathlib.PurePosixPath(source_path).parts
              source = pathlib.Path(source_path)
              assert source.is_file() and not source.is_symlink()
              assert hashlib.sha256(source.read_bytes()).hexdigest() == request["source_sha256"]
          else:
              revision = request["source_revision"]
              assert re.fullmatch(r"source-[0-9]{6}", revision)
              allow_deletions = "true" if request.get("allow_deletions",False) is True else "false"
              if action == "admit":
                  assert revision == metadata["source"]["revision_id"]
                  old_commit = request["previous_progress_commit"]
                  assert re.fullmatch(r"[a-f0-9]{40}",old_commit)
                  assert isinstance(request.get("translation_overrides"),dict)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              for k,v in (("slug",slug),("pin",pin),("action",action),("source_path",source_path),("revision",revision),("allow_deletions",allow_deletions),("old_commit",old_commit)):
                  f.write(f"{k}={v}\n")
          PY
  execute:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: book-operation-${{ needs.prepare.outputs.slug }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: tim8es/book-translator
          ref: ${{ needs.prepare.outputs.pin }}
          path: .pinned-book-translator
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tim8es/book-translator
          ref: ffcc39c1977cd36107510953ad6c689dabd10ab0
          path: .public-auto-runtime
          persist-credentials: false
      - name: Execute exact pinned canonical source edition command
        shell: bash
        env:
          BOOK_SLUG: ${{ needs.prepare.outputs.slug }}
          PIN: ${{ needs.prepare.outputs.pin }}
          ACTION: ${{ needs.prepare.outputs.action }}
          SOURCE_PATH: ${{ needs.prepare.outputs.source_path }}
          REVISION: ${{ needs.prepare.outputs.revision }}
          ALLOW_DELETIONS: ${{ needs.prepare.outputs.allow_deletions }}
          OLD_COMMIT: ${{ needs.prepare.outputs.old_commit }}
        run: |
          set -euo pipefail
          test "$(git -C .pinned-book-translator rev-parse HEAD)" = "$PIN"
          cli=(python .public-auto-runtime/scripts/pinned_cli.py --engine .pinned-book-translator --state . --revision "$PIN" book)
          "${cli[@]}" validate "$BOOK_SLUG"
          python .public-auto-runtime/scripts/pinned_cli.py --engine .pinned-book-translator --state . --revision "$PIN" corpus verify "$BOOK_SLUG"
          if [[ "$ACTION" == "stage" ]]; then
            "${cli[@]}" update-source "$BOOK_SLUG" "$SOURCE_PATH" --stage-only --json | tee "$RUNNER_TEMP/source-update-result.json"
          elif [[ "$ACTION" == "promote" ]]; then
            args=(promote-source-update "$BOOK_SLUG" "$REVISION" --json)
            if [[ "$ALLOW_DELETIONS" == "true" ]]; then args+=(--allow-deletions); fi
            "${cli[@]}" "${args[@]}" | tee "$RUNNER_TEMP/source-update-result.json"
          elif [[ "$ACTION" == "discard" ]]; then
            "${cli[@]}" discard-source-update "$BOOK_SLUG" "$REVISION" --json | tee "$RUNNER_TEMP/source-update-result.json"

          elif [[ "$ACTION" == "admit" ]]; then
            python - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          slug=os.environ["BOOK_SLUG"]
          book=pathlib.Path("books")/slug
          pin=os.environ["PIN"]
          request=json.loads((book/".workflow"/"source-update-request.json").read_text("utf8"))
          old_commit=os.environ["OLD_COMMIT"]
          assert request["source_revision"]==os.environ["REVISION"]
          assert request["previous_progress_commit"]==old_commit
          current=json.loads((book/"progress.json").read_text("utf8"))
          previous=json.loads(subprocess.check_output(
              ["git","show",f"{old_commit}:books/{slug}/progress.json"],text=True))
          old_meta=json.loads(subprocess.check_output(
              ["git","show",f"{old_commit}:books/{slug}/metadata.json"],text=True))
          assert old_meta["source"]["revision_id"]==request["previous_source_revision"]
          assert old_meta["workflow"]["resolved_revision"]==pin
          old={u["unit_id"]:u for u in previous["chapters"]}
          overrides=request["translation_overrides"]
          def sha(b):return hashlib.sha256(b).hexdigest()
          def toks(s):
              s=re.sub(r"<!--.*?-->","",s,flags=re.S)
              return re.findall(r"[a-z]+",s.lower())
          def shingles(tokens):
              return set(tuple(tokens[i:i+5]) for i in range(max(0,len(tokens)-4)))
          work=[]
          for unit in current["chapters"]:
              if unit["status"]!="extracted":continue
              uid=unit["unit_id"];number=unit["number"]
              if uid in old:
                  previous_unit=old[uid]
                  evidence=previous_unit.get("translation_acceptance")
                  assert previous_unit["status"] in ("translated","reviewed") and evidence,uid
                  old_src=(book/previous_unit["source_path"]).read_bytes()
                  old_ru=(book/previous_unit["translation_path"]).read_bytes()
                  assert sha(old_src)==evidence["source_sha256"],uid
                  assert sha(old_ru)==evidence["translation_sha256"],uid
                  # Chapter prose must have near-identical five-token sequences.
                  if unit["title"].startswith("Chapter "):
                      new_src=(book/unit["source_path"]).read_text("utf8")
                      a=shingles(toks(new_src));b=shingles(toks(old_src.decode("utf8")))
                      ratio=len(a.intersection(b))/max(1,len(a))
                      assert ratio>=0.995,(uid,ratio)
                  content=old_ru
              else:
                  assert unit["title"]=="Chapter 12",("unexpected new unit",uid)
                  content=None
              if uid in overrides:
                  rel=overrides[uid]
                  assert isinstance(rel,str) and rel.startswith(
                      f"books/{slug}/source-updates/") and "/translated/" in rel
                  assert ".." not in pathlib.PurePosixPath(rel).parts
                  doc=pathlib.Path(rel)
                  assert doc.is_file() and not doc.is_symlink()
                  content=doc.read_bytes()
              assert content and content.strip(),uid
              destination=book/unit["translation_path"]
              assert not destination.exists() and not destination.is_symlink(),uid
              work.append((number,uid,destination,content))
          assert len(work)>=1
          cli=["python",".public-auto-runtime/scripts/pinned_cli.py",
               "--engine",".pinned-book-translator","--state",".",
               "--revision",pin,"book"]
          def command(*args):
              return subprocess.run(cli+list(map(str,args)),check=True,
                                    capture_output=True,text=True).stdout
          accepted=[]
          for num,uid,dest,content in work:
              sid="chatops-reuse-"+os.environ["REVISION"]+"-"+str(num)
              print(f"Claiming and accepting {uid}",flush=True)
              command("claim",slug,num,"--role","translator","--session-id",sid,"--json")
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(content)
              result=json.loads(command("accept-translation",slug,num,
                                        "--session-id",sid,"--json"))
              assert result["unit_id"]==uid and result["status"]=="translated",(uid,result)
              command("release",slug,num,"--session-id",sid,"--json")
              accepted.append({"number":num,"unit_id":uid,"translation_sha256":sha(content)})
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"source-update-result.json"
          out.write_text(json.dumps({"state":"translations_accepted",
                                     "revision_id":os.environ["REVISION"],
                                     "units":accepted},ensure_ascii=False)+"\n",encoding="utf8")
          print(json.dumps({"accepted_count":len(accepted)},ensure_ascii=False))
          PY
          fi
          "${cli[@]}" validate "$BOOK_SLUG"
          python .public-auto-runtime/scripts/pinned_cli.py --engine .pinned-book-translator --state . --revision "$PIN" corpus verify "$BOOK_SLUG"
          python - <<'PY'
          import json, os, pathlib
          slug = os.environ["BOOK_SLUG"]
          dest = pathlib.Path("books")/slug/".workflow"/"source-update-result.json"
          result=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"source-update-result.json").read_text("utf-8"))
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_text(json.dumps({"schema_version":1,"action":os.environ["ACTION"],"result":result},ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          git add -A -- "books/$BOOK_SLUG"
          if git diff --cached --quiet; then echo 'No durable changes'; exit 0; fi
          git fetch --quiet origin main
          if ! git diff --quiet HEAD origin/main -- "books/$BOOK_SLUG"; then
            echo "::error::Book state changed concurrently; refusing stale source update"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "source-update($BOOK_SLUG): $ACTION pinned source edition"
          git rebase origin/main
          git push origin HEAD:main
