name: One-time Claiming Moon source-bound draft audit

on:
  push:
    branches:
      - migration/claiming-moon-source-bound-draft-audit-20261021
    paths:
      - .github/workflows/audit-claiming-moon.yml

permissions:
  contents: write

jobs:
  audit:
    if: github.repository == 'tim8es/book-translator-private'
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Source preflight and stage recoverable unreviewed candidates
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            '611d1717e7997955619576a667073b79b815bf7606c6ea4513c823b01c53c9bb' \
            'books/the-claiming-moon/source/The_Claiming_Moon.epub' | sha256sum -c -
          python scripts/book.py validate the-claiming-moon
          python scripts/corpus.py verify the-claiming-moon
          mkdir -p docs/migrations
          python scripts/migrate_intake.py the-claiming-moon \
            --source books/the-claiming-moon/source/The_Claiming_Moon.epub \
            --chapter-offset 2 --stage \
            > docs/migrations/the-claiming-moon-source-bound-reconciliation.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("docs/migrations/the-claiming-moon-source-bound-reconciliation.json")
          audit = json.loads(p.read_text(encoding="utf-8"))
          assert audit["source_verified"] is True
          assert audit["missing_canonical_files"] == []
          assert audit["blockers"] == []
          assert audit["reviewed_promotions"] == 0
          assert all(x["status"] in {"candidate_unreviewed", "needs_reconciliation"} for x in audit["chapters"])
          counts = {}
          for unit in audit["chapters"]:
              counts[unit["status"]] = counts.get(unit["status"], 0) + 1
          print("Source-verified draft audit:", counts)
          print("Stage candidates:", len(audit.get("staged", [])))
          PY
          test -z "$(git status --porcelain -- books/the-claiming-moon/incoming)"
          test -z "$(git status --porcelain -- books/the-claiming-moon/progress.json books/the-claiming-moon/review-ledger.json books/the-claiming-moon/translated)"
      - name: Commit audited candidates and self-remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/audit-claiming-moon.yml
          git add -A -- docs/migrations/the-claiming-moon-source-bound-reconciliation.json \
            books/the-claiming-moon/migration-staging .github/workflows/audit-claiming-moon.yml
          if git diff --cached --name-only | grep -E '^books/the-claiming-moon/(incoming|translated|source|extracted|source-revisions)/'; then
            echo "Unexpected mutation of source or translation files" >&2
            exit 1
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore(book): stage verified unreviewed translation candidates'
          git push origin "HEAD:${GITHUB_REF_NAME}"
