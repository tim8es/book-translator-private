name: One-time Claiming Moon chapters 1-4 canonical admission
on:
  push:
    branches: [migration/claiming-moon-admit-01-04-20261022]
    paths: [.github/workflows/one-time-claiming-moon-admit-01-04.yml]
permissions:
  contents: write
concurrency:
  group: claiming-moon-admit-01-04
  cancel-in-progress: false
jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Preflight exact source, indexed unit state and immutable historical drafts
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/book.py validate the-claiming-moon
          python scripts/corpus.py verify the-claiming-moon
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          book = Path("books/the-claiming-moon")
          source = book / "source/The_Claiming_Moon.epub"
          expected_source = "611d1717e7997955619576a667073b79b815bf7606c6ea4513c823b01c53c9bb"
          if hashlib.sha256(source.read_bytes()).hexdigest() != expected_source:
              raise SystemExit("Trusted original EPUB has changed")
          progress = json.loads((book / "progress.json").read_text(encoding="utf-8"))
          manifest = json.loads((book / "source-manifest.json").read_text(encoding="utf-8"))
          if len(progress["chapters"]) != 48:
              raise SystemExit("Unexpected canonical source unit count")
          allowed_stage_git_sha = {
              1: "7dc1529aab6b86c4ecba2cdf9c51e8fbec2da5e4",
              2: "8026bed3661563d665eb0faeaa0dd5d94ceebdbe",
              3: "0d14854c4e0a6e249c7e76cfe68bc9aa9169fceb",
              4: "4facf78dc2b46dbd58dd36dc4a98895bd2405290",
          }
          plan = []
          for chapter, git_sha in allowed_stage_git_sha.items():
              unit = chapter + 2
              row = progress["chapters"][unit - 1]
              if (row["unit_id"], row["number"], row["status"]) != (
                  f"chapter-{unit:06d}", unit, "extracted"
              ):
                  raise SystemExit(f"Unit {unit} is no longer unaccepted")
              if "translation_acceptance" in row:
                  raise SystemExit("Existing acceptance must never be overwritten")
              target = book / row["translation_path"]
              if target.exists():
                  raise SystemExit(f"Target translation already exists: {target}")
              stage = book / "migration-staging" / f"{unit:03d}-chapter-{chapter:03d}-UNREVIEWED.md"
              old = book / "incoming" / f"chapter-{chapter:03d}-ru-draft.md"
              if not stage.is_file() or not old.is_file() or stage.read_bytes() != old.read_bytes():
                  raise SystemExit(f"Historical draft bytes differ: chapter {chapter}")
              found = subprocess.check_output(
                  ["git", "hash-object", str(stage)], text=True
              ).strip()
              if found != git_sha:
                  raise SystemExit(f"Staged candidate SHA changed for chapter {chapter}")
              content = stage.read_text(encoding="utf-8")
              if len(content) < 30000 or "Глава" not in content[:1200]:
                  raise SystemExit(f"Unexpected truncated or unidentified draft {chapter}")
              if sum("\u0400" <= char <= "\u04FF" for char in content) < 10000:
                  raise SystemExit(f"Insufficient Russian draft text for chapter {chapter}")
              original = book / row["source_path"]
              seal = next(x for x in manifest["extracted"] if x["number"] == unit)
              if hashlib.sha256(original.read_bytes()).hexdigest() != seal["sha256"]:
                  raise SystemExit(f"Chapter {chapter}: extracted original diverged from manifest")
              plan.append({
                  "chapter": chapter,
                  "unit": unit,
                  "source_path": row["source_path"],
                  "source_sha256": seal["sha256"],
                  "staged_path": stage.relative_to(book).as_posix(),
                  "incoming_path": old.relative_to(book).as_posix(),
                  "draft_git_sha": git_sha,
                  "target_path": row["translation_path"],
                  "translation_sha256": hashlib.sha256(stage.read_bytes()).hexdigest(),
                  "status": "TRANSLATED_PENDING_INDEPENDENT_REVIEW",
                  "note": "Machine acceptance authenticates bytes, not semantic completeness or Reviewer PASS",
              })
          if [item["unit"] for item in plan] != [3, 4, 5, 6]:
              raise SystemExit("Unexpected canonical unit plan")
          Path(".github/claiming-moon-01-04-plan.json").write_text(
              json.dumps(plan, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          print("Four immutable draft candidates verified; no review outcome asserted")
          PY
      - name: Create actual Translator claims and accept exact draft bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          book = Path("books/the-claiming-moon")
          plan = json.loads(Path(".github/claiming-moon-01-04-plan.json").read_text(encoding="utf-8"))
          for item in plan:
              unit = item["unit"]
              session = f"claiming-moon-historical-draft-import-{unit}-20261022"
              def cli(*args):
                  subprocess.run(["python", "scripts/book.py", *map(str, args)], check=True)
              cli("claim", "the-claiming-moon", unit, "--role", "translator", "--session-id", session)
              data = (book / item["staged_path"]).read_bytes()
              target = book / item["target_path"]
              target.parent.mkdir(parents=True, exist_ok=True)
              with target.open("xb") as output:
                  output.write(data)
              if hashlib.sha256(target.read_bytes()).hexdigest() != item["translation_sha256"]:
                  raise SystemExit("Target bytes mutated before acceptance")
              cli("accept-translation", "the-claiming-moon", unit, "--session-id", session, "--json")
              cli("release", "the-claiming-moon", unit, "--session-id", session)
          PY
      - name: Validate hash-bound canonical acceptance and preserve independent review
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/book.py validate the-claiming-moon
          python scripts/corpus.py verify the-claiming-moon
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          book = Path("books/the-claiming-moon")
          plan = json.loads(Path(".github/claiming-moon-01-04-plan.json").read_text(encoding="utf-8"))
          progress = json.loads((book / "progress.json").read_text(encoding="utf-8"))
          ledger = json.loads((book / "review-ledger.json").read_text(encoding="utf-8"))
          for item in plan:
              row = progress["chapters"][item["unit"] - 1]
              if row["status"] != "translated":
                  raise SystemExit("Unit did not advance to translated")
              if row["translation_acceptance"]["unit_id"] != row["unit_id"]:
                  raise SystemExit("Wrong machine acceptance unit")
              if hashlib.sha256((book / row["translation_path"]).read_bytes()).hexdigest() != item["translation_sha256"]:
                  raise SystemExit("Canonical accepted translation file changed")
          if not any(r["unit_id"] == "chapter-000048" and r["outcome"] == "PASS"
                     for r in ledger["records"]):
              raise SystemExit("Existing legitimate Reviewer PASS lost")
          print("Four chapters accepted as translated only; Reviewer PASS remains outstanding")
          PY
          test -z "$(git diff --name-only HEAD -- books/the-claiming-moon/incoming books/the-claiming-moon/migration-staging books/the-claiming-moon/extracted books/the-claiming-moon/source books/the-claiming-moon/source-revisions books/the-claiming-moon/source-manifest.json books/the-claiming-moon/review-ledger.json)"
      - name: Commit imported chapter state and remove one-off Action
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p docs/migrations
          cp .github/claiming-moon-01-04-plan.json docs/migrations/claiming-moon-01-04-machine-acceptance.json
          git add -- books/the-claiming-moon/translated books/the-claiming-moon/progress.json books/the-claiming-moon/.workflow docs/migrations/claiming-moon-01-04-machine-acceptance.json
          git rm -- .github/workflows/one-time-claiming-moon-admit-01-04.yml
          git diff --cached --name-status
          git commit -m 'migration: claim and accept historical chapters 1–4 as translated'
          git push origin HEAD:migration/claiming-moon-admit-01-04-20261022
