name: One-time Claiming Moon chapter 40 consolidated draft admission
on:
  push:
    branches:
      - migration/claiming-moon-accept-ch40-consolidated-20261022
    paths:
      - .github/workflows/one-time-claiming-moon-admit-ch40.yml
permissions:
  contents: write
jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify correct consolidated draft from exact original
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/book.py validate the-claiming-moon
          python scripts/corpus.py verify the-claiming-moon
          python - <<'PY'
          import hashlib,json,re,zipfile,xml.etree.ElementTree as ET
          from pathlib import Path,PurePosixPath

          book=Path("books/the-claiming-moon")
          source_hash="611d1717e7997955619576a667073b79b815bf7606c6ea4513c823b01c53c9bb"
          original=book/"source/The_Claiming_Moon.epub"
          if hashlib.sha256(original.read_bytes()).hexdigest()!=source_hash:
              raise SystemExit("Original EPUB identity mismatch")
          progress=json.loads((book/"progress.json").read_text(encoding="utf-8"))
          unit=42
          row=progress["chapters"][unit-1]
          if (row["unit_id"],row["number"],row["status"])!=("chapter-000042",42,"extracted") or "translation_acceptance" in row:
              raise SystemExit("Refusing to overwrite a canonical acceptance")
          target=book/row["translation_path"]
          if target.exists():
              raise SystemExit("Existing canonical translation file is protected")
          ref=json.loads(Path("docs/migrations/the-claiming-moon-source-reference.json").read_text(encoding="utf-8"))
          original_ch=ref["spine"][unit-1]
          if original_ch["basename"]!="The_Claiming_Moon_split_041.xhtml" or original_ch["nonempty_blocks"]!=416:
              raise SystemExit("Wrong source index or original edition")
          with zipfile.ZipFile(original) as source:
              matching=[p for p in source.namelist() if PurePosixPath(p).name==original_ch["basename"]]
              if len(matching)!=1:
                  raise SystemExit("Ambiguous original XHTML")
              xhtml=source.read(matching[0])
              if hashlib.sha256(xhtml).hexdigest()!=original_ch["sha256"]:
                  raise SystemExit("Original chapter digest mismatch")
              tree=ET.fromstring(xhtml)
              blocks=[node for node in tree.iter() if node.tag.split("}")[-1] in {"h1","h2","h3","h4","p"}]
              nonempty=[node for node in blocks if "".join(node.itertext()).strip()]
              if (len(blocks),len(nonempty))!=(418,416):
                  raise SystemExit("Source blocks mismatch")
          incoming=book/"incoming/chapter-040-ru-full-draft.md"
          raw=incoming.read_text(encoding="utf-8")
          if source_hash not in raw or original_ch["sha256"] not in raw:
              raise SystemExit("Consolidated draft does not bind original source")
          markers=list(re.finditer(r"<!--\s*source-block\s+(\d+)\s*-->",raw))
          indices=[int(m.group(1)) for m in markers]
          if indices!=list(range(416)):
              raise SystemExit("Missing, duplicated or disordered source indexes")
          translations=[raw[m.end():markers[i+1].start() if i+1<len(markers) else len(raw)].strip() for i,m in enumerate(markers)]
          if not all(translations):
              raise SystemExit("Missing translated text at indexed source block")
          result="\n\n".join(translations).rstrip()+"\n"
          stage=book/"migration-staging/042-chapter-040-UNREVIEWED.md"
          if stage.exists() and stage.read_bytes()!=incoming.read_bytes():
              raise SystemExit("Staged candidate differs from consolidated source draft")
          if not stage.exists():
              with stage.open("x",encoding="utf-8") as stream:stream.write(raw)
          if stage.read_bytes()!=incoming.read_bytes():
              raise SystemExit("Stage readback mismatch")
          report={"unit":42,"chapter":40,"status":"UNREVIEWED",
                  "source_sha256":source_hash,"source_xhtml_sha256":original_ch["sha256"],
                  "indexed_nonempty_source_blocks":416,
                  "consolidated_input":incoming.relative_to(book).as_posix(),
                  "consolidated_input_sha256":hashlib.sha256(incoming.read_bytes()).hexdigest(),
                  "staged_path":stage.relative_to(book).as_posix(),
                  "target_path":row["translation_path"],
                  "translation_sha256":hashlib.sha256(result.encode("utf-8")).hexdigest(),
                  "review_pass":False}
          Path(".github/claiming-moon-ch40-plan.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("PASS: chapter 40 416/416 source-indexed blocks, awaiting literary review")
          PY
      - name: Real canonical claim and translation acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json,re,hashlib,subprocess
          from pathlib import Path
          book=Path("books/the-claiming-moon")
          report=json.loads(Path(".github/claiming-moon-ch40-plan.json").read_text(encoding="utf-8"))
          session="claiming-moon-consolidated-translator-42-20261022"
          def cli(*args):
              subprocess.run(["python","scripts/book.py",*map(str,args)],check=True)
          cli("claim","the-claiming-moon",42,"--role","translator","--session-id",session)
          raw=(book/report["staged_path"]).read_text(encoding="utf-8")
          markers=list(re.finditer(r"<!--\s*source-block\s+(\d+)\s*-->",raw))
          paragraphs=[raw[m.end():markers[i+1].start() if i+1<len(markers) else len(raw)].strip() for i,m in enumerate(markers)]
          text="\n\n".join(paragraphs).rstrip()+"\n"
          target=book/report["target_path"]
          with target.open("x",encoding="utf-8") as stream:stream.write(text)
          if hashlib.sha256(target.read_bytes()).hexdigest()!=report["translation_sha256"]:
              raise SystemExit("Canonical translation hash mismatch")
          cli("accept-translation","the-claiming-moon",42,"--session-id",session,"--json")
          cli("release","the-claiming-moon",42,"--session-id",session)
          PY
      - name: Verify lifecycle and preserve source and existing review evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/book.py validate the-claiming-moon
          python scripts/corpus.py verify the-claiming-moon
          python - <<'PY'
          import json
          from pathlib import Path
          book=Path("books/the-claiming-moon")
          progress=json.loads((book/"progress.json").read_text(encoding="utf-8"))
          ledger=json.loads((book/"review-ledger.json").read_text(encoding="utf-8"))
          unit=progress["chapters"][41]
          if unit["status"]!="translated" or not unit.get("translation_acceptance"):
              raise SystemExit("Chapter 40 translation acceptance not persisted")
          if progress["chapters"][47]["status"]!="reviewed" or len(ledger["records"])!=1:
              raise SystemExit("Preexisting afterword PASS must remain unchanged")
          print("Chapter 40 TRANSLATED, no independent Reviewer PASS claimed")
          PY
          test -z "$(git diff --name-only HEAD -- books/the-claiming-moon/incoming books/the-claiming-moon/source books/the-claiming-moon/extracted books/the-claiming-moon/review-ledger.json)"
      - name: Commit canonical unit and remove one-time workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp .github/claiming-moon-ch40-plan.json docs/migrations/claiming-moon-accepted-consolidated-ch40.json
          git add -- books/the-claiming-moon/migration-staging/042-chapter-040-UNREVIEWED.md \
            books/the-claiming-moon/translated books/the-claiming-moon/progress.json \
            books/the-claiming-moon/.workflow docs/migrations/claiming-moon-accepted-consolidated-ch40.json
          git rm -- .github/workflows/one-time-claiming-moon-admit-ch40.yml
          git diff --cached --name-status
          git commit -m 'migration: accept consolidated chapter 40 draft as translated, review pending'
          git push origin HEAD:migration/claiming-moon-accept-ch40-consolidated-20261022
