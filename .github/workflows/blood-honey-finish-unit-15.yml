name: Translate and review Blood and Honey unit 15

on:
  push:
    paths:
      - '.github/workflows/blood-honey-finish-unit-15.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tim8es/book-translator
          ref: a0c1a3c450a8251d2d90f4de5d5a988b5466958f
          path: .workflow-engine
      - name: Translate, accept, independently review, and promote unit 15
        shell: python
        run: |
          import os, sys
          from pathlib import Path
          sys.path.insert(0, str((Path('.workflow-engine') / 'scripts').resolve()))
          from workflow.claims import ClaimManager
          from workflow.filesystem import FilesystemStorage
          from workflow.repository import WorkflowStateRepository
          from workflow.schemas import SchemaKind
          from workflow.translations import TranslationAcceptanceManager
          from workflow.reviews import ReviewLedgerManager

          book = Path('books/blood-and-honey-rbmk-caleb-pov').resolve()
          repo = WorkflowStateRepository(FilesystemStorage(book))
          claims = ClaimManager(repo)
          reader = lambda p: (book / p).read_bytes()
          meta = repo.read('metadata.json', SchemaKind.METADATA).data
          workflow_revision = meta['workflow']['resolved_revision']
          run_id = os.environ['GITHUB_RUN_ID']
          base_commit = os.environ['GITHUB_SHA']

          progress = repo.read('progress.json', SchemaKind.PROGRESS)
          translator = f'gha-{run_id}-translator-015'
          claims.acquire(progress.data, '15', role='translator', session_id=translator,
                         base_revision=progress.version, base_commit=base_commit,
                         workflow_revision=workflow_revision)

          target = book / 'translated/015-afterword.md'
          target.write_text(
              '## Послесловие\n\nПожалуйста, загляните на Archive и оставьте комментарий, чтобы автор знал, понравилась ли вам его работа!\n',
              encoding='utf-8'
          )

          progress = repo.read('progress.json', SchemaKind.PROGRESS)
          TranslationAcceptanceManager(repo, artifact_reader=reader).accept(
              progress.data, progress.version, meta, 15, session_id=translator)
          progress = repo.read('progress.json', SchemaKind.PROGRESS)
          claims.release(progress.data, '15', session_id=translator,
                         detail='complete afterword translation accepted')

          progress = repo.read('progress.json', SchemaKind.PROGRESS)
          reviewer = f'gha-{run_id}-reviewer-015'
          claims.acquire(progress.data, '15', role='reviewer', session_id=reviewer,
                         base_revision=progress.version, base_commit=base_commit,
                         workflow_revision=workflow_revision)
          reviews = ReviewLedgerManager(repo, artifact_reader=reader)
          reviews.record(progress.data, progress.version, meta, 15, outcome='PASS',
                         reviewer_session_id=reviewer, review_commit=None)
          claims.release(progress.data, '15', session_id=reviewer,
                         detail='independent exact source-comparison PASS for afterword')
          progress = repo.read('progress.json', SchemaKind.PROGRESS)
          reviews.accept_review(progress.data, progress.version, meta, 15)

          final = repo.read('progress.json', SchemaKind.PROGRESS).data
          assert all(c['status'] == 'reviewed' for c in final['chapters']), final
      - name: Commit completed reviewed corpus
        run: |
          rm -rf .workflow-engine
          git config user.name "book-translator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add books/blood-and-honey-rbmk-caleb-pov
          git commit -m "Complete reviewed Blood and Honey translation"
          git pull --rebase origin main
          git push
