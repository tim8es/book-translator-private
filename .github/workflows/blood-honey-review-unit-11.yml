name: Correct and review Blood and Honey unit 11

on:
  push:
    paths:
      - '.github/workflows/blood-honey-review-unit-11.yml'

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tim8es/book-translator
          ref: a0c1a3c450a8251d2d90f4de5d5a988b5466958f
          path: .workflow-engine
      - name: Claim translator correction for unit 11
        shell: python
        run: |
          import os, sys
          from pathlib import Path
          sys.path.insert(0, str((Path('.workflow-engine') / 'scripts').resolve()))
          from workflow.claims import ClaimManager
          from workflow.filesystem import FilesystemStorage
          from workflow.repository import WorkflowStateRepository
          from workflow.schemas import SchemaKind
          book = Path('books/blood-and-honey-rbmk-caleb-pov').resolve()
          repo = WorkflowStateRepository(FilesystemStorage(book))
          progress = repo.read('progress.json', SchemaKind.PROGRESS)
          metadata = repo.read('metadata.json', SchemaKind.METADATA).data
          ClaimManager(repo).acquire(progress.data, '11', role='translator',
              session_id=f"gha-{os.environ['GITHUB_RUN_ID']}-translator-011-reviewfix",
              base_revision=progress.version, base_commit=os.environ['GITHUB_SHA'],
              workflow_revision=metadata['workflow']['resolved_revision'])
      - name: Apply independent review corrections
        shell: python
        run: |
          from pathlib import Path
          p = Path('books/blood-and-honey-rbmk-caleb-pov/translated/011-chapter-9.md')
          text = p.read_text(encoding='utf-8')
          replacements = [
            ('— Вопрос возник совершенно из ниоткуда.', '— Вот уж внезапный вопрос.'),
            ('С высоты Калеб не мог разобрать выражение лица Ариана. Незнакомец подошёл ближе — гораздо ближе, чем было необходимо, — легко и почти игриво улыбаясь.', 'С высоты Калеб не мог разобрать выражение лица Ариана. Тот не отстранился, когда незнакомец подошёл ближе — гораздо ближе, чем было необходимо, — легко и почти игриво улыбаясь.'),
            ('В голосе появился резкий аристократический растягивающий оттенок, который Калеб обычно приберегал', 'Голос зазвучал резко, с ленивой аристократической растяжкой, которую Калеб обычно приберегал'),
            ('Проходя мимо Калеба, он намеренно оказался непозволительно близко и не отвёл от принца взгляда,', 'Проходя мимо Калеба, он оказался непозволительно близко и не отвёл от принца взгляда,'),
            ('— Нет, — настойчиво ответил Ариан, убирая руки с плеч Калеба.', '— Нет, — настойчиво ответил Ариан, убирая руки с бицепсов Калеба.'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'expected exactly one match, got {count}: {old}')
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
      - name: Reaccept corrected translation
        shell: python
        run: |
          import os, sys
          from pathlib import Path
          sys.path.insert(0, str((Path('.workflow-engine') / 'scripts').resolve()))
          from workflow.claims import ClaimManager
          from workflow.filesystem import FilesystemStorage
          from workflow.repository import WorkflowStateRepository
          from workflow.schemas import SchemaKind
          from workflow.translations import TranslationAcceptanceManager
          book = Path('books/blood-and-honey-rbmk-caleb-pov').resolve()
          repo = WorkflowStateRepository(FilesystemStorage(book))
          reader = lambda p: (book / p).read_bytes()
          progress = repo.read('progress.json', SchemaKind.PROGRESS)
          metadata = repo.read('metadata.json', SchemaKind.METADATA).data
          session = f"gha-{os.environ['GITHUB_RUN_ID']}-translator-011-reviewfix"
          TranslationAcceptanceManager(repo, artifact_reader=reader).accept(
              progress.data, progress.version, metadata, 11, session_id=session)
          progress = repo.read('progress.json', SchemaKind.PROGRESS)
          ClaimManager(repo).release(progress.data, '11', session_id=session,
              detail='review corrections applied and exact translation reaccepted')
      - name: Record PASS and promote reviewed
        shell: python
        run: |
          import os, sys
          from pathlib import Path
          sys.path.insert(0, str((Path('.workflow-engine') / 'scripts').resolve()))
          from workflow.claims import ClaimManager
          from workflow.filesystem import FilesystemStorage
          from workflow.repository import WorkflowStateRepository
          from workflow.reviews import ReviewLedgerManager
          from workflow.schemas import SchemaKind
          book = Path('books/blood-and-honey-rbmk-caleb-pov').resolve()
          repo = WorkflowStateRepository(FilesystemStorage(book))
          reader = lambda p: (book / p).read_bytes()
          progress = repo.read('progress.json', SchemaKind.PROGRESS)
          metadata = repo.read('metadata.json', SchemaKind.METADATA).data
          session = f"gha-{os.environ['GITHUB_RUN_ID']}-reviewer-011"
          claims = ClaimManager(repo)
          claims.acquire(progress.data, '11', role='reviewer', session_id=session,
              base_revision=progress.version, base_commit=os.environ['GITHUB_SHA'],
              workflow_revision=metadata['workflow']['resolved_revision'])
          reviews = ReviewLedgerManager(repo, artifact_reader=reader)
          reviews.record(progress.data, progress.version, metadata, 11, outcome='PASS',
              reviewer_session_id=session, review_commit=None)
          claims.release(progress.data, '11', session_id=session,
              detail='independent full source-comparison review PASS')
          progress = repo.read('progress.json', SchemaKind.PROGRESS)
          reviews.accept_review(progress.data, progress.version, metadata, 11)
          final = repo.read('progress.json', SchemaKind.PROGRESS).data
          if next(c for c in final['chapters'] if c['number'] == 11)['status'] != 'reviewed':
              raise RuntimeError('unit 11 was not promoted to reviewed')
      - name: Commit reviewed durable state
        run: |
          rm -rf .workflow-engine
          git config user.name "book-translator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add books/blood-and-honey-rbmk-caleb-pov
          git commit -m "Correct and review Blood and Honey chapter 9"
          git push
