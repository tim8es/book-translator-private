name: Import Alex Cole chapter 5 translation

on:
  push:
    paths:
      - 'books/alex-cole-ten-commandments/.ch5-import/READY'

permissions:
  contents: write

jobs:
  import-chapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify translation
        shell: bash
        run: |
          set -euo pipefail
          BOOK='books/alex-cole-ten-commandments'
          IMPORT="$BOOK/.ch5-import"
          TARGET="$BOOK/translated/005-the-third-commandment-part-one.md"

          cat "$IMPORT"/part-* | base64 -d > /tmp/ch5.md.xz
          test "$(sha256sum /tmp/ch5.md.xz | awk '{print $1}')" = '13e389bc754d5e5639638f69bf82f79f329f8501c734c77039cd10d7516b5def'
          mkdir -p "$BOOK/translated"
          xz -dc /tmp/ch5.md.xz > "$TARGET"
          test -s "$TARGET"
          test "$(sha256sum "$TARGET" | awk '{print $1}')" = 'ec10d189dc4260f9fd6e426df94f4934fb1419e306176e6ffd506fabe92f930b'

      - name: Commit translation artifact
        shell: bash
        run: |
          set -euo pipefail
          BOOK='books/alex-cole-ten-commandments'
          rm -rf "$BOOK/.ch5-import"
          git config user.name 'book-translator-bot'
          git config user.email 'book-translator-bot@users.noreply.github.com'
          git add "$BOOK"
          git commit -m 'book: add Alex Cole chapter 5 translation draft'
          git push
