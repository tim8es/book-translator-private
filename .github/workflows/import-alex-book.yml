name: Import Alex Cole book checkpoint

on:
  push:
    paths:
      - 'books/alex-cole-ten-commandments/.import/READY'

permissions:
  contents: write

jobs:
  import-book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct checkpoint
        shell: bash
        run: |
          set -euo pipefail
          BOOK='books/alex-cole-ten-commandments'
          IMPORT="$BOOK/.import"
          cat "$IMPORT"/bundle.part-* | base64 -d > /tmp/book.tar.xz
          mkdir -p /tmp/book-import
          tar -xJf /tmp/book.tar.xz -C /tmp/book-import
          test -f /tmp/book-import/source/alex-cole-ten-commandments_414809252.epub
          test "$(sha256sum /tmp/book-import/source/alex-cole-ten-commandments_414809252.epub | awk '{print $1}')" = 'fcfedf4a253a22df3c0baa767cbe5ccdb30916a5957515f4d68b5b5f0be590dc'
          python - <<'PY'
          import hashlib, json, pathlib, shutil
          book = pathlib.Path('books/alex-cole-ten-commandments')
          imported = pathlib.Path('/tmp/book-import')
          manifest = json.loads((book/'source-manifest.json').read_text(encoding='utf-8'))
          for item in manifest['extracted']:
              p = imported/item['path']
              assert p.is_file(), f"missing {p}"
              got = hashlib.sha256(p.read_bytes()).hexdigest()
              assert got == item['sha256'], f"hash mismatch {item['path']}: {got}"
          for name in ('source','extracted','translated'):
              src = imported/name
              dst = book/name
              if dst.exists():
                  shutil.rmtree(dst)
              shutil.copytree(src, dst)
          PY
          rm -rf "$IMPORT"
      - name: Commit imported checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'book-translator-bot'
          git config user.email 'book-translator-bot@users.noreply.github.com'
          git add books/alex-cole-ten-commandments
          git commit -m 'book: materialize Alex Cole source and reviewed checkpoint'
          git push
