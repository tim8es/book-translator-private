name: Synthetic Actions integration test

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Fixed synthetic fixture job
        required: true
        type: string
        default: '00000000000000000000000000000000'

permissions:
  contents: write
  actions: write

concurrency:
  group: synthetic-actions-test
  cancel-in-progress: false

jobs:
  run-synthetic-fixture:
    if: github.ref == 'refs/heads/test/n8n-actions-run' && inputs.job_id == '00000000000000000000000000000000'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run one synthetic book checkpoint
        id: run
        env:
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_BASE_URL: ${{ vars.OMNIROUTE_BASE_URL }}
          OMNIROUTE_TRANSLATOR_MODEL: ${{ vars.OMNIROUTE_TRANSLATOR_MODEL }}
          OMNIROUTE_REVIEWER_MODEL: ${{ vars.OMNIROUTE_REVIEWER_MODEL }}
          OMNIROUTE_CORRECTOR_MODEL: ${{ vars.OMNIROUTE_CORRECTOR_MODEL }}
          JOB_ID: ${{ inputs.job_id }}
        run: python automation/book_runner.py --job-id "$JOB_ID"
      - name: Publish completed synthetic EPUB
        if: steps.run.outputs.done == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-book-translated
          path: ${{ steps.run.outputs.artifact }}
          if-no-files-found: error
          retention-days: 1
      - name: Dispatch next bounded checkpoint
        if: steps.run.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
          REF: ${{ github.ref_name }}
        run: gh workflow run auto-translate.yml --ref "$REF" -f job_id="$JOB_ID"
