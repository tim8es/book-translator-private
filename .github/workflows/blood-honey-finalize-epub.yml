name: Finalize Blood and Honey EPUB

on:
  push:
    paths:
      - .github/workflows/blood-honey-finalize-epub.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private book state
        uses: actions/checkout@v4
        with:
          repository: tim8es/book-translator-private
          fetch-depth: 1

      - name: Check out pinned Book Translator workflow
        uses: actions/checkout@v4
        with:
          repository: tim8es/book-translator
          ref: a0c1a3c450a8251d2d90f4de5d5a988b5466958f
          path: .workflow-engine
          fetch-depth: 1

      - name: Prepare runtime directories
        run: |
          mkdir -p books/blood-and-honey-rbmk-caleb-pov/source
          mkdir -p books/blood-and-honey-rbmk-caleb-pov/output

      - name: Strict source and workflow preflight
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          root = Path('.').resolve()
          sys.path.insert(0, str((root / '.workflow-engine' / 'scripts').resolve()))
          import book
          book.REPO_ROOT = root
          from workflow.status_cli import default_preflight
          errors, corpus = default_preflight(root, 'blood-and-honey-rbmk-caleb-pov')
          if errors:
              raise SystemExit('Structural preflight failed:\n- ' + '\n- '.join(map(str, errors)))
          if corpus.get('state') != 'verified':
              raise SystemExit(f'Source corpus is not verified: {corpus}')
          print('preflight=verified')
          PY

      - name: Finalize reviewed corpus
        run: |
          python - <<'PY'
          import argparse, os, sys
          from pathlib import Path
          root = Path('.').resolve()
          sys.path.insert(0, str((root / '.workflow-engine' / 'scripts').resolve()))
          import book
          book.REPO_ROOT = root
          from workflow.finalize_cli import finalize_command
          from workflow.status_cli import default_preflight
          slug = 'blood-and-honey-rbmk-caleb-pov'
          args = argparse.Namespace(slug=slug, session_id=f"gha-{os.environ['GITHUB_RUN_ID']}-finalizer", json=False)
          finalize_command(args, root, lambda s: default_preflight(root, s))
          PY

      - name: Build deterministic EPUB
        run: |
          python - <<'PY'
          import argparse, sys
          from pathlib import Path
          root = Path('.').resolve()
          sys.path.insert(0, str((root / '.workflow-engine' / 'scripts').resolve()))
          import book
          book.REPO_ROOT = root
          from workflow.epub_cli import epub_build_command, build_status_command
          slug = 'blood-and-honey-rbmk-caleb-pov'
          build_args = argparse.Namespace(slug=slug, output='Blood_and_Honey_RU.epub', allow_unreviewed=False, format='epub')
          epub_build_command(build_args, root)
          status_args = argparse.Namespace(slug=slug, allow_unreviewed=False, json=True, format='epub')
          rc = build_status_command(status_args, root)
          if rc != 0:
              raise SystemExit(rc)
          PY

      - name: Inspect EPUB ZIP structure
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          p = Path('books/blood-and-honey-rbmk-caleb-pov/output/Blood_and_Honey_RU.epub')
          with ZipFile(p) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'Bad EPUB member: {bad}')
              names = z.namelist()
              if not names or names[0] != 'mimetype':
                  raise SystemExit('EPUB mimetype is not first')
              if z.read('mimetype') != b'application/epub+zip':
                  raise SystemExit('Invalid EPUB mimetype')
          print(f'EPUB verified: {p} ({p.stat().st_size} bytes)')
          PY

      - name: Commit finalized durable state and EPUB
        run: |
          rm -rf .workflow-engine
          git rm .github/workflows/blood-honey-finalize-epub.yml
          git config user.name "book-translator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add books/blood-and-honey-rbmk-caleb-pov
          git commit -m "Finalize Blood and Honey Russian EPUB"
          git push

      - name: Upload EPUB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blood_and_Honey_RU
          path: books/blood-and-honey-rbmk-caleb-pov/output/Blood_and_Honey_RU.epub
          if-no-files-found: error
