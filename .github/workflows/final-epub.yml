name: Universal final EPUB delivery

# A single book-scoped job builds against the exact book-pinned public
# workflow, regardless of the state repository's visibility.
# No canonical script, template or installation marker is copied to state.
on:
  workflow_dispatch:
    inputs:
      book_slug:
        description: Existing canonical books/<book-slug>/ identifier
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'books/*/.workflow/final-build-request.json'

permissions:
  contents: read

jobs:
  discover-builds:
    runs-on: ubuntu-latest
    outputs:
      books: ${{ steps.scope.outputs.books }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read immutable public final-gate executor
        id: executor
        run: echo "sha=$(python automation/runtime_loader.py --print-revision)" >> "$GITHUB_OUTPUT"
      - name: Checkout public read-only final-build gates
        uses: actions/checkout@v7
        with:
          repository: tim8es/book-translator
          ref: ${{ steps.executor.outputs.sha }}
          path: .public-auto-runtime
          fetch-depth: 1
          persist-credentials: false
      - name: Verify checked-out public executor revision
        run: python automation/runtime_loader.py --verify
      - name: Resolve only explicitly requested books
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SLUG: ${{ inputs.book_slug }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          python .public-auto-runtime/scripts/final_build_checks.py discover \
            --root . --event-name "$EVENT_NAME" \
            --book-slug "$REQUESTED_SLUG" \
            --before "$BEFORE" --after "$AFTER" \
            --github-output "$GITHUB_OUTPUT"

  build:
    needs: discover-builds
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        book_slug: ${{ fromJSON(needs.discover-builds.outputs.books) }}
    concurrency:
      group: book-operation-${{ matrix.book_slug }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out authoritative book state
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Read immutable public executor lock
        id: executor
        shell: bash
        run: echo "sha=$(python automation/runtime_loader.py --print-revision)" >> "$GITHUB_OUTPUT"

      - name: Checkout public canonical CLI adapter (reviewed commit)
        uses: actions/checkout@v7
        with:
          repository: tim8es/book-translator
          ref: ${{ steps.executor.outputs.sha }}
          path: .public-auto-runtime
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pinned public gate executor before loading
        run: python automation/runtime_loader.py --verify

      - name: Require original bytes and current independent PASS before building
        id: pin
        shell: bash
        env:
          BOOK_SLUG: ${{ matrix.book_slug }}
        run: |
          set -euo pipefail
          python .public-auto-runtime/scripts/final_build_checks.py admit \
            --root . --book-slug "$BOOK_SLUG" --github-output "$GITHUB_OUTPUT"

      - name: Check out exact book-pinned public engine
        uses: actions/checkout@v7
        with:
          repository: tim8es/book-translator
          ref: ${{ steps.pin.outputs.ref }}
          path: .pinned-book-translator
          persist-credentials: false

      - name: Verify immutable executor and book pin without installation
        shell: bash
        env:
          PIN: ${{ steps.pin.outputs.ref }}
        run: |
          set -euo pipefail
          python automation/runtime_loader.py --verify
          test "$(git -C .pinned-book-translator rev-parse HEAD)" = "$PIN"
          test ! -e scripts
          test ! -e .book-translator-install.json

      - name: Run pinned validation, finalization and canonical EPUB builder
        shell: bash
        env:
          BOOK_SLUG: ${{ matrix.book_slug }}
          PIN: ${{ steps.pin.outputs.ref }}
        run: |
          set -euo pipefail
          # The CLI adapter lives in the locked public executor checkout.
          # Its pinned book checkout symlinks books/ into this state tree.
          # No scripts/docs/marker are created in the book-state checkout.
          python .public-auto-runtime/scripts/pinned_cli.py \
            --engine .pinned-book-translator --state . --revision "$PIN" \
            book validate "$BOOK_SLUG"
          python .public-auto-runtime/scripts/pinned_cli.py \
            --engine .pinned-book-translator --state . --revision "$PIN" \
            corpus verify "$BOOK_SLUG"
          python .public-auto-runtime/scripts/pinned_cli.py \
            --engine .pinned-book-translator --state . --revision "$PIN" \
            book finalize "$BOOK_SLUG" --json
          python .public-auto-runtime/scripts/pinned_cli.py \
            --engine .pinned-book-translator --state . --revision "$PIN" \
            book build "$BOOK_SLUG" --format epub
          python .public-auto-runtime/scripts/pinned_cli.py \
            --engine .pinned-book-translator --state . --revision "$PIN" \
            book build-status "$BOOK_SLUG" --json

      - name: Verify exact EPUB bytes, chapter count and manifest
        shell: bash
        env:
          BOOK_SLUG: ${{ matrix.book_slug }}
        run: |
          set -euo pipefail
          python .public-auto-runtime/scripts/final_build_checks.py verify \
            --root . --book-slug "$BOOK_SLUG"

      - name: Upload verified output and quality reports
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-epub-${{ matrix.book_slug }}
          retention-days: 30
          if-no-files-found: error
          path: |
            books/${{ matrix.book_slug }}/output/*.epub
            books/${{ matrix.book_slug }}/output/manifest.json
            books/${{ matrix.book_slug }}/STATE.md
            books/${{ matrix.book_slug }}/FINAL_QUALITY_GATES.md
            books/${{ matrix.book_slug }}/REVIEW_REPORT.md

      - name: Publish canonical EPUB and reports to the same book workspace
        shell: bash
        env:
          BOOK_SLUG: ${{ matrix.book_slug }}
        run: |
          set -euo pipefail
          # Pinned scripts/contracts are ignored, not tracked in the state
          # repository. git restore on absent paths fails with pathspec.
          # Never stage canonical runtime files or unrelated book state.
          if [[ -n "$(git ls-files -- scripts .book-translator-install.json)" ]]; then
            echo "::error::Unexpected tracked canonical runtime in book-state repository."
            exit 1
          fi
          git add -A -- "books/$BOOK_SLUG"
          if git diff --cached --quiet; then
            echo "Output already committed"
            exit 0
          fi
          git fetch --quiet origin main
          if ! git diff --quiet HEAD origin/main -- "books/$BOOK_SLUG"; then
            echo "::error::Book changed while building; refusing to publish stale output."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "finalize($BOOK_SLUG): publish reviewed EPUB and quality reports"
          git rebase origin/main
          git push origin HEAD:main
