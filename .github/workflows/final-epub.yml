name: Universal final EPUB delivery

# A single book-scoped job builds against the exact book-pinned public
# workflow, regardless of the state repository's visibility.
# No canonical script, template or installation marker is copied to state.
on:
  workflow_dispatch:
    inputs:
      book_slug:
        description: Existing canonical books/<book-slug>/ identifier
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'books/*/.workflow/final-build-request.json'

permissions:
  contents: read

jobs:
  discover-builds:
    runs-on: ubuntu-latest
    outputs:
      books: ${{ steps.scope.outputs.books }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve only explicitly requested books
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SLUG: ${{ inputs.book_slug }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          valid_slug = re.compile(r"[a-z0-9][a-z0-9-]{0,99}\Z")
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              slugs = [os.environ["REQUESTED_SLUG"]]
          else:
              before = os.environ.get("BEFORE") or ""
              after = os.environ["AFTER"]
              if re.fullmatch(r"[0-9a-f]{40}", before) and before != "0" * 40:
                  command = ["git", "diff", "--name-only", before, after]
              else:
                  command = ["git", "diff-tree", "--root", "--no-commit-id", "--name-only", "-r", after]
              changes = subprocess.check_output(command, text=True).splitlines()
              slugs = sorted({
                  match.group(1)
                  for name in changes
                  if (match := re.fullmatch(
                      r"books/([a-z0-9][a-z0-9-]{0,99})/\.workflow/final-build-request\.json",
                      name,
                  ))
              })
          if not slugs or len(slugs) > 25 or any(not valid_slug.fullmatch(s) for s in slugs):
              raise SystemExit("No valid, explicitly requested book for final build")
          for slug in slugs:
              if not (Path("books") / slug / ".workflow" / "final-build-request.json").is_file():
                  raise SystemExit(f"Build request does not exist: {slug}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              print("books=" + json.dumps(slugs), file=out)
          print("Approved book scopes:", slugs)
          PY

  build:
    needs: discover-builds
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        book_slug: ${{ fromJSON(needs.discover-builds.outputs.books) }}
    concurrency:
      group: book-operation-${{ matrix.book_slug }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out authoritative book state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify book, request, source and complete independent review ledger
        id: pin
        shell: bash
        env:
          BOOK_SLUG: ${{ matrix.book_slug }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          slug = os.environ["BOOK_SLUG"]
          book = Path("books") / slug
          request = json.loads((book / ".workflow/final-build-request.json").read_text("utf-8"))
          metadata = json.loads((book / "metadata.json").read_text("utf-8"))
          manifest = json.loads((book / "source-manifest.json").read_text("utf-8"))
          progress = json.loads((book / "progress.json").read_text("utf-8"))
          ledger = json.loads((book / "review-ledger.json").read_text("utf-8"))
          pin = metadata["workflow"]["resolved_revision"]
          assert re.fullmatch(r"[0-9a-f]{40}", pin), "invalid pinned workflow revision"
          assert request.get("schema_version") == 1
          assert request.get("operation") == "finalize-and-build-epub"
          assert request.get("book_slug") == slug
          assert request.get("workflow_revision") == pin, "workflow pin mismatch"
          assert request.get("source_sha256") == metadata["source"]["sha256"]
          assert manifest["source_sha256"] == metadata["source"]["sha256"]
          assert request.get("unit_count") == len(progress["chapters"])
          assert len(progress["chapters"]) == len(manifest["extracted"])
          source = book / "source" / metadata["source"]["filename"]
          assert hashlib.sha256(source.read_bytes()).hexdigest() == manifest["source_sha256"], "source bytes changed"
          assert not list((book / ".workflow/claims").glob("chapter-*.json")), "active claims"
          for blocker in ("coordination-lock.json", "source-promotion.json", "finalization.json"):
              assert not (book / ".workflow" / blocker).exists(), "active transition: " + blocker
          for chapter in progress["chapters"]:
              unit = chapter["unit_id"]
              entry = next((x for x in manifest["extracted"] if x["unit_id"] == unit), None)
              assert entry is not None and entry["path"] == chapter["source_path"]
              assert chapter["status"] == "reviewed", "incomplete chapter: " + unit
              source_text = (book / chapter["source_path"]).read_bytes()
              translated = (book / chapter["translation_path"]).read_bytes()
              accepted = chapter["translation_acceptance"]
              source_hash = hashlib.sha256(source_text).hexdigest()
              translation_hash = hashlib.sha256(translated).hexdigest()
              assert source_hash == entry["sha256"]
              assert translation_hash == accepted["translation_sha256"]
              latest = next((x for x in reversed(ledger["records"]) if x["unit_id"] == unit), None)
              assert latest and latest["outcome"] == "PASS"
              assert latest["source_sha256"] == source_hash
              assert latest["translation_sha256"] == translation_hash
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              print("ref=" + pin, file=out)
          print("Verified all", len(progress["chapters"]), "units with matching current review evidence")
          PY

      - name: Check out exact book-pinned public engine
        uses: actions/checkout@v4
        with:
          repository: tim8es/book-translator
          ref: ${{ steps.pin.outputs.ref }}
          path: .pinned-book-translator
          persist-credentials: false

      - name: Read immutable public executor lock
        id: executor
        shell: bash
        run: echo "sha=$(python automation/runtime_loader.py --print-revision)" >> "$GITHUB_OUTPUT"

      - name: Checkout public canonical CLI adapter (reviewed commit)
        uses: actions/checkout@v7
        with:
          repository: tim8es/book-translator
          ref: ${{ steps.executor.outputs.sha }}
          path: .public-auto-runtime
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable executor and book pin without installation
        shell: bash
        env:
          PIN: ${{ steps.pin.outputs.ref }}
        run: |
          set -euo pipefail
          python automation/runtime_loader.py --verify
          test "$(git -C .pinned-book-translator rev-parse HEAD)" = "$PIN"
          test ! -e scripts
          test ! -e .book-translator-install.json

      - name: Run pinned validation, finalization and canonical EPUB builder
        shell: bash
        env:
          BOOK_SLUG: ${{ matrix.book_slug }}
          PIN: ${{ steps.pin.outputs.ref }}
        run: |
          set -euo pipefail
          # The CLI adapter lives in the locked public executor checkout.
          # Its pinned book checkout symlinks books/ into this state tree.
          # No scripts/docs/marker are created in the book-state checkout.
          for step in validate finalize; do
            python .public-auto-runtime/scripts/pinned_cli.py \
              --engine .pinned-book-translator --state . --revision "$PIN" \
              book "$step" "$BOOK_SLUG" --json
          done
          python .public-auto-runtime/scripts/pinned_cli.py \
            --engine .pinned-book-translator --state . --revision "$PIN" \
            corpus verify "$BOOK_SLUG"
          python .public-auto-runtime/scripts/pinned_cli.py \
            --engine .pinned-book-translator --state . --revision "$PIN" \
            book build "$BOOK_SLUG" --format epub
          python .public-auto-runtime/scripts/pinned_cli.py \
            --engine .pinned-book-translator --state . --revision "$PIN" \
            book build-status "$BOOK_SLUG" --json

      - name: Verify exact EPUB bytes, chapter count and manifest
        shell: bash
        env:
          BOOK_SLUG: ${{ matrix.book_slug }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path
          b = Path("books") / os.environ["BOOK_SLUG"]
          m = json.loads((b / "output/manifest.json").read_text("utf-8"))
          p = json.loads((b / "progress.json").read_text("utf-8"))
          assert m["format"] == "epub" and not m["preview"], "final must not be unreviewed preview"
          assert m["unit_count"] == len(p["chapters"]), "chapter count mismatch"
          artifact = b / m["artifact_path"]
          data = artifact.read_bytes()
          assert hashlib.sha256(data).hexdigest() == m["artifact_sha256"], "output hash mismatch"
          with zipfile.ZipFile(artifact) as book:
              assert book.testzip() is None, "corrupt EPUB member"
              assert book.namelist()[0] == "mimetype", "EPUB mimetype must be first"
              assert book.read("mimetype") == b"application/epub+zip"
              assert "META-INF/container.xml" in book.namelist()
              assert len([n for n in book.namelist() if n.endswith(".xhtml")]) >= len(p["chapters"])
          assert (b / "FINAL_QUALITY_GATES.md").is_file()
          assert (b / "REVIEW_REPORT.md").is_file()
          print("VERIFIED_EPUB", str(artifact), "bytes", len(data), "sha256", m["artifact_sha256"])
          PY

      - name: Upload verified output and quality reports
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-epub-${{ matrix.book_slug }}
          retention-days: 30
          if-no-files-found: error
          path: |
            books/${{ matrix.book_slug }}/output/*.epub
            books/${{ matrix.book_slug }}/output/manifest.json
            books/${{ matrix.book_slug }}/STATE.md
            books/${{ matrix.book_slug }}/FINAL_QUALITY_GATES.md
            books/${{ matrix.book_slug }}/REVIEW_REPORT.md

      - name: Publish canonical EPUB and reports to the same book workspace
        shell: bash
        env:
          BOOK_SLUG: ${{ matrix.book_slug }}
        run: |
          set -euo pipefail
          # Pinned scripts/contracts are ignored, not tracked in the state
          # repository. git restore on absent paths fails with pathspec.
          # Never stage canonical runtime files or unrelated book state.
          if [[ -n "$(git ls-files -- scripts .book-translator-install.json)" ]]; then
            echo "::error::Unexpected tracked canonical runtime in book-state repository."
            exit 1
          fi
          git add -A -- "books/$BOOK_SLUG"
          if git diff --cached --quiet; then
            echo "Output already committed"
            exit 0
          fi
          git fetch --quiet origin main
          if ! git diff --quiet HEAD origin/main -- "books/$BOOK_SLUG"; then
            echo "::error::Book changed while building; refusing to publish stale output."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "finalize($BOOK_SLUG): publish reviewed EPUB and quality reports"
          git rebase origin/main
          git push origin HEAD:main
