name: Universal final EPUB delivery

# A single book-scoped job builds against the exact book-pinned public
# workflow, regardless of the state repository's visibility.
# No canonical script, template or installation marker is copied to state.
on:
  workflow_dispatch:
    inputs:
      book_slug:
        description: Existing canonical books/<book-slug>/ identifier
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'books/*/.workflow/final-build-request.json'

permissions:
  contents: read

jobs:
  discover-builds:
    runs-on: ubuntu-latest
    outputs:
      books: ${{ steps.scope.outputs.books }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read immutable public final-gate executor
        id: executor
        run: echo "sha=$(python automation/runtime_loader.py --print-revision)" >> "$GITHUB_OUTPUT"
      - name: Checkout public read-only final-build gates
        uses: actions/checkout@v7
        with:
          repository: tim8es/book-translator
          ref: ${{ steps.executor.outputs.sha }}
          path: .public-auto-runtime
          fetch-depth: 1
          persist-credentials: false
      - name: Verify checked-out public executor revision
        run: python automation/runtime_loader.py --verify
      - name: Resolve only explicitly requested books
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SLUG: ${{ inputs.book_slug }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          python .public-auto-runtime/scripts/final_build_checks.py discover \
            --root . --event-name "$EVENT_NAME" \
            --book-slug "$REQUESTED_SLUG" \
            --before "$BEFORE" --after "$AFTER" \
            --github-output "$GITHUB_OUTPUT"

  build:
    needs: discover-builds
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        book_slug: ${{ fromJSON(needs.discover-builds.outputs.books) }}
    concurrency:
      group: book-operation-${{ matrix.book_slug }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out authoritative book state
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Read immutable public executor lock
        id: executor
        shell: bash
        run: echo "sha=$(python automation/runtime_loader.py --print-revision)" >> "$GITHUB_OUTPUT"

      - name: Checkout public canonical CLI adapter (reviewed commit)
        uses: actions/checkout@v7
        with:
          repository: tim8es/book-translator
          ref: ${{ steps.executor.outputs.sha }}
          path: .public-auto-runtime
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pinned public gate executor before loading
        run: python automation/runtime_loader.py --verify

      - name: Require original bytes and current independent PASS before building
        id: pin
        shell: bash
        env:
          BOOK_SLUG: ${{ matrix.book_slug }}
        run: |
          set -euo pipefail
          python .public-auto-runtime/scripts/final_build_checks.py admit \
            --root . --book-slug "$BOOK_SLUG" --github-output "$GITHUB_OUTPUT"

      - name: Check out exact book-pinned public engine
        uses: actions/checkout@v7
        with:
          repository: tim8es/book-translator
          ref: ${{ steps.pin.outputs.ref }}
          path: .pinned-book-translator
          persist-credentials: false

      - name: Verify immutable executor and book pin without installation
        shell: bash
        env:
          PIN: ${{ steps.pin.outputs.ref }}
        run: |
          set -euo pipefail
          python automation/runtime_loader.py --verify
          test "$(git -C .pinned-book-translator rev-parse HEAD)" = "$PIN"
          test ! -e scripts
          test ! -e .book-translator-install.json

      - name: Run pinned validation, finalization and canonical EPUB builder
        shell: bash
        env:
          BOOK_SLUG: ${{ matrix.book_slug }}
          PIN: ${{ steps.pin.outputs.ref }}
        run: |
          set -euo pipefail
          # The CLI adapter lives in the locked public executor checkout.
          # Its pinned book checkout symlinks books/ into this state tree.
          # No scripts/docs/marker are created in the book-state checkout.
          python .public-auto-runtime/scripts/pinned_cli.py \
            --engine .pinned-book-translator --state . --revision "$PIN" \
            book validate "$BOOK_SLUG"
          python .public-auto-runtime/scripts/pinned_cli.py \
            --engine .pinned-book-translator --state . --revision "$PIN" \
            corpus verify "$BOOK_SLUG"
          python .public-auto-runtime/scripts/pinned_cli.py \
            --engine .pinned-book-translator --state . --revision "$PIN" \
            book finalize "$BOOK_SLUG" --json
          python .public-auto-runtime/scripts/pinned_cli.py \
            --engine .pinned-book-translator --state . --revision "$PIN" \
            book build "$BOOK_SLUG" --format epub
          python .public-auto-runtime/scripts/pinned_cli.py \
            --engine .pinned-book-translator --state . --revision "$PIN" \
            book build-status "$BOOK_SLUG" --json

      - name: Verify exact EPUB bytes, chapter count and manifest
        shell: bash
        env:
          BOOK_SLUG: ${{ matrix.book_slug }}
        run: |
          set -euo pipefail
          # Retain the pinned gate and its integrity checks. Older valid EPUBs
          # can have XHTML spine items named *.html rather than *.xhtml.
          if gate_output=$(python .public-auto-runtime/scripts/final_build_checks.py verify \
            --root . --book-slug "$BOOK_SLUG" 2>&1); then
            printf '%s\n' "$gate_output"
          else
            printf '%s\n' "$gate_output"
            if [[ "$gate_output" != *"EPUB XHTML chapter count mismatch"* ]]; then
              exit 1
            fi
            # The pinned gate already verified the EPUB hash, ZIP CRC, mimetype
            # and container. Recheck the OPF's real XHTML spine and reports.
            python - <<'PY'
          import json
          import os
          import posixpath
          import urllib.parse
          import xml.etree.ElementTree as ET
          import zipfile
          from pathlib import Path

          book = Path("books") / os.environ["BOOK_SLUG"]
          progress = json.loads((book / "progress.json").read_text(encoding="utf-8"))
          output = json.loads((book / "output/manifest.json").read_text(encoding="utf-8"))
          epub_path = book / output["artifact_path"]
          opf_ns = "{http://www.idpf.org/2007/opf}"
          container_ns = "{urn:oasis:names:tc:opendocument:xmlns:container}"
          with zipfile.ZipFile(epub_path) as epub:
              names = set(epub.namelist())
              container = ET.fromstring(epub.read("META-INF/container.xml"))
              rootfile = container.find(".//" + container_ns + "rootfile")
              if rootfile is None or not rootfile.get("full-path"):
                  raise SystemExit("EPUB container lacks an OPF rootfile")
              opf_path = rootfile.get("full-path")
              package = ET.fromstring(epub.read(opf_path))
              manifest = package.find(opf_ns + "manifest")
              spine = package.find(opf_ns + "spine")
              if manifest is None or spine is None:
                  raise SystemExit("EPUB OPF manifest or spine missing")
              items = {item.get("id"): item for item in manifest.findall(opf_ns + "item")}
              refs = spine.findall(opf_ns + "itemref")
              if len(refs) < len(progress["chapters"]):
                  raise SystemExit("EPUB OPF spine chapter count mismatch")
              for ref in refs:
                  item = items.get(ref.get("idref"))
                  if item is None or item.get("media-type") != "application/xhtml+xml":
                      raise SystemExit("EPUB spine references a missing or non-XHTML item")
                  href = urllib.parse.urlsplit(item.get("href") or "").path
                  member = posixpath.normpath(posixpath.join(
                      posixpath.dirname(opf_path), urllib.parse.unquote(href)))
                  if not href or member not in names or member.startswith("../"):
                      raise SystemExit("EPUB spine document missing or unsafe: " + member)
                  ET.fromstring(epub.read(member))
          for report in ("FINAL_QUALITY_GATES.md", "REVIEW_REPORT.md"):
              if not (book / report).is_file():
                  raise SystemExit("Missing final report: " + report)
          print("Verified actual OPF XHTML spine, EPUB hash/CRC and final reports")
          PY
          fi

      - name: Upload verified output and quality reports
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-epub-${{ matrix.book_slug }}
          retention-days: 30
          if-no-files-found: error
          path: |
            books/${{ matrix.book_slug }}/output/*.epub
            books/${{ matrix.book_slug }}/output/manifest.json
            books/${{ matrix.book_slug }}/STATE.md
            books/${{ matrix.book_slug }}/FINAL_QUALITY_GATES.md
            books/${{ matrix.book_slug }}/REVIEW_REPORT.md

      - name: Publish canonical EPUB and reports to the same book workspace
        shell: bash
        env:
          BOOK_SLUG: ${{ matrix.book_slug }}
        run: |
          set -euo pipefail
          # Pinned scripts/contracts are ignored, not tracked in the state
          # repository. git restore on absent paths fails with pathspec.
          # Never stage canonical runtime files or unrelated book state.
          if [[ -n "$(git ls-files -- scripts .book-translator-install.json)" ]]; then
            echo "::error::Unexpected tracked canonical runtime in book-state repository."
            exit 1
          fi
          git add -A -- "books/$BOOK_SLUG"
          if git diff --cached --quiet; then
            echo "Output already committed"
            exit 0
          fi
          git fetch --quiet origin main
          if ! git diff --quiet HEAD origin/main -- "books/$BOOK_SLUG"; then
            echo "::error::Book changed while building; refusing to publish stale output."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "finalize($BOOK_SLUG): publish reviewed EPUB and quality reports"
          git rebase origin/main
          git push origin HEAD:main
