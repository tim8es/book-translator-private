name: Batched book integrity validation

on:
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Validate books changed within this many hours (1-168)"
        required: false
        type: string
        default: "3"
  schedule:
    # Book checkpoints do NOT spawn one CI run per commit.
    # Hourly safety sweep; recheck a 3-hour window to tolerate missed runs.
    - cron: "13 * * * *"

permissions:
  contents: read

concurrency:
  group: batched-book-integrity-main
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Collect unique book paths changed in the rolling window
        id: scope
        env:
          LOOKBACK_HOURS: ${{ inputs.lookback_hours || '3' }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          value = os.environ["LOOKBACK_HOURS"]
          if not value.isdecimal() or not 1 <= int(value) <= 168:
              raise SystemExit("lookback_hours must be an integer between 1 and 168")
          output = subprocess.check_output(
              ["git", "log", f"--since={value} hours ago",
               "--format=", "--name-only", "-z", "HEAD"])
          paths = sorted({raw.decode("utf-8") for raw in output.split(b"\0")
                          if raw.startswith(b"books/") and b"/" in raw[6:]})
          target = Path(os.environ["RUNNER_TEMP"]) / "changed-book-paths.json"
          target.write_text(json.dumps(paths, ensure_ascii=False), encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as result:
              print(f"has_changes={str(bool(paths)).lower()}", file=result)
          print(f"Collected {len(paths)} unique book file paths in the last {value} hours")
          PY
      - uses: actions/setup-python@v7
        if: steps.scope.outputs.has_changes == 'true'
        with:
          python-version: "3.12"
      - name: Resolve reviewed public runtime commit
        if: steps.scope.outputs.has_changes == 'true'
        id: engine_pin
        run: echo "sha=$(python automation/runtime_loader.py --print-revision)" >> "$GITHUB_OUTPUT"
      - name: Checkout public runtime (immutable)
        if: steps.scope.outputs.has_changes == 'true'
        uses: actions/checkout@v7
        with:
          repository: tim8es/book-translator
          ref: ${{ steps.engine_pin.outputs.sha }}
          path: .public-auto-runtime
          persist-credentials: false
      - name: Verify public runtime matches locked commit
        if: steps.scope.outputs.has_changes == 'true'
        run: python automation/runtime_loader.py --verify
      - name: Validate changed book content and canonical integrity
        if: steps.scope.outputs.has_changes == 'true'
        run: python .github/scripts/verify_changed_books.py "$RUNNER_TEMP/changed-book-paths.json"
