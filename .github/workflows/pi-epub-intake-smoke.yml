name: Ephemeral canonical Auto Pi EPUB intake verification
on:
  push:
    branches:
      - ci/pi-durable-resume-smoke-20261121
    paths:
      - ci/pi-epub-intake-signal.json

permissions:
  contents: write

jobs:
  intake-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    concurrency:
      group: pi-epub-intake-smoke-20261121
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: tim8es/book-translator
          ref: ffcc39c1977cd36107510953ad6c689dabd10ab0
          path: .pi-engine
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Pi
        run: npm install --global --ignore-scripts @earendil-works/pi-coding-agent@1.6.0
      - name: Exercise canonical new EPUB job through bounded Pi checkpoints
        shell: bash
        env:
          BOOK_TRANSLATOR_LLM_BACKEND: pi
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_BASE_URL: ${{ vars.OMNIROUTE_BASE_URL }}
          OMNIROUTE_TRANSLATOR_MODEL: ${{ vars.OMNIROUTE_TRANSLATOR_MODEL }}
          OMNIROUTE_REVIEWER_MODEL: ${{ vars.OMNIROUTE_REVIEWER_MODEL }}
          OMNIROUTE_CORRECTOR_MODEL: ${{ vars.OMNIROUTE_CORRECTOR_MODEL }}
          OMNIROUTE_ORCHESTRATOR_MODEL: ${{ vars.OMNIROUTE_ORCHESTRATOR_MODEL || vars.OMNIROUTE_REVIEWER_MODEL }}
          OMNIROUTE_MODEL_CALL_LIMIT: "12"
          PI_AGENT_CONTEXT_WINDOW: "131072"
          PI_AGENT_MAX_TOKENS: "8192"
        run: |
          set -euo pipefail
          python ci/pi_epub_intake_smoke.py
