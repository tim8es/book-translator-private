          Толпа буквально сходила с ума.

          Самодовольное удовлетворение разлилось по груди Калеба успокаивающим бальзамом. Возможно, Ариан всё ещё ненавидел его за сделанное, но хотя бы какое-то время будет защищён от ярости Эндрю.

          Люстра в центре потолка разлетелась вдребезги.

          Свет погас, помещение заполнил дым, и Калеб пошатнулся.

