          Зал погрузился в полный хаос.

          Люди метались, пытаясь найти выход при слабом свете аварийных ламп сквозь плотную белую завесу. Раздавались крики. Кто-то орал, кто-то в панике спотыкался о других.

          Из дыма вылетела рука и сомкнулась на предплечье Калеба.

          Он дёрнулся от неожиданности.

          Сердце подпрыгнуло к горлу.

