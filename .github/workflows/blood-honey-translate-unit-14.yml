          На долгое мгновение весь мир будто остановился. Остались только они двое.

          Затем Ариан дёрнул его за собой к боковой двери.

          Он провёл Калеба по боковым коридорам и служебным проходам, пока они не выскочили в пустой переулок у здания. Рука ни разу не отпустила Калеба — будто Ариану требовалось постоянно чувствовать, что он действительно рядом.

          Они побежали по переулку, затем сцепили ладони, вынырнули в толпу и продолжили бежать.

          Лицо Калеба сияло яркой, счастливой улыбкой. Вокруг выли сирены, но они не останавливались.

          Ариан пришёл за ним.

          Несмотря ни на что.

          Несмотря на то, что Калеб намеренно причинил ему боль.

          Несмотря на объявленную помолвку с Валентиной.

          Несмотря на то, что все эти три дня — неизвестно сколько именно — Ариан думал, что принц мёртв.

          Ариан пришёл за ним.

          Калебу казалось, что он летит.

          Они остановились только у Темзы. У подножия трапа, ведущего на яхту, ждали двое людей Ариана.

          Калеб и Ариан сбавили бег до трусцы, поднялись на борт и окончательно остановились уже под палубой, в салоне с видом на уходящую за кормой Темзу.

          Калеб несколько секунд переводил дыхание и осматривался. Знакомые запахи оружейного масла, дыма, кожи и замши успокаивали, возвращая почву под ногами.

          На барной стойке за плечом Ариана стояла ваза, переполненная ярко-красными розами, и бутылка шампанского.

          Ариан не собирался уезжать без Калеба.

          Это было очевидно.

          Улыбку остановить не получалось.

          Калеб шагнул в личное пространство Ариана и медленно снял с него кепку.

          Ариан тяжело дышал. Взгляд был прикован к точке где-то возле галстука Калеба. Медленно поднялся вверх и встретился с его глазами.

          Ариан выглядел так, словно не мог поверить, что Калеб действительно стоит перед ним.

          — Ты превзошёл все мои самые безумные фантазии, Крёстный отец. Устроить переполох в самом сердце моей страны. Может, ты всё-таки связался с террористической группировкой, — поддразнил Калеб.

          В щеках засияли ямочки.

          Ариан выдохнул — в этом звуке поровну смешались раздражение и облегчение — и резко приблизился.

          — Замолчи, — прошептал он за мгновение до того, как заключил принца в объятия и поцеловал.

          Ладони держали лицо Калеба так, будто тот был самой драгоценной вещью на свете, пока Ариан жадно его целовал.

          Калеб крепко обхватил его за бока, пальцы вдавились в мягкую кожу куртки, и ответил с той же жадностью.

          Они выбрались.

          Они были в безопасности — по крайней мере пока.

          А главное, они были вместе.

          И самое важное для Калеба: Ариан, похоже, не ненавидел его.

          Сердце колотилось не только после бега по улицам Лондона. Всё, что Калеб чувствовал, больше невозможно было удерживать внутри.

          — Это правда? — выдохнул Ариан, едва их губы разошлись.

          Лбы всё ещё почти касались друг друга, словно ни один не мог вынести настоящего расстояния.

          — То, что ты только что сказал. Что у тебя есть ко мне чувства?

          Серо-зелёные глаза горели жаром и огнём.

          Калеб мягко улыбнулся. На уязвимость, поселившуюся на лице Ариана, он ответил собственной честностью — открытой, видимой без всяких масок.

          — Возможно, это было некоторое преувеличение, — пошутил он.

          Улыбка стала шире, ямочки прорезали щёки, а чувства сияли прямо на лице, чтобы Ариан мог их увидеть.

          — Но я тебя люблю.

          — И я тебя люблю, — ответный шёпот Ариана был тихим и хрупким.

          Калеб почувствовал, как глаза защипало от слёз, и положил ладонь Ариану на грудь, ощущая под ней ровный стук сердца.

          — Как в тот день, когда ты вытащил меня из грязи, держись за меня. На этот раз я тебя не отпущу, Калеб. Даже если ради этого придётся выступить против всего мира…

          Калеб не дал ему закончить. Обвил руками плечи Ариана и крепко прижал к себе.

          Ариан обнял его за спину и стиснул так же сильно.

          *Вот оно,* — подумал Калеб. — *Вот это и есть дом.*

          И больше он никогда от него не откажется.

          Калеб будет бороться — обаянием, мастерством и всеми своими многочисленными талантами — чтобы выполнить просьбу Ариана.

          Он будет держаться, пока пальцы не начнут кровоточить и не иссякнут силы.

          Больше никогда не уйдёт сам.

          Когда-нибудь — вероятно, совсем скоро — наступит расплата. Эндрю не простит предательства Калеба.

          Но Калеб не боялся.

          Всё, что ему нужно, уже было здесь, в его руках.

          И он больше никогда его не отпустит.

          Примечания в конце главы

          > Вот мы и добрались до конца… пока что.

          > Это всё, что у меня написано на данный момент, но я уже работаю над бонусной главой (NSFW, конечно же), действие которой происходит сразу после финала первого сезона. Как только закончу — сразу выложу. А пока можете смело заваливать мою личку сообщениями, и мы поболтаем об этих прекрасных мальчиках.

