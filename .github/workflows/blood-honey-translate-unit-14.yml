name: Translate Blood and Honey unit 14

on:
  push:
    paths:
      - '.github/workflows/blood-honey-translate-unit-14.yml'

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tim8es/book-translator
          ref: a0c1a3c450a8251d2d90f4de5d5a988b5466958f
          path: .workflow-engine
      - name: Claim unit 14 as translator
        shell: python
        run: |
          import os, sys
          from pathlib import Path
          sys.path.insert(0, str((Path('.workflow-engine') / 'scripts').resolve()))
          from workflow.claims import ClaimManager
          from workflow.filesystem import FilesystemStorage
          from workflow.repository import WorkflowStateRepository
          from workflow.schemas import SchemaKind
          book = Path('books/blood-and-honey-rbmk-caleb-pov').resolve()
          repo = WorkflowStateRepository(FilesystemStorage(book))
          progress = repo.read('progress.json', SchemaKind.PROGRESS)
          metadata = repo.read('metadata.json', SchemaKind.METADATA).data
          ClaimManager(repo).acquire(progress.data, '14', role='translator',
              session_id=f"gha-{os.environ['GITHUB_RUN_ID']}-translator-014",
              base_revision=progress.version, base_commit=os.environ['GITHUB_SHA'],
              workflow_revision=metadata['workflow']['resolved_revision'])
      - name: Write Russian Chapter 12 translation
        shell: bash
        run: |
          cat > books/blood-and-honey-rbmk-caleb-pov/translated/014-chapter-12.md <<'EOF'
          ## Глава 12

          Примечания к главе

          > Я видела немало восторгов на тему того, как людям нравится думать, будто они смогут «исправить» Эндрю, и всё, что я могу на это сказать: «Каждому своё». Для меня он немного (очень) чересчур в духе Таргариенов/Ланнистеров, так что я не самый большой его поклонник, но если это ваш типаж — осуждать не буду. При этом здесь я его совершенно не щадила. Он такой же безумный, как и в сериале. Зато надо признать: он отлично оттеняет Ариана — особенно по тому, как по-разному Калеб реагирует, когда эти двое хватают его, таскают куда хотят и раздают приказы.

          Калеб судорожно вдохнул и очнулся в комнате кремовых тонов с высокими потолками, покрытыми сложной лепниной, и стенами, украшенными гобеленами и рельефами. Взгляд быстро заметался по знакомой архитектуре, впитывая как можно больше деталей.

          Болел каждый сантиметр тела.

          Калеб попытался вспомнить почему.

          Он был на яхте, смотрел, как фигура Ариана уменьшается у края причала. Грудь болела, глаза были полны слёз.

          Потом его взорвали.

          — Где я? — спросил он вслух и попытался сесть, преодолевая ломоту и боль.

          Калеб зашипел и посмотрел на капельницу, игла которой входила в тыльную сторону ладони.

          — Добро пожаловать домой, мой дорогой брат.

          Богатый аристократический голос лениво протянул слова со стороны окон, занимавших почти всю стену слева от кровати.

          Над Калебом ухмылялся мужчина с прямыми светлыми волосами до плеч в безупречно скроенном чёрном костюме-тройке. Злобный блеск затемнял его небесно-голубые глаза до кобальтового.

          — Эндрю, — произнёс Калеб.

          Пытаясь сесть, он осторожно коснулся головы и болезненно застонал: виски уже начинала раскалывать приближающаяся мигрень. Дыхание стало рваным, пока куски происходящего складывались в единое целое.

          — Это ты взорвал яхту, да?

          — Именно я, — ухмыльнулся Эндрю.

          Калеб отодвинул боль на задний план и заставил себя как можно небрежнее откинуться на руки.

          — Ценю честность. И всё же, как видишь, я *всё ещё* дышу.

          Он надел фирменную озорную улыбку.

          — Какое разочарование.

          Эндрю рассмеялся, и ухмылка превратилась в зловещую улыбку.

          — Я уничтожил тот корабль не для того, чтобы убить тебя, — сказал он, приближаясь к кровати. — Совсем наоборот. Я сделал это, чтобы вернуть тебя.

          Он склонился над Калебом. Большой палец с едва ощутимым нажимом провёл по порезу на скуле.

          Калеб не смог остановить дрожь. Глаза широко раскрылись; маска исчезла от потрясения после признания Эндрю.

          — Подрыв должен был быть предельно точным, чтобы я получил тебя назад целым и невредимым — едва с царапиной. А вот твой Ариан должен думать, что ты мёртв.

          Голос звучал тихо, почти шёпотом, но ничего успокаивающего в нём не было. Эндрю жестоко улыбался и продолжал поглаживать порез на щеке Калеба.

          Лицо Калеба окаменело. Челюсти сжались, губы превратились в тонкую линию. Он оттолкнул руку Эндрю.

          Тот фыркнул, выпрямился и поправил манжеты рубашки.

          — Вообще-то мне стоит поблагодарить Пола. Не будь его тайного заговора против меня, я бы понятия не имел, как отделить тебя от твоей защиты на Сицилии. Он сам доставил тебя прямо мне в руки. Жаль только, Полу пришлось за это умереть.

          Дыхание Калеба снова стало рваным.

          В конце концов Пол оказался хорошим человеком.

          — Ну что поделать. Он меня предал, так что теперь находится именно там, где ему и место.

          Теперь Калеб дрожал сильнее от ярости, чем от страха. Лицо исказила злая гримаса. Он рванулся вперёд и ударил кулаком в самодовольное лицо Эндрю, но в ослабленном состоянии брат легко отбил удар и без всякого усилия отвёл руку Калеба в сторону.

          — Ты чудовище! — прорычал Калеб ему в лицо. — Почему? Ты снова и снова пытался меня убить. Зачем теперь возвращать меня домой?

          Это не имело никакого смысла. Калеб с Эндрю не ладили и раньше, задолго до всего, что произошло за последний месяц, но он не мог придумать ни одной причины, по которой брат пошёл бы на такие хлопоты ради его возвращения — разве что собирался убить собственными руками.

          Эндрю посмотрел в окно на дворцовый двор.

          — Моя коронация через неделю. Ты больше не представляешь для меня угрозы. Игру престолов я выиграл.

          Он снова повернулся к Калебу и улыбнулся, всё ещё удерживая его руку.

          — Но в одной совсем другой игре…

          Эндрю замолчал, наклонился вперёд и заставил Калеба отступить. В итоге тот оказался почти прижат к матрасу, а над ним нависал брат с широкой и опасной улыбкой Чеширского кота.

          — В какой ещё игре? — осмелился спросить Калеб.

          — В игре под названием *любовь*, — прошептал Эндрю.

          Калеба едва не стошнило.

          — До недавнего времени я и не думал, что у меня есть шанс. Мне никогда не приходило в голову, что тебе нравятся мужчины, Калеб.

          Эндрю схватил его за подбородок и болезненным щипком потянул вверх, заставив снова сесть. Их лица оказались непозволительно близко.

          Слова брата не укладывались в голове, но по мере того, как понимание медленно подкрадывалось, желудок Калеба сворачивало всё сильнее.

          — Такой низкосортный мафиозный ублюдок тебя не заслуживает.

          Калеб дёрнул головой, но Эндрю сжал подбородок ещё сильнее, заставляя смотреть ему в глаза.

          — Ты мой. Только мой.

          Жестокие голубые глаза впились в Калеба.

          На лице принца с новой силой появилась гримаса отвращения. Он изо всех сил толкнул Эндрю в грудь и сам в процессе рухнул обратно на кровать. Грудь тяжело вздымалась.

          — Злишься? Мой маленький Калеб.

          Эндрю откровенно забавлялся, и от этого перед глазами Калеба стало красно.

          — Не будь таким несговорчивым. Ты всегда таким был.

          — Ты отвратителен! Мы *братья*, больной ты ублюдок!

          Калеб вложил в слова всё отвращение, на которое был способен. Если бы его только что не взорвали, он, наверное, прямо сейчас попытался бы убить Эндрю на месте. Наглость брата просто не укладывалась в голове.

          Эндрю отвернулся, подошёл к маленькому столу у изножья кровати и вернулся с папкой королевского синего цвета. Бросил её на одеяло поверх ног Калеба.

          Теперь голос стал жёстким. Весь юмор исчез, обнажив под ним чистую злобу.

          — Через три дня состоится пресс-конференция. На ней ты публично обвинишь Ариана Конти в похищении и множестве других преступлений, совершённых под принуждением, и ясно заявишь, что между вами нет ничего романтического. После этого сможешь жить дальше и по-прежнему будешь принят нашей королевской семьёй.

          Лёгкая расслабленная улыбка Эндрю стала острее.

          — Но если вдруг передумаешь, обещаю: найдётся *бесконечное* множество способов превратить твою новую жизнь здесь в сущий ад.

          Он снова наклонился над Калебом, приблизив лицо почти вплотную.

          — Выучи речь наизусть. И даже *не смей* менять ни слова.

          Взгляд Эндрю буравил его. Тот тихо усмехнулся.

          — Не могу дождаться лица Ариана Конти, когда он услышит твою маленькую речь… — протянул Эндрю, неспешно возвращаясь к окнам, — рядом со своей новоиспечённой женой.

          Ярость Калеба стала почти осязаемой. Его трясло так сильно, что в голове не осталось ни одной мысли, кроме желания убить собственного брата.

          Эндрю был чудовищем.

          *Как он смеет* использовать Калеба, чтобы сделать больно Ариану.

          *Как он смеет* взрывать Калеба, а потом заявлять, будто любит его.

          *Как он смеет* ожидать, что Калеб послушно прогнётся под каждую больную, извращённую прихоть Эндрю.

          С Калеба хватило роли хорошего, послушного принца.

          Если Эндрю хочет, чтобы он произнёс речь, — Калеб произнесёт.

          А после брат может сбросить его в любой ад, который только сумеет придумать. Это уже не важно.

          Калеб умел играть.

          И теперь?

          Теперь он хотел крови.

          +++

          Через три дня после возвращения в Лондон личная охрана Эндрю запихнула Калеба на заднее сиденье автомобиля и отвезла к башне Елизаветы.

          В качестве доспехов Калеб выбрал кремовый костюм, светло-голубую рубашку на пуговицах и галстук королевского синего цвета с тонкими белыми диагональными полосами. Чтобы нанести максимальный урон, выглядеть нужно было безупречно.

          Большинство травм после взрыва за эти дни успели зажить. В кабинете, который на день отвели Эндрю, Калеба встретила стилист. Она тщательно скрыла пожелтевшие синяки, всё ещё заметные на коже, и замаскировала тёмные круги под глазами — пока Калеб не стал выглядеть почти сияюще здоровым.

          Он попросил не трогать волосы и, к удивлению, получил согласие. Калеб провёл рукой по кудрям, взъерошив их в любимом — небрежном и обаятельном — беспорядке, и оставил всё как есть.

          Когда стилист уже собирала вещи, в кабинет неспешно вошёл Эндрю. Руки были в карманах, движения полны уверенности человека, который совершенно убеждён в собственной победе.

          Калебу захотелось его ударить.

          Кулак сжался на бедре, но вставать он не стал.

          — Оставьте нас, — приказал Эндрю стилисту и охранникам.

          Все поклонились и вышли. Стоило двери закрыться, как Эндрю лениво обошёл Калеба по кругу и остановился прямо перед ним.

          — Мой дорогой Калеб. Если будешь хорошо себя вести, у меня на тебя такие планы.

          Тыльной стороной согнутого пальца он провёл по лицу Калеба. Тот с отвращением дёрнул головой в сторону. Горло обожгла кислая желчь.

          — *Не трогай меня*, — прорычал Калеб.

          Глаза почти светились яростью.

          — Калеб, Калеб, Калеб, — вздохнул Эндрю, раздражённо скривившись. — Мне правда нужно напоминать, что поставлено на карту? Если ты не выйдешь туда и не произнесёшь свою маленькую речь точь-в-точь как написано, тогда речь произнесу я. И поверь, брат мой, я буду *куда* жестче. Произнесёшь — и сможешь вернуться домой. Откажешься — и я познакомлю тебя с такой болью, какую ты даже представить не способен. *Начну* с того, что заставлю смотреть, как я убиваю этого низкосортного мафиози за то, что он посмел к тебе прикоснуться. Выбор за тобой.

          Эндрю дважды похлопал ладонью Калеба по щеке, развернулся на каблуках и вышел.

          +++

          Двадцать минут спустя Калеб медленно шёл к трибуне в пресс-зале здания парламента, до боли крепко сжимая в кулаке синюю папку с речью.

          Шаги были размеренными. Взгляд опущен. Плечи ссутулены.

          Калеб положил папку на трибуну и глубоко вдохнул, собирая воедино всю храбрость, которая у него оставалась. Затем поднял глаза в дальний конец зала.

          Там стоял Эндрю и наблюдал за ним с самодовольной, жестокой ухмылкой.

          Пальцы Калеба сильнее стиснули края трибуны. Он тяжело сглотнул, пытаясь избавиться от тревожного кома в горле.

          — Доброе утро, дамы и господа. Многие из вас слышали определённые слухи о моей семье и моей личной жизни. Именно поэтому сегодня я стою перед вами и созвал эту пресс-конференцию.

          Калеб опустил взгляд на папку. Глаза скользнули по словам, написанным для него Эндрю.

          — Около месяца назад я отправился на Сицилию. Как только прибыл на таможню, мой паспорт разорвали. Прежде чем я понял, что происходит, меня похитили.

          По залу прокатились изумлённые вздохи. Калеб обвёл взглядом ошеломлённые лица журналистов.

          — Похищение принца — международное преступление! Кто это сделал, Ваше Высочество? — выкрикнул один из репортёров.

          — Это была террористическая организация? — почти сразу поднялся и спросил другой.

          Грудь Калеба быстро вздымалась.

          Вот он, момент истины.

          Именно этого ждал Эндрю.

          Калеб встретился с жестокими ледяно-голубыми глазами брата, затем снова опустил взгляд на речь. Пальцы сжимали бумагу почти до разрыва. Взгляд бегал по строкам, но не видел слов.

          В ушах грохотало собственное сердце.

          — Нет. Это была не террористическая группировка. Человеком, который похитил меня, был Крёстный отец семьи Конти — Ариан Конти.

          Калеб посмотрел прямо в толпу и наблюдал, как зал реагирует на его слова.

          Шок. Неверие. Возмущение.

          За спинами журналистов Эндрю беззвучно хмыкнул, кивнул и повернулся к открытым дверям в коридор.

          Стоило брату отвернуться, как Калеб расправил плечи. Посмотрел вниз на папку, ухмыльнулся и захлопнул её.

          — *Но*, — произнёс он спокойно и ровно, — у этого так называемого похищения есть продолжение. Королевская семья продала меня Ариану. Они же сделали меня козлом отпущения за чудовищное преступление, которое на Сицилии совершил мой старший брат Эндрю.

          Вспышки камер стали почти ослепительными.

          Калеб улыбнулся.

          Эндрю хотел зрелища. Хотел окончательной точки в своей маленькой демонстрации власти. Калеб позаботился, чтобы всё рвануло ему в лицо как можно эффектнее.

          Три мучительно долгих, пытливых дня он безупречно играл роль.

          Теперь широкая, почти восторженная улыбка Калеба была естественной и расслабленной.

          Он выбрал сторону.

          Выбрал человека, который выбрал его, — а не семью, которая его продала.

          Самой большой ошибкой Калеба было пытаться стать тем, кем он не являлся. Он старался быть тихим, удобным гостем, думая, что именно этого хотел бы Ариан.

          Как глупо.

          На приёме Карузо Ариан сказал журналистам: одна из вещей, которые нравятся ему в Калебе больше всего, — неспособность делать то, чего от него ждут.

          Очевидно, Калеб слушал недостаточно внимательно.

          Теперь он слушал.

          Прошлое это не исправит. Но по крайней мере Калеб может проиграть, сражаясь, а не просто позволяя событиям происходить с ним.

          Он продолжил говорить, прекрасно понимая, что рано или поздно его стащат со сцены и бросят в любой ад, который приготовил Эндрю.

          — Разумеется, зная моего брата, на этом он останавливаться не собирался. Он предпринял несколько неудачных попыток меня убить.

          Калеб с самодовольным удовлетворением увидел, как Эндрю резко развернулся. Брат почти дрожал от ярости, и Калеб ощущал её через весь зал.

          — А вот Ариан Конти снова и снова спасал мне жизнь.

          Эндрю ничего уже не мог сделать.

          Теперь Калеб оправдает Ариана, на этот раз спасёт *его* жизнь — и с широкой, удовлетворённой улыбкой пойдёт навстречу собственной судьбе.

          — И где-то по дороге, пока мы проводили всё больше времени вместе, между нами возникли чувства.

