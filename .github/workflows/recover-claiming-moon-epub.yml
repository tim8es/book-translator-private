name: Verify and recover The Claiming Moon original EPUB
on:
  push:
    branches:
      - migration/claiming-moon-source-epub-recovery-20261021
    paths:
      - .github/workflows/recover-claiming-moon-epub.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download original from author's public AO3 work
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/claiming-source"
          curl --fail --location --retry 2 --retry-delay 3 --connect-timeout 15 --max-time 120 \
            --user-agent 'Mozilla/5.0 BookTranslatorSourceRecovery/1.0' \
            'https://archiveofourown.org/downloads/70374321/The%20Claiming%20Moon.epub' \
            --output "$RUNNER_TEMP/claiming-source/The_Claiming_Moon.epub"
          wc -c < "$RUNNER_TEMP/claiming-source/The_Claiming_Moon.epub"
      - name: Gate on exact user-provided EPUB identity
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s  %s\n' \
            '611d1717e7997955619576a667073b79b815bf7606c6ea4513c823b01c53c9bb' \
            "$RUNNER_TEMP/claiming-source/The_Claiming_Moon.epub" | sha256sum --check --status || {
            echo 'BLOCKED: Source EPUB does not match user-provided file. Nothing saved.' >&2
            exit 1
          }
      - name: Initialize and seal canonical book without touching incoming drafts
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -f books/the-claiming-moon/progress.json
          test ! -f books/the-claiming-moon/metadata.json
          python scripts/book.py extract "$RUNNER_TEMP/claiming-source/The_Claiming_Moon.epub" \
            --slug the-claiming-moon --target-language ru --source-language en
          python scripts/corpus.py seal the-claiming-moon
          python scripts/book.py validate the-claiming-moon
          python scripts/corpus.py verify the-claiming-moon
      - name: Commit only new canonical source and initial state
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- books/the-claiming-moon/source books/the-claiming-moon/extracted \
            books/the-claiming-moon/source-revisions \
            books/the-claiming-moon/metadata.json books/the-claiming-moon/progress.json \
            books/the-claiming-moon/review-ledger.json books/the-claiming-moon/source-manifest.json \
            books/the-claiming-moon/source-revisions.json \
            books/the-claiming-moon/glossary.md books/the-claiming-moon/style-guide.md
          git diff --cached --name-only
          git commit -m 'migration: initialize sealed canonical source from exact original EPUB'
          git push origin HEAD:migration/claiming-moon-source-epub-recovery-20261021
