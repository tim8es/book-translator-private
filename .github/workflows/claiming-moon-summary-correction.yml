name: Claiming Moon summary faithful translation correction
on:
  push:
    branches: [review/claiming-moon-summary-source-fidelity-20261022]
    paths: [.github/workflows/claiming-moon-summary-correction.yml]
permissions:
  contents: write
jobs:
  correction:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare canonical source and accept corrected summary translation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path

          ROOT = Path("books/the-claiming-moon")
          SLUG = "the-claiming-moon"
          REV = "5e0731da8b7ca81ada5316ed536a8a954008b789"
          def run(*args):
              subprocess.run(list(map(str, args)), check=True)
          def out(*args):
              return subprocess.check_output(list(map(str, args)), text=True).strip()
          def sha(data):
              return hashlib.sha256(data).hexdigest()

          meta = json.loads((ROOT / "metadata.json").read_text(encoding="utf-8"))
          assert meta["workflow"]["resolved_revision"] == REV
          assert meta["source"]["revision_id"] == "source-000001"
          run("python", "scripts/book.py", "validate", SLUG)
          run("python", "scripts/corpus.py", "verify", SLUG)
          claims = json.loads(out("python", "scripts/book.py", "claims", SLUG, "--json"))
          assert not claims.get("claims"), "active claim; stop rather than race"
          p = json.loads((ROOT / "progress.json").read_text(encoding="utf-8"))
          chapter = p["chapters"][1]
          assert chapter["unit_id"] == "chapter-000002" and chapter["status"] == "translated"
          assert chapter["translation_acceptance"]["workflow_revision"] == REV
          source = ROOT / chapter["source_path"]
          target = ROOT / chapter["translation_path"]
          original = target.read_text(encoding="utf-8")
          assert sha(target.read_bytes()) == chapter["translation_acceptance"]["translation_sha256"]
          assert sha(source.read_bytes()) == chapter["translation_acceptance"]["source_sha256"]
          source_text = source.read_text(encoding="utf-8")
          assert "Bangtan Boys | BTS" in source_text and "mated and knotted" in source_text

          old = "И каждого пойманного омегу делают парой и связывают узлом на глазах у всей стаи."
          new = "И каждый пойманный омега становится чьей-то парой и сцепляется с альфой узлом во время спаривания — на глазах у всей стаи."
          assert original.count(old) == 1
          assert "**Автор:** Kooktaexd\n\n## Аннотация" in original
          corrected = original.replace(old, new).replace(
              "**Автор:** Kooktaexd\n\n## Аннотация",
              "**Автор:** Kooktaexd\n**Фандом:** 방탄소년단 | Bangtan Boys | BTS\n\n## Аннотация"
          )
          assert corrected != original

          session = "claiming-moon-summary-source-correction-20261022"
          run("python", "scripts/book.py", "claim", SLUG, 2, "--role", "translator", "--session-id", session)
          target.write_text(corrected, encoding="utf-8")
          run("python", "scripts/book.py", "accept-translation", SLUG, 2, "--session-id", session)
          run("python", "scripts/book.py", "release", SLUG, 2, "--session-id", session)
          run("python", "scripts/book.py", "validate", SLUG)
          run("python", "scripts/corpus.py", "verify", SLUG)
          after = json.loads((ROOT / "progress.json").read_text(encoding="utf-8"))
          updated = after["chapters"][1]
          assert updated["status"] == "translated"
          assert updated["translation_acceptance"]["source_sha256"] == sha(source.read_bytes())
          assert updated["translation_acceptance"]["translation_sha256"] == sha(target.read_bytes())
          assert updated["translation_acceptance"]["workflow_revision"] == REV
          assert not any(x["unit_id"] == "chapter-000002" for x in json.loads((ROOT / "review-ledger.json").read_text(encoding="utf-8"))["records"])
          Path("docs/migrations/claiming-moon-summary-source-fidelity-correction.json").write_text(
              json.dumps({
                  "schema_version": 1,
                  "unit_id": "chapter-000002",
                  "original_source_sha256": sha(source.read_bytes()),
                  "previous_translation_sha256": sha(original.encode("utf-8")),
                  "corrected_translation_sha256": sha(target.read_bytes()),
                  "workflow_revision": REV,
                  "changes": [
                      "Restore fandom metadata from summary source header",
                      "Clarify omegaverse mating/knotting semantics; avoid misleading literal rope-knot interpretation"
                  ],
                  "state": "translated",
                  "independent_reviewer_pass": False
              }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Commit changes and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/claiming-moon-summary-correction.yml
          git add -A books/the-claiming-moon/progress.json books/the-claiming-moon/translated/002-the-claiming-moon.md books/the-claiming-moon/.workflow docs/migrations/claiming-moon-summary-source-fidelity-correction.json
          git commit -m "Correct Claiming Moon summary with source-bound Translator acceptance"
          git push origin HEAD:refs/heads/review/claiming-moon-summary-source-fidelity-20261022
