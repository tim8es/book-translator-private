name: One-time Claiming Moon canonical health audit
on:
  push:
    branches:
      - audit/claiming-moon-readonly-canonical-health-20261022
    paths:
      - .github/workflows/claiming-moon-health-audit-once.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify byte-identical original EPUB and manifest
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' '611d1717e7997955619576a667073b79b815bf7606c6ea4513c823b01c53c9bb' 'books/the-claiming-moon/source/The_Claiming_Moon.epub' | sha256sum --check
          python scripts/book.py validate the-claiming-moon
          python scripts/corpus.py verify the-claiming-moon
      - name: Report canonical state and next operation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/book.py status the-claiming-moon --json
          python scripts/book.py resume the-claiming-moon --json
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          result = subprocess.run(
              [sys.executable, "scripts/book.py", "build-status",
               "the-claiming-moon", "--format", "epub", "--json"],
              text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              check=False,
          )
          payload = json.loads(result.stdout)
          print("EPUB readiness:", json.dumps(payload, ensure_ascii=False))
          if result.returncode == 0 and payload.get("state") in {"missing", "current", "stale"}:
              pass
          elif payload.get("state") == "invalid" and payload.get("reason", "").startswith("missing translation artifact: "):
              missing = payload["reason"].split(": ", 1)[1]
              progress = json.loads(Path("books/the-claiming-moon/progress.json").read_text())
              matching = [c for c in progress["chapters"] if c["translation_path"] == missing]
              if len(matching) != 1 or matching[0]["status"] not in {"extracted", "pending"}:
                  raise SystemExit("INVALID: missing an accepted translation, not an incomplete one")
              print("EXPECTED: final EPUB is blocked by uncompleted chapter", matching[0]["number"])
          else:
              raise SystemExit("INVALID: unexpected EPUB build-status failure")
          PY
      - name: Assert preflight did not change book files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -n "$(git status --porcelain -- books/the-claiming-moon)"; then
            echo 'ERROR: Read-only audit changed book files' >&2
            git status --short -- books/the-claiming-moon
            exit 1
          fi
          echo 'PASS: Book files unchanged'
