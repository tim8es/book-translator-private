name: One-time Claiming Moon indexed drafts acceptance
on:
  push:
    branches:
      - migration/claiming-moon-accept-indexed-11-30-20261022
    paths:
      - .github/workflows/one-time-claiming-moon-indexed-drafts.yml
permissions:
  contents: write
jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify EPUB identity, source-indexed draft completeness and canonical state
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/book.py validate the-claiming-moon
          python scripts/corpus.py verify the-claiming-moon
          python - <<'PY'
          import hashlib
          import json
          import re
          import xml.etree.ElementTree as ET
          import zipfile
          from pathlib import Path, PurePosixPath
          book = Path("books/the-claiming-moon")
          progress = json.loads((book / "progress.json").read_text(encoding="utf-8"))
          reference = json.loads(Path("docs/migrations/the-claiming-moon-source-reference.json").read_text(encoding="utf-8"))
          epub = book / "source/The_Claiming_Moon.epub"
          expected = "611d1717e7997955619576a667073b79b815bf7606c6ea4513c823b01c53c9bb"
          if hashlib.sha256(epub.read_bytes()).hexdigest() != expected:
              raise SystemExit("Trusted source identity mismatch")
          if reference["source_sha256"] != expected or len(reference["spine"]) != 48:
              raise SystemExit("Incompatible source reference")
          chapters = [11,20,21,22,23,24,25,28,30]
          assert len(chapters) == 9
          assert [ch["number"] for ch in progress["chapters"] if ch["status"] == "reviewed"] == [48]
          assert [ch["number"] for ch in progress["chapters"] if ch["status"] == "translated"] == [43,44,45,46,47]
          prepared = []
          with zipfile.ZipFile(epub) as archive:
              for chapter in chapters:
                  unit = chapter + 2
                  entry = progress["chapters"][unit-1]
                  if entry["status"] != "extracted" or "translation_acceptance" in entry:
                      raise SystemExit(f"Unexpected accepted unit {unit}")
                  if entry["unit_id"] != f"chapter-{unit:06d}":
                      raise SystemExit(f"Unit ID mismatch: {unit}")
                  target = book / entry["translation_path"]
                  if target.exists():
                      raise SystemExit(f"Refusing overwrite of canonical target: {target}")
                  spine = reference["spine"][unit-1]
                  matching = [name for name in archive.namelist()
                              if PurePosixPath(name).name == spine["basename"]]
                  if len(matching) != 1:
                      raise SystemExit(f"Cannot resolve source XHTML unit {unit}")
                  source_bytes = archive.read(matching[0])
                  if hashlib.sha256(source_bytes).hexdigest() != spine["sha256"]:
                      raise SystemExit(f"Source XHTML hash mismatch: chapter {chapter}")
                  xml = ET.fromstring(source_bytes)
                  all_blocks = [n for n in xml.iter()
                                if n.tag.split("}")[-1] in {"h1","h2","h3","h4","p"}]
                  nonempty = [n for n in all_blocks if "".join(n.itertext()).strip()]
                  if len(all_blocks) != spine["blocks"] or len(nonempty) != spine["nonempty_blocks"]:
                      raise SystemExit(f"Original spine block drift: chapter {chapter}")
                  stage = book / f"migration-staging/{unit:03d}-chapter-{chapter:03d}-UNREVIEWED.md"
                  original_draft = stage.read_text(encoding="utf-8")
                  markers = list(re.finditer(r"<!--\s*source-block\s+(\d+)\s*-->", original_draft))
                  index = [int(m.group(1)) for m in markers]
                  if index != list(range(len(nonempty))):
                      raise SystemExit(f"Draft coverage mismatch: chapter {chapter}, indexed={len(index)}, original={len(nonempty)}")
                  draft_blocks = [original_draft[m.end(): markers[i+1].start() if i+1 < len(markers) else len(original_draft)].strip()
                                  for i, m in enumerate(markers)]
                  if any(not part for part in draft_blocks):
                      raise SystemExit(f"Missing target block for nonempty source: chapter {chapter}")
                  clean = "\n\n".join(draft_blocks).rstrip() + "\n"
                  prepared.append({
                    "chapter": chapter, "unit": unit, "target": str(target),
                    "stage_sha256": hashlib.sha256(stage.read_bytes()).hexdigest(),
                    "translation_sha256": hashlib.sha256(clean.encode("utf-8")).hexdigest(),
                    "source_blocks_all": len(all_blocks), "source_blocks_nonempty": len(nonempty),
                    "scheme": "nonempty_xhtml_blocks",
                  })
                  print(f"STRUCTURAL PASS chapter={chapter} unit={unit} nonempty={len(nonempty)} "
                        f"target_sha256={prepared[-1]['translation_sha256']}")
          Path(".github/claiming-moon-indexed-admission.json").write_text(
              json.dumps(prepared, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Claim each unit and accept its canonical target with exact SHA-256
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          from pathlib import Path
          book = Path("books/the-claiming-moon")
          rows = json.loads(Path(".github/claiming-moon-indexed-admission.json").read_text(encoding="utf-8"))
          for row in rows:
              unit, chapter = row["unit"], row["chapter"]
              session = f"claiming-intake-nonempty-translator-{unit}-20261022"
              def call(*args):
                  subprocess.run(["python", "scripts/book.py", *map(str,args)], check=True)
              call("claim","the-claiming-moon",unit,"--role","translator","--session-id",session)
              stage = book / f"migration-staging/{unit:03d}-chapter-{chapter:03d}-UNREVIEWED.md"
              raw = stage.read_text(encoding="utf-8")
              marks = list(re.finditer(r"<!--\s*source-block\s+(\d+)\s*-->", raw))
              pieces = [raw[m.end():marks[i+1].start() if i+1 < len(marks) else len(raw)].strip()
                        for i,m in enumerate(marks)]
              clean = "\n\n".join(pieces).rstrip() + "\n"
              target = Path(row["target"])
              if target.exists():
                  raise SystemExit("Unexpected existing translation artifact: " + str(target))
              with target.open("x",encoding="utf-8") as fh:
                  fh.write(clean)
              if hashlib.sha256(target.read_bytes()).hexdigest() != row["translation_sha256"]:
                  raise SystemExit("Translation artifact hash drift")
              call("accept-translation","the-claiming-moon",unit,"--session-id",session,"--json")
              call("release","the-claiming-moon",unit,"--session-id",session)
          PY
      - name: Verify all changed state without attributing Reviewer PASS
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/book.py validate the-claiming-moon
          python scripts/corpus.py verify the-claiming-moon
          python - <<'PY'
          import json
          from pathlib import Path
          book = Path("books/the-claiming-moon")
          progress = json.loads((book/"progress.json").read_text(encoding="utf-8"))
          ledger = json.loads((book/"review-ledger.json").read_text(encoding="utf-8"))
          completed = [x["number"] for x in progress["chapters"] if x["status"] == "translated"]
          expect = sorted([13,22,23,24,25,26,27,30,32,43,44,45,46,47])
          if completed != expect:
              raise SystemExit(f"Unexpected translated units: {completed}; expected {expect}")
          if [x["number"] for x in progress["chapters"] if x["status"] == "reviewed"] != [48]:
              raise SystemExit("Previously reviewed afterword was modified")
          if len(ledger["records"]) != 1 or ledger["records"][0]["unit_id"] != "chapter-000048":
              raise SystemExit("Review evidence mismatch")
          for unit in expect:
              entry = progress["chapters"][unit - 1]
              if "translation_acceptance" not in entry or not (book/entry["translation_path"]).is_file():
                  raise SystemExit(f"Unaccepted translation: {unit}")
          print("PASS: 14 translated but UNREVIEWED units, one reviewed afterword, 33 extracted")
          PY
          test -z "$(git diff --name-only HEAD -- books/the-claiming-moon/incoming books/the-claiming-moon/migration-staging books/the-claiming-moon/extracted books/the-claiming-moon/source books/the-claiming-moon/review-ledger.json)"
      - name: Persist 9 new translations and self-remove one-time workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp .github/claiming-moon-indexed-admission.json docs/migrations/claiming-moon-accepted-translated-indexed-11-30.json
          git add -- books/the-claiming-moon/translated books/the-claiming-moon/progress.json books/the-claiming-moon/.workflow docs/migrations/claiming-moon-accepted-translated-indexed-11-30.json
          git rm -- .github/workflows/one-time-claiming-moon-indexed-drafts.yml
          git diff --cached --name-status
          git commit -m 'migration: accept 9 source-indexed chapters as translated, review pending'
          git push origin HEAD:migration/claiming-moon-accept-indexed-11-30-20261022
