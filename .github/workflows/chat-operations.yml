name: Chat operations

on:
  push:
    branches: [main]
    paths:
      - '.chat-ops/requests/*.json'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      books: ${{ steps.scope.outputs.books }}
      has_pending: ${{ steps.scope.outputs.has_pending }}
      engine_sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Check out book-state queue
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Resolve single immutable public executor version
        id: pin
        shell: bash
        run: echo "sha=$(python automation/runtime_loader.py --print-revision)" >> "$GITHUB_OUTPUT"
      - name: Checkout public queue-discovery engine
        uses: actions/checkout@v7
        with:
          repository: tim8es/book-translator
          ref: ${{ steps.pin.outputs.sha }}
          path: .public-auto-runtime
          fetch-depth: 1
          persist-credentials: false
      - name: Verify public executor matches shared lock
        run: python automation/runtime_loader.py --verify
      - name: Find pending requests grouped by book
        id: scope
        run: python .public-auto-runtime/scripts/chat_ops_discover.py --root . --github-output "$GITHUB_OUTPUT"

  process:
    needs: discover
    if: needs.discover.outputs.has_pending == 'true'
    strategy:
      fail-fast: false
      matrix:
        book_slug: ${{ fromJSON(needs.discover.outputs.books) }}
    concurrency:
      # Shared per-book lane across Auto, ChatOps, and EPUB publishing.
      group: book-operation-${{ matrix.book_slug }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out authoritative book state with write permission
        uses: actions/checkout@v7
        with:
          path: books-repo
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Checkout reviewed, immutable public executor
        uses: actions/checkout@v7
        with:
          repository: tim8es/book-translator
          ref: ${{ needs.discover.outputs.engine_sha }}
          path: books-repo/.public-auto-runtime
          fetch-depth: 1
          persist-credentials: false
      - name: Check execution revision against latest book-state lock
        run: python books-repo/automation/runtime_loader.py --verify
      - name: Execute book-scoped canonical ChatOps operations
        shell: bash
        env:
          BOOK_SLUG: ${{ matrix.book_slug }}
        run: |
          set -euo pipefail
          python books-repo/.public-auto-runtime/scripts/chat_ops_bridge.py \
            --root books-repo \
            --engine books-repo/.public-auto-runtime \
            --book-slug "$BOOK_SLUG" \
            --max-requests 100
