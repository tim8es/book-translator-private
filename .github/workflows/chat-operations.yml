name: Chat operations

on:
  push:
    branches: [main]
    paths:
      - '.chat-ops/requests/*.json'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      books: ${{ steps.scope.outputs.books }}
      has_pending: ${{ steps.scope.outputs.has_pending }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Find pending requests grouped by book
        id: scope
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          requests = Path(".chat-ops/requests")
          results = Path(".chat-ops/results")
          names = set()
          for path in sorted(requests.glob("*.json")):
              if not re.fullmatch(r"[0-9a-f]{32}", path.stem):
                  continue
              if (results / path.name).exists():
                  continue
              try:
                  def unique_pairs(pairs):
                      value = {}
                      for key, val in pairs:
                          if key in value:
                              raise ValueError("duplicate key")
                          value[key] = val
                      return value
                  body = json.loads(path.read_text("utf-8"), object_pairs_hook=unique_pairs)
                  slug = body.get("book_slug") if isinstance(body, dict) else None
                  if not isinstance(slug, str) or not re.fullmatch(
                      r"[a-z0-9][a-z0-9-]{0,99}", slug
                  ):
                      slug = "__invalid__"
              except (OSError, ValueError, UnicodeError):
                  slug = "__invalid__"
              names.add(slug)
          # Matrix max is 256; the scheduled scan collects any overflow later.
          groups = sorted(names)[:200]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              print("books=" + json.dumps(groups or ["__none__"]), file=out)
              print("has_pending=" + str(bool(groups)).lower(), file=out)
          PY

  process:
    needs: discover
    if: needs.discover.outputs.has_pending == 'true'
    strategy:
      fail-fast: false
      matrix:
        book_slug: ${{ fromJSON(needs.discover.outputs.books) }}
    concurrency:
      group: chat-ops-book-${{ matrix.book_slug }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out book state with permission to publish accepted transitions
        uses: actions/checkout@v7
        with:
          path: books-repo
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Check out public Chat executor
        uses: actions/checkout@v7
        with:
          repository: tim8es/book-translator
          # Executor pin is separate from each book's durable workflow revision.
          ref: db27cc1a3369cd3e3da82e2dfe222af33a1f74e0
          path: engine
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Execute this book's canonical state transitions
        shell: bash
        env:
          BOOK_SLUG: ${{ matrix.book_slug }}
        run: |
          python engine/scripts/chat_ops_bridge.py \
            --root books-repo \
            --engine engine \
            --book-slug "$BOOK_SLUG" \
            --max-requests 100
